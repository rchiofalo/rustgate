[target.x86_64-unknown-linux-musl]
pre-build = [
    "export DEBIAN_FRONTEND=noninteractive && export TZ=Etc/UTC && apt-get update && apt-get install -y protobuf-compiler cmake curl",
    "curl -fsSL https://go.dev/dl/go1.22.12.linux-amd64.tar.gz -o /tmp/go.tar.gz && EXPECTED=$(curl -fsSL https://go.dev/dl/go1.22.12.linux-amd64.tar.gz.sha256) && ACTUAL=$(sha256sum /tmp/go.tar.gz | awk '{print $1}') && [ \"$EXPECTED\" = \"$ACTUAL\" ] && echo 'Go checksum verified' || (echo 'Go checksum mismatch' && exit 1) && tar -C /usr/local -xzf /tmp/go.tar.gz && rm /tmp/go.tar.gz",
    "ln -sf /usr/local/go/bin/go /usr/bin/go"
]

[target.aarch64-unknown-linux-musl]
pre-build = [
    "export DEBIAN_FRONTEND=noninteractive && export TZ=Etc/UTC && apt-get update && apt-get install -y protobuf-compiler cmake curl gcc-aarch64-linux-gnu",
    "curl -fsSL https://go.dev/dl/go1.22.12.linux-amd64.tar.gz -o /tmp/go.tar.gz && EXPECTED=$(curl -fsSL https://go.dev/dl/go1.22.12.linux-amd64.tar.gz.sha256) && ACTUAL=$(sha256sum /tmp/go.tar.gz | awk '{print $1}') && [ \"$EXPECTED\" = \"$ACTUAL\" ] && echo 'Go checksum verified' || (echo 'Go checksum mismatch' && exit 1) && tar -C /usr/local -xzf /tmp/go.tar.gz && rm /tmp/go.tar.gz",
    "ln -sf /usr/local/go/bin/go /usr/bin/go",
    "ln -sf /usr/bin/aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-musl-gcc"
]
