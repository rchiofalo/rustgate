[package]
name = "rustgate-core"
description = "Core types, traits, and abstractions for rustgate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
fuzz = ["dep:arbitrary"]
# PEM parsing helpers (certificates, private keys, CA trust stores). Enable
# this feature in crates that previously rolled their own PEM parsing so
# they share a single error mapping via `rustgate_core::pem`.
pem = ["dep:rustls", "dep:rustls-pki-types"]

[dependencies]
arbitrary = { workspace = true, optional = true }
bytes = { workspace = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
