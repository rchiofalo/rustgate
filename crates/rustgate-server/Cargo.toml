[package]
name = "rustgate-server"
description = "Rustgate server binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rustgate"
path = "src/main.rs"

[lints]
workspace = true

[features]
nats = ["dep:rustgate-nats"]
enrollment = ["dep:rustgate-enrollment"]
est = ["enrollment", "rustgate-enrollment/est"]
proto = ["dep:rustgate-proto", "rustgate-transport/proto", "rustgate-http?/proto"]
full-detail = ["nats", "rustgate-nats/full-detail"]
metrics = ["dep:prometheus", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "rustgate-core/metrics", "rustgate-http?/metrics"]
federation = ["dep:rustgate-federation", "rustgate-federation/v2", "rustgate-federation/api"]
federation-ha = ["federation", "rustgate-federation/ha"]
# Sub-features selecting which dynamic peer-discovery backends the server
# binary will ship with (issue #571). The `peer-discovery` umbrella enables
# all three; each sub-feature may be enabled independently.
peer-discovery = [
    "federation",
    "rustgate-federation/peer-discovery",
    "peer-discovery-dns-sd",
    "peer-discovery-consul",
    "peer-discovery-etcd",
]
peer-discovery-dns-sd = ["federation", "rustgate-federation/peer-discovery-dns-sd"]
peer-discovery-consul = ["federation", "rustgate-federation/peer-discovery-consul"]
peer-discovery-etcd = ["federation", "rustgate-federation/peer-discovery-etcd"]
websocket = ["dep:rustgate-websocket"]
mqtt = ["dep:rustgate-mqtt"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "rustgate-http?/otel"]
fips = ["rustgate-transport/fips", "rustgate-federation?/fips", "rustgate-enrollment?/fips", "rustgate-http?/fips"]
post-quantum = ["rustgate-transport/post-quantum", "rustgate-federation?/post-quantum", "rustgate-http?/post-quantum"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
ocsp = ["rustgate-transport/ocsp"]
spiffe = ["rustgate-transport/spiffe"]
# Enables the optional Cedar authz policy backend and `--authz-policy-format cedar`.
cedar = ["rustgate-authz/cedar"]
http = ["dep:rustgate-http"]
# Emit a JSON Schema for `rustgate.toml` via the `emit-schema` subcommand
# so operators can wire it into VS Code (Even Better TOML) or any
# JSON-Schema-aware editor for autocomplete + inline validation. Pulls in
# `schemars` only when this feature is enabled — the default build keeps
# the dep tree unchanged. Issue #815, F-137.
schema = ["dep:schemars"]

[dependencies]
arc-swap = { workspace = true }
rustgate-authz = { workspace = true }
rustgate-core = { workspace = true }
rustgate-cot = { workspace = true }
rustgate-transport = { workspace = true }
rustgate-websocket = { workspace = true, optional = true }
rustgate-mqtt = { workspace = true, optional = true }
rustgate-nats = { workspace = true, optional = true }
rustgate-enrollment = { workspace = true, optional = true }
rustgate-proto = { workspace = true, optional = true }
rustgate-federation = { workspace = true, optional = true }
rustgate-http = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
rustls-pki-types = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "signal", "fs", "macros", "time", "net"] }
tokio-util = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
figment = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
x509-parser = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
rustix = { workspace = true }
time = { workspace = true }

[dev-dependencies]
rustgate-test-utils = { workspace = true }
rustgate-transport = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
serial_test = { workspace = true }
smol_str = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
bytes = { workspace = true }
