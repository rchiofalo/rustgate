[package]
name = "rustgate-server"
description = "Rustgate server binary"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rustgate"
path = "src/main.rs"

[lints]
workspace = true

[features]
nats = ["dep:rustgate-nats"]
enrollment = ["dep:rustgate-enrollment"]

[dependencies]
rustgate-core = { workspace = true }
rustgate-cot = { workspace = true }
rustgate-transport = { workspace = true }
rustgate-nats = { workspace = true, optional = true }
rustgate-enrollment = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "signal", "fs", "macros"] }
tokio-util = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
