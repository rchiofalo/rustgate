[package]
name = "rustgate-server"
description = "Rustgate server binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rustgate"
path = "src/main.rs"

[lints]
workspace = true

[package.metadata.cargo-machete]
# `rustgate-meshtastic` and `rustgate-sapient` are always-linked but the
# codecs are dispatched via the runtime `EntityCodecRegistry` (added in
# #1304) rather than imported by name in this crate's source — a follow-up
# wire-up PR will add the explicit `register(MeshtasticCodec)` /
# `register(SapientCodec)` calls. The crates ship in the binary regardless
# so the codecs are available the moment the registration lands. Refs #865,
# #869.
ignored = ["rustgate-meshtastic", "rustgate-sapient"]

[features]
nats = ["dep:rustgate-nats", "rustgate-admin/nats"]
enrollment = ["dep:rustgate-enrollment"]
est = ["enrollment", "rustgate-enrollment/est"]
proto = ["dep:rustgate-proto", "rustgate-transport/proto", "rustgate-http?/proto"]
full-detail = ["nats", "rustgate-nats/full-detail"]
metrics = [
    "dep:prometheus",
    "dep:hyper",
    "dep:http-body-util",
    "dep:rustgate-metrics",
    "rustgate-authz/metrics",
    "rustgate-cot/metrics",
    "rustgate-proto?/metrics",
    "rustgate-mqtt?/metrics",
    "rustgate-websocket?/metrics",
    "rustgate-http?/metrics",
]
federation = ["dep:rustgate-federation", "rustgate-federation/v2", "rustgate-federation/api", "rustgate-admin/federation"]
federation-ha = ["federation", "rustgate-federation/ha"]
# Mesh-native peer-to-peer multi-hop routing (issue #855). Adds the
# `rustgate_federation::mesh` module and wires direct-neighbor
# bookkeeping into the `FederationManager` lifecycle. The MVP exposes
# the routing surface as a public crate API; downstream binary wiring
# (route advertisement broadcast over the federation transport, hot
# reload of the mesh router, admin endpoints) lands in follow-up
# issues.
mesh-routing = ["federation", "rustgate-federation/mesh-routing"]
# Sub-features selecting which dynamic peer-discovery backends the server
# binary will ship with (issue #571). The `peer-discovery` umbrella enables
# all three; each sub-feature may be enabled independently.
peer-discovery = [
    "federation",
    "rustgate-federation/peer-discovery",
    "peer-discovery-dns-sd",
    "peer-discovery-consul",
    "peer-discovery-etcd",
]
peer-discovery-dns-sd = ["federation", "rustgate-federation/peer-discovery-dns-sd"]
peer-discovery-consul = ["federation", "rustgate-federation/peer-discovery-consul"]
peer-discovery-etcd = ["federation", "rustgate-federation/peer-discovery-etcd"]
websocket = ["dep:rustgate-websocket"]
mqtt = ["dep:rustgate-mqtt"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "rustgate-http?/otel"]
fips = ["rustgate-tls/fips", "rustgate-federation?/fips", "rustgate-enrollment?/fips", "rustgate-http?/fips"]
post-quantum = ["rustgate-tls/post-quantum", "rustgate-federation?/post-quantum", "rustgate-http?/post-quantum"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
ocsp = ["rustgate-tls/ocsp"]
spiffe = ["rustgate-tls/spiffe"]
# Enables the optional Cedar authz policy backend and `--authz-policy-format cedar`.
cedar = ["rustgate-authz/cedar"]
http = ["dep:rustgate-http", "rustgate-admin/http"]
# In-memory CoT `b-i-v` video stream catalog exposed at
# `GET /api/video/streams` on the admin HTTP server. MVP — closes #862.
video = ["rustgate-admin/video"]
# Documentary feature for the Meshtastic / LoRa TAKPacket codec
# (`rustgate-meshtastic`). The codec crate is always linked alongside
# the other always-on wire-format crates (CoT, MAVLink, ASTERIX,
# STANAG-4586) — the registry construction is zero-cost when no
# Meshtastic traffic arrives — so this feature is a no-op selector
# kept so operators and CI can express intent in a `--features` list
# without breaking other always-on conventions. Refs #865.
meshtastic = []
# Documentary feature for the SAPIENT (BSI Flex 335) autonomous-sensor
# protobuf codec (`rustgate-sapient`). The codec crate is always linked
# alongside the other always-on wire-format crates — the registry
# construction is zero-cost when no SAPIENT traffic arrives — so this
# feature is a no-op selector kept so operators and CI can express
# intent in a `--features` list without breaking other always-on
# conventions. Refs #869.
sapient = []
# Emit a JSON Schema for `rustgate.toml` via the `emit-schema` subcommand
# so operators can wire it into VS Code (Even Better TOML) or any
# JSON-Schema-aware editor for autocomplete + inline validation. Pulls in
# `schemars` only when this feature is enabled — the default build keeps
# the dep tree unchanged. Issue #815, F-137.
schema = ["dep:schemars"]

[dependencies]
arc-swap = { workspace = true }
rustgate-admin = { workspace = true }
rustgate-archive = { workspace = true }
rustgate-authz = { workspace = true }
rustgate-core = { workspace = true }
rustgate-cot = { workspace = true }
rustgate-metrics = { workspace = true, optional = true }
# Closes #847. The server registers EntityCodec implementations for
# every wire-format crate at startup so the router can surface
# canonical Entity-kind tags to audit and per-kind metrics. These are
# always-on (no feature gate) because the registry construction is
# zero-cost when no traffic of the corresponding protocol arrives, and
# the codec types themselves are zero-sized.
rustgate-mavlink = { workspace = true }
rustgate-asterix = { workspace = true }
rustgate-stanag4586 = { workspace = true }
rustgate-meshtastic = { workspace = true }
rustgate-sapient = { workspace = true }
rustgate-dis = { workspace = true }
rustgate-tls = { workspace = true }
rustgate-transport = { workspace = true }
rustgate-router = { workspace = true }
rustgate-websocket = { workspace = true, optional = true }
rustgate-mqtt = { workspace = true, optional = true }
rustgate-nats = { workspace = true, optional = true }
rustgate-enrollment = { workspace = true, optional = true }
rustgate-proto = { workspace = true, optional = true }
rustgate-federation = { workspace = true, optional = true }
rustgate-http = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-rustls = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "signal", "fs", "macros", "time", "net"] }
tokio-util = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
figment = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
x509-parser = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
rustix = { workspace = true }
time = { workspace = true }

# `tikv-jemallocator` and `tikv-jemalloc-ctl` are POSIX-only; gating them
# under `cfg(not(target_os = "windows"))` lets a Windows build with the
# `jemalloc` feature flag still resolve cleanly (the dep is simply absent
# on Windows targets) instead of failing to compile the upstream crate.
# Linux/macOS builds with `--features jemalloc` continue to opt in via
# the feature gate below; the dep stays optional so default builds keep
# the system allocator. Refs #831 (F-B).
[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }

[dev-dependencies]
rustgate-test-utils = { workspace = true }
rustgate-transport = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "time"] }
http-body-util = { workspace = true }
hyper = { workspace = true }
bytes = { workspace = true }
