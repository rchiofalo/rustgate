[package]
name = "rustgate-dis"
description = "DIS (IEEE 1278.1 Distributed Interactive Simulation) binary codec for rustgate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rustgate-core = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Schema-parity proptest in `tests/schema_parity.rs` builds a
# `SchemaCodec` from `schemas/pdu_header.yaml` and asserts byte-
# equivalent round-trip against the hand-rolled `PduHeader` codec.
# Not pulled into the production crate — the codec runtime stays
# hand-rolled.
rustgate-codec-schema = { workspace = true }
