[package]
name = "rustgate-router"
description = "Routing engine: Router, ACL, dedup, store-and-forward, position cache, replay, throttling, quota, obligations, egress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Reserved for future per-protocol routing helpers — intentionally
# empty today. The codec and protocol-specific framing primitives
# (LengthPrefixedCodec, TakXmlCodec, TakFrameCodec, MAVLink) live in
# `rustgate-transport` because routing is post-decode: the router
# operates on `RoutableMessage` from `rustgate-core` and never sees
# the wire format.
# CJADC2 multi-domain routing fan-out (closes #853). Enables the
# `crate::cjadc2` planner that takes a [`rustgate_authz::RoutingDecision`]
# and produces per-destination egress envelopes. Off by default —
# non-CJADC2 deployments do not link the planner or pull in the
# routing-decision types.
cjadc2 = ["rustgate-authz/cjadc2"]

[dependencies]
rustgate-core = { workspace = true, features = ["pem"] }
rustgate-cot = { workspace = true }
rustgate-authz = { workspace = true }
rustgate-resilience = { workspace = true }
rustgate-mavlink = { workspace = true }
arc-swap = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "time", "macros"] }
sha2 = { workspace = true }
ring = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lru = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
redb = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rustgate-test-utils = { workspace = true }
rustgate-authz = { workspace = true }
rustgate-tls = { workspace = true }
rustgate-transport = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
tokio-util = { workspace = true }
tokio-rustls = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
tempfile = { workspace = true }
proptest = { workspace = true }
hmac = { workspace = true }
tracing-subscriber = { workspace = true }
