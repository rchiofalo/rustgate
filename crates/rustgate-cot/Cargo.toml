[package]
name = "rustgate-cot"
description = "Cursor on Target (CoT) XML parsing and message extraction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
fuzz = ["dep:arbitrary", "rustgate-core/fuzz"]
# Prometheus metrics for CoT parse counters / histograms (issue #771).
# Off by default so the no-features build of `rustgate-cot` does not pull
# in `prometheus`. Enabled by `rustgate-server` when its own `metrics`
# feature is on.
metrics = ["dep:prometheus", "dep:rustgate-metrics"]

[dependencies]
arbitrary = { workspace = true, optional = true }
rustgate-core = { workspace = true }
rustgate-metrics = { workspace = true, optional = true }
bytes = { workspace = true }
quick-xml = { workspace = true }
lru = { workspace = true }
prometheus = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }

[[bench]]
name = "parse"
harness = false
