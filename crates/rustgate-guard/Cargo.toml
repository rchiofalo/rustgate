[package]
name = "rustgate-guard"
description = "Cross-domain content inspection guard: rate limit, mandatory marking, dedicated audit chain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
metrics = ["dep:prometheus", "dep:rustgate-metrics", "rustgate-resilience/metrics"]

[dependencies]
rustgate-archive = { workspace = true }
rustgate-core = { workspace = true }
rustgate-metrics = { workspace = true, optional = true }
rustgate-resilience = { workspace = true }
rustgate-cot = { workspace = true }
bytes = { workspace = true }
quick-xml = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
time = { workspace = true }
prometheus = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
tempfile = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
prometheus = { workspace = true }
