[package]
name = "rustgate-federation"
description = "TAK Server Federation protocol for rustgate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["prost-types", "tonic-prost"]  # runtime deps for generated gRPC code (v2 feature)

[features]
default = []
v2 = ["dep:tonic", "dep:tonic-prost", "dep:tokio-stream", "dep:prost-types", "dep:prost-build", "dep:tonic-build", "dep:tonic-prost-build", "dep:rustgate-proto"]
ha = ["dep:async-nats"]
api = ["dep:hyper", "dep:http-body-util", "dep:prometheus"]
fips = ["rustls/aws_lc_rs", "rustls/fips", "tonic?/tls-aws-lc"]
post-quantum = ["rustls/aws_lc_rs", "rustls/prefer-post-quantum", "tonic?/tls-aws-lc"]
# Dynamic peer discovery backends (issue #571). Each backend is independently
# selectable; the `peer-discovery` umbrella enables all three.
peer-discovery = ["peer-discovery-dns-sd", "peer-discovery-consul", "peer-discovery-etcd"]
peer-discovery-dns-sd = ["dep:async-trait", "dep:mdns-sd"]
peer-discovery-consul = ["dep:async-trait", "dep:reqwest"]
peer-discovery-etcd = ["dep:async-trait", "dep:etcd-client"]

[dependencies]
rustgate-core = { workspace = true, features = ["pem"] }
rustgate-proto = { workspace = true, optional = true }
rustgate-transport = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "macros", "io-util"] }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true, optional = true }
tonic = { workspace = true, features = ["codegen", "transport", "tls-ring", "tls-webpki-roots"], optional = true }
tonic-prost = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
time = { workspace = true }
base64 = { workspace = true }
x509-parser = { workspace = true }
async-nats = { workspace = true, features = ["kv"], optional = true }
hyper = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
zeroize = { workspace = true }
redb = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true, optional = true }
mdns-sd = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
etcd-client = { workspace = true, optional = true }

[build-dependencies]
prost-build = { workspace = true, optional = true }
tonic-build = { workspace = true, optional = true }
tonic-prost-build = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tonic = { workspace = true, features = ["router", "transport", "server"] }
tempfile = { workspace = true }
rustgate-test-utils = { workspace = true, features = ["nats"] }
criterion = { workspace = true }
http-body = { workspace = true }
wiremock = { workspace = true }

[[bench]]
name = "convert"
harness = false
