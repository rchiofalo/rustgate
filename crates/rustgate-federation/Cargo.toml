[package]
name = "rustgate-federation"
description = "TAK Server Federation protocol for rustgate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
v2 = ["dep:tonic", "dep:tonic-prost", "dep:tokio-stream", "dep:prost-types", "dep:prost-build", "dep:tonic-build", "dep:tonic-prost-build", "dep:rustgate-proto"]
ha = ["dep:async-nats"]

[dependencies]
rustgate-core = { workspace = true }
rustgate-proto = { workspace = true, optional = true }
rustgate-transport = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "macros", "io-util"] }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true, optional = true }
tonic = { workspace = true, features = ["codegen", "transport", "tls-ring", "tls-webpki-roots"], optional = true }
tonic-prost = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
x509-parser = { workspace = true }
async-nats = { workspace = true, features = ["kv"], optional = true }
socket2 = "0.6"

[build-dependencies]
prost-build = { workspace = true, optional = true }
tonic-build = { workspace = true, optional = true }
tonic-prost-build = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = { workspace = true }
rustgate-test-utils = { workspace = true }
