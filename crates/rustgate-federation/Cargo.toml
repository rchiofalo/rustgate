[package]
name = "rustgate-federation"
description = "TAK Server Federation protocol for rustgate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
# `prost-types` is a runtime dep for generated gRPC code under the `v2` feature.
# `prost-build` and `tonic-prost-build` are invoked from `build.rs` (see the
# `#[cfg(feature = "v2")]` block); cargo-machete does not parse build scripts
# so they would otherwise be flagged as unused. Refs #831 (F-D).
ignored = ["prost-types", "prost-build", "tonic-prost-build"]

[features]
default = []
v2 = ["dep:tonic", "dep:tonic-prost", "dep:tokio-stream", "dep:prost-types", "dep:prost-build", "dep:tonic-prost-build", "dep:rustgate-proto"]
ha = ["dep:async-nats"]
api = ["dep:hyper", "dep:http-body-util", "dep:prometheus", "dep:rustgate-metrics"]
fips = ["rustls/aws_lc_rs", "rustls/fips", "tonic?/tls-aws-lc"]
post-quantum = ["rustls/aws_lc_rs", "rustls/prefer-post-quantum", "tonic?/tls-aws-lc"]
# Dynamic peer discovery backends (issue #571). Each backend is independently
# selectable; the `peer-discovery` umbrella enables all three.
peer-discovery = ["peer-discovery-dns-sd", "peer-discovery-consul", "peer-discovery-etcd"]
peer-discovery-dns-sd = ["dep:async-trait", "dep:mdns-sd"]
peer-discovery-consul = ["dep:async-trait", "dep:reqwest"]
peer-discovery-etcd = ["dep:async-trait", "dep:etcd-client"]
# JWKS URL fetching with periodic refresh (refs #952). Pulls in reqwest
# behind a federation-scoped feature so deployments that do not need
# remote key discovery do not pay the HTTP-client compile cost. The
# JWKS client re-uses the federation mTLS trust bundle (rustgate-core
# pem helpers + rustls ClientConfig) and does not introduce a separate
# trust path.
jwks = ["dep:reqwest"]
# OpenTelemetry distributed-trace context propagation across federation
# gRPC RPCs (PR-B of #852). When enabled, outbound `V2Client` RPCs
# inject the active `tracing::Span`'s OpenTelemetry context as a W3C
# `traceparent` (and optional `tracestate`) gRPC metadata entry; the
# inbound `FederationService` extracts the same headers and either
# attaches the parent context to the per-RPC span (via
# `tracing-opentelemetry`) or emits a `debug!` for log correlation when
# OTel is off. The `traceparent` parser ships in `rustgate-core` and is
# always available — this feature gates only the OTel-aware inject /
# extract glue. Refs #852.
otel = ["dep:opentelemetry", "dep:tracing-opentelemetry"]

[dependencies]
rustgate-core = { workspace = true, features = ["pem"] }
rustgate-metrics = { workspace = true, optional = true }
rustgate-proto = { workspace = true, optional = true }
rustgate-resilience = { workspace = true }
rustgate-transport = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "macros", "io-util"] }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true, optional = true }
tonic = { workspace = true, features = ["codegen", "transport", "tls-ring", "tls-webpki-roots", "gzip", "zstd"], optional = true }
tonic-prost = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
ring = { workspace = true }
time = { workspace = true }
x509-parser = { workspace = true }
async-nats = { workspace = true, features = ["kv"], optional = true }
hyper = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
zeroize = { workspace = true }
redb = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
lru = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true, optional = true }
mdns-sd = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
etcd-client = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[build-dependencies]
prost-build = { workspace = true, optional = true }
tonic-prost-build = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tonic = { workspace = true, features = ["router", "transport", "server"] }
tempfile = { workspace = true }
rustgate-test-utils = { workspace = true, features = ["nats"] }
criterion = { workspace = true }
http-body = { workspace = true }
wiremock = { workspace = true }
tracing-subscriber = { workspace = true }
# Used by the byte-for-byte HS256 sign regression test in
# `jwt::tests` and the RFC 4231 vector check. Not needed for production
# builds — the migrated code path goes through
# `rustgate_core::crypto::hmac_sha256_*`.
hmac = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "convert"
harness = false
