syntax = "proto3";

package com.atakmap;

import "cotproto/binarypayload.proto";

// FederatedChannel is the gRPC service definition for V2 TAK Server
// federation. Each RPC represents a bidirectional channel between
// two federation peers.
service FederatedChannel {
	rpc SendOneEvent(FederatedEvent) returns (Empty) {}
	rpc BinaryMessageStream(stream BinaryBlob) returns (Empty) {}
	rpc SendOneBlob(BinaryBlob) returns (Empty) {}
	rpc getIdentity (Empty) returns (Identity) {}
	rpc ClientEventStream (Subscription) returns (stream FederatedEvent) {}
	rpc ServerEventStream (stream FederatedEvent) returns (Subscription) {}
	rpc HealthCheck (ClientHealth) returns (ServerHealth) {}
	rpc ClientROLStream (Subscription) returns (stream ROL) {}
	rpc ServerROLStream (stream ROL) returns (Subscription) {}
	rpc ServerFederateGroupsStream (Subscription) returns (stream FederateGroups) {}
	rpc ClientFederateGroupsStream (stream FederateGroups) returns (Subscription) {}
	rpc GetAuthTokenByX509 (BinaryBlob) returns (FederateTokenResponse) {}
	rpc Getx509Identity (Empty) returns (BinaryBlob) {}
}

enum CRUD { INVALID = 0; CREATE = 1; READ = 2; UPDATE = 3; DELETE = 4; }
enum BINARY_TYPES { EMPTY = 0; OTHER = 1; IMAGE = 2; }

message FederatedEvent {
	GeoEvent event = 1;
	ContactListEntry contact = 2;
	repeated string federateGroups = 3;
	repeated FederateProvenance federateProvenance = 4;
	FederateHops federateHops = 5;
	FederateGroupHopLimits federateGroupHopLimits = 6;
}

message GeoEvent {
	int64 sendTime = 1;
	int64 startTime = 2;
	int64 staleTime = 3;
	double lat = 4;
	double lon = 5;
	double hae = 6;
	double ce = 7;
	double le = 8;
	string uid = 9;
	string type = 10;
	string coordSource = 11;
	string other = 12;
	int32 battery = 13;
	string ploc = 14;
	string palt = 15;
	string screenName = 16;
	string groupName = 17;
	string groupRole = 18;
	string phone = 19;
	double speed = 20;
	double course = 21;
	BinaryBlob binary = 22;
	repeated string ptpUids = 23;
	repeated string ptpCallsigns = 24;
	string feedUid = 25;
	repeated string missionNames = 26;
	string access = 27;
	string caveat = 28;
	string releaseableTo = 29;
	repeated gov.tak.cop.proto.v1.BinaryPayload bloads = 30;
}

message BinaryBlob {
	BINARY_TYPES type = 1;
	bytes data = 2;
	string filename = 3;
	int64 timestamp = 4;
	string description = 5;
	repeated FederateProvenance federateProvenance = 6;
	FederateHops federateHops = 7;
	FederateGroupHopLimits federateGroupHopLimits = 8;
}

message ContactListEntry {
	CRUD operation = 1;
	string uid = 2;
	string callsign = 3;
	string phone = 4;
	string sip = 5;
	string directConnect = 6;
}

message Empty { }

message Identity {
    enum ConnectionType {
        FEDERATION_HUB_SERVER = 0;
        FEDERATION_HUB_CLIENT = 1;
        FEDERATION_TAK_SERVER = 2;
        FEDERATION_TAK_CLIENT = 3;
    }
	string name = 1;
	string uid = 2;
	string description = 3;
	ConnectionType type = 4;
	string serverId = 5;
}

message Subscription {
	Identity identity = 1;
	string filter = 2;
    TakServerVersion version = 3;
}

message ClientHealth {
    enum ServingStatus {
        UNKNOWN = 0;
        SERVING = 1;
        NOT_SERVING = 2;
    }
    ServingStatus status = 1;
}

message ServerHealth {
    enum ServingStatus {
        UNKNOWN = 0;
        SERVING = 1;
        NOT_SERVING = 2;
        NOT_CONNECTED = 3;
    }
    ServingStatus status = 1;
}

message ROL {
    string program = 1;
    repeated BinaryBlob payload = 2;
	repeated string federateGroups = 3;
	repeated FederateProvenance federateProvenance = 4;
	FederateHops federateHops = 5;
	FederateGroupHopLimits federateGroupHopLimits = 6;
}

message FederateGroups {
    ServerHealth streamUpdate = 1;
	repeated string federateGroups = 2;
	repeated FederateProvenance federateProvenance = 3;
	FederateHops federateHops = 4;
	repeated FederateGroups nestedGroups = 5;
	FederateGroupHopLimits federateGroupHopLimits = 6;
}

message TakServerVersion {
    int64 major = 1;
    int64 minor = 2;
    int64 patch = 3;
    string branch = 4;
    string variant = 5;
}

message FederateProvenance {
	string federationServerId = 1;
	string federationServerName = 2;
}

message FederateHops {
	int64 maxHops = 1;
	int64 currentHops = 2;
}

message FederateGroupHopLimit {
	string groupName = 1;
	int64 maxHops = 2;
	int64 currentHops = 3;
}

message FederateGroupHopLimits {
	repeated FederateGroupHopLimit limits = 1;
	bool useFederateGroupHopLimits = 2;
}

message FederateTokenResponse {
	string token = 1;
}
