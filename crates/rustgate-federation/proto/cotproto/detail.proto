syntax = "proto3";

package atakmap.commoncommo.protobuf.v1;

import "cotproto/contact.proto";
import "cotproto/group.proto";
import "cotproto/precisionlocation.proto";
import "cotproto/status.proto";
import "cotproto/takv.proto";
import "cotproto/track.proto";

message Detail {
    string xmlDetail = 1;
    Contact contact = 2;
    Group group = 3;
    PrecisionLocation precisionLocation = 4;
    Status status = 5;
    Takv takv = 6;
    Track track = 7;
}
