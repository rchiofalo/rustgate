[package]
name = "rustgate-tls"
description = "TLS/mTLS configuration, certificate handling, OCSP, SPIFFE, and TCP listeners"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
# The `rustls-webpki` PACKAGE builds a lib named `webpki` (its `[lib] name`),
# so `src/mldsa_certs.rs` refers to it as `webpki::aws_lc_rs::ML_DSA_87`.
# cargo-machete matches the package name textually and never sees
# `rustls_webpki`, so it reports a false positive. The dependency is real and
# load-bearing — dropping it fails the `mldsa-certs` build. Refs #501.
ignored = ["rustls-webpki"]

[features]
fips = ["rustls/aws_lc_rs", "rustls/fips"]
post-quantum = ["rustls/aws_lc_rs", "rustls/prefer-post-quantum"]
# ML-DSA-87 (FIPS 204 / RFC 9881) TLS certificate-chain verification (#501).
# Augments the aws-lc-rs provider's signature-verification set; see
# `src/mldsa_certs.rs`. MUTUALLY EXCLUSIVE with `fips` — enforced by a
# `compile_error!` in that module, because `rustls/fips` turns on
# `webpki/aws-lc-rs-fips`, which `#[cfg]`-removes the ML-DSA statics.
mldsa-certs = ["rustls/aws_lc_rs", "dep:rustls-webpki"]
ocsp = ["dep:ocsp-stapler", "dep:lru", "dep:rasn-ocsp"]
spiffe = ["dep:spiffe"]

[dependencies]
rustgate-core = { workspace = true, features = ["pem"] }
arc-swap = { workspace = true }
parking_lot = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
# `aws-lc-rs-unstable` is what exposes `webpki::aws_lc_rs::ML_DSA_87`; rustls's
# own `aws_lc_rs` feature does not enable it (see the root-manifest comment).
rustls-webpki = { workspace = true, optional = true, features = ["std", "aws-lc-rs-unstable"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "time", "macros"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
x509-parser = { workspace = true }
zeroize = { workspace = true }
ocsp-stapler = { workspace = true, optional = true }
rasn-ocsp = { workspace = true, optional = true }
lru = { workspace = true, optional = true }
spiffe = { workspace = true, optional = true }

[dev-dependencies]
# `mldsa` supplies the self-signed ML-DSA-87 test CA used by the `mldsa-certs`
# tests (#501). Enabled unconditionally because Cargo does not accept
# `optional` dev-dependencies; the extra deps it pulls (fips204/x509-cert/der)
# are pure Rust and carry no C-toolchain burden.
rustgate-test-utils = { workspace = true, features = ["mldsa"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
tempfile = { workspace = true }
futures = { workspace = true }
socket2 = { workspace = true }
# Issues the classical ECDSA P-384 leaf that the ML-DSA-87 test CA signs.
rcgen = { workspace = true }
# DER -> PEM for feeding ML-DSA-87 test certificates into `TlsConfig::from_pem`.
base64 = { workspace = true }
# Produces ML-DSA-87 CertificateVerify signatures for the TLS 1.3
# signature-scheme test (cross-checks aws-lc-rs verification against the
# pure-Rust implementation).
fips204 = { workspace = true }
