[package]
name = "rustgate-tls"
description = "TLS/mTLS configuration, certificate handling, OCSP, SPIFFE, and TCP listeners"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
fips = ["rustls/fips"]
# Kept so existing build commands still work. Hybrid post-quantum key exchange
# and ML-DSA certificate verification are on in every build (ADR 0037).
post-quantum = []
mldsa-certs = []
ocsp = ["dep:ocsp-stapler", "dep:lru", "dep:rasn-ocsp"]
spiffe = ["dep:spiffe"]

[dependencies]
rustgate-core = { workspace = true, features = ["pem"] }
arc-swap = { workspace = true }
parking_lot = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "time", "macros"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
x509-parser = { workspace = true }
zeroize = { workspace = true }
ocsp-stapler = { workspace = true, optional = true }
rasn-ocsp = { workspace = true, optional = true }
lru = { workspace = true, optional = true }
spiffe = { workspace = true, optional = true }

[dev-dependencies]
# `mldsa` supplies the self-signed ML-DSA-87 test CA used by the ML-DSA
# verification tests (#501). Enabled unconditionally because Cargo does not accept
# `optional` dev-dependencies; the extra deps it pulls (fips204/x509-cert/der)
# are pure Rust and carry no C-toolchain burden.
rustgate-test-utils = { workspace = true, features = ["mldsa"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
tempfile = { workspace = true }
futures = { workspace = true }
socket2 = { workspace = true }
# Issues the classical ECDSA P-384 leaf that the ML-DSA-87 test CA signs.
rcgen = { workspace = true }
# DER -> PEM for feeding ML-DSA-87 test certificates into `TlsConfig::from_pem`.
base64 = { workspace = true }
# Produces ML-DSA-87 CertificateVerify signatures for the TLS 1.3
# signature-scheme test (cross-checks aws-lc-rs verification against the
# pure-Rust implementation).
fips204 = { workspace = true }
