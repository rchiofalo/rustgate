[package]
name = "rustgate-http"
description = "HTTP/webhook egress bridge for rustgate message routing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
metrics = ["dep:prometheus", "rustgate-core/metrics", "rustgate-resilience/metrics"]
proto = ["dep:prost", "dep:rustgate-proto"]
otel = ["dep:opentelemetry", "dep:tracing-opentelemetry"]
fips = ["rustls/aws_lc_rs", "rustls/fips"]
post-quantum = ["rustls/aws_lc_rs", "rustls/prefer-post-quantum"]

[dependencies]
rustgate-archive = { workspace = true }
rustgate-core = { workspace = true }
rustgate-resilience = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time", "macros", "net"] }
tracing = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
x509-parser = { workspace = true }
zeroize = { workspace = true }
fastrand = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true }
prometheus = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
rustgate-proto = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["prost", "rustls-pki-types"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
wiremock = { workspace = true }
rustgate-test-utils = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }
# Used by the byte-for-byte HMAC regression and known-vector tests in
# `auth::tests` to pin the helper output against the previous inlined
# construction. Not needed for production builds — the migrated code
# path goes through `rustgate_core::crypto::hmac_sha256_*`.
hmac = { workspace = true }
proptest = { workspace = true }
