[package]
name = "rustgate-http"
description = "HTTP/webhook egress bridge for rustgate message routing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
metrics = ["dep:prometheus"]
proto = ["dep:prost", "dep:rustgate-proto"]
otel = ["dep:opentelemetry", "dep:tracing-opentelemetry"]
fips = ["rustls/aws_lc_rs", "rustls/fips"]
post-quantum = ["rustls/aws_lc_rs", "rustls/prefer-post-quantum"]

[dependencies]
rustgate-core = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time", "macros", "net"] }
tracing = { workspace = true }
thiserror = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
fastrand = { workspace = true }
futures = { workspace = true }
time = { workspace = true }
prometheus = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
rustgate-proto = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
wiremock = { workspace = true }
rustgate-test-utils = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }
