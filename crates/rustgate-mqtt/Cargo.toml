[package]
name = "rustgate-mqtt"
description = "MQTT 5.0/3.1.1 transport adapter with mTLS for rustgate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rustgate-core = { workspace = true }
rustgate-transport = { workspace = true }
bytes = { workspace = true }
mqttbytes = { version = "0.6", features = ["v5"] }
tokio = { workspace = true, features = ["net", "time", "sync", "rt", "macros", "io-util"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rustgate-test-utils = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
