[package]
name = "rustgate-mqtt"
description = "MQTT 5.0/3.1.1 transport adapter with mTLS for rustgate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Prometheus metrics for MQTT publish counters / latency / session
# gauge / will-message counter (issue #771). Off by default so the
# no-features build of `rustgate-mqtt` does not pull in `prometheus`.
# Enabled by `rustgate-server` when its own `metrics` feature is on.
metrics = ["dep:prometheus", "dep:rustgate-metrics"]

[dependencies]
rustgate-core = { workspace = true }
rustgate-metrics = { workspace = true, optional = true }
rustgate-resilience = { workspace = true }
rustgate-transport = { workspace = true }
bytes = { workspace = true }
mqttbytes = { version = "0.6", features = ["v5"] }
tokio = { workspace = true, features = ["net", "time", "sync", "rt", "macros", "io-util"] }
parking_lot = { workspace = true }
prometheus = { workspace = true, optional = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rustgate-test-utils = { workspace = true }
rustgate-transport = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
