[package]
name = "rustgate-authz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Policy engine for rustgate RBAC/ABAC authorization"

[lints]
workspace = true

[features]
default = []
# Optional Cedar policy backend. Enables the `CedarBackend` implementation
# of [`PolicyEngine`] so operators with an existing Cedar policy corpus
# can reuse it without rewriting rules in the native JSON format.
cedar = ["dep:cedar-policy", "dep:tracing"]

[dependencies]
rustgate-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
ahash = { workspace = true }
parking_lot = { workspace = true }
smol_str = { workspace = true, features = ["serde"] }
sha2 = { workspace = true }
cedar-policy = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "eval"
harness = false
