[package]
name = "rustgate-authz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Policy engine for rustgate RBAC/ABAC authorization"

[lints]
workspace = true

[features]
default = []
# Optional Cedar policy backend. Enables the `CedarBackend` implementation
# of [`PolicyEngine`] so operators with an existing Cedar policy corpus
# can reuse it without rewriting rules in the native JSON format.
cedar = ["dep:cedar-policy"]
# Prometheus metrics for authz evaluation counters / histogram and the
# decision-cache size gauge (issue #771). Off by default so the
# no-features build of `rustgate-authz` does not pull in `prometheus`.
# Enabled by `rustgate-server` when its own `metrics` feature is on.
metrics = ["dep:prometheus", "dep:rustgate-metrics"]
# CJADC2 multi-domain routing policy (closes #853). Enables the
# `evaluate_route` PEP entrypoint on the optional Cedar backend so
# policies carrying a `@route("…")` annotation lift the contained JSON
# into a [`RoutingDecision`]. The router consumes the decision via its
# own `cjadc2` feature ladder. Pure additive surface — non-CJADC2
# deployments pay nothing because the trait method has a default impl
# returning `RoutingDecision::none()`.
cjadc2 = []

[dependencies]
rustgate-core = { workspace = true }
rustgate-metrics = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
ahash = { workspace = true }
parking_lot = { workspace = true }
smol_str = { workspace = true, features = ["serde"] }
sha2 = { workspace = true }
prometheus = { workspace = true, optional = true }
cedar-policy = { workspace = true, optional = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "eval"
harness = false
