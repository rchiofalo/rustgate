[package]
name = "rustgate-nats"
description = "NATS adapter for stateless TAK termination and cross-instance message delivery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
full-detail = ["dep:rustgate-proto"]

[dependencies]
rustgate-core = { workspace = true }
rustgate-cot = { workspace = true }
rustgate-proto = { workspace = true, optional = true }
rustgate-resilience = { workspace = true }
rustgate-router = { workspace = true }
async-nats = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time"] }
tracing = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
rustgate-test-utils = { workspace = true, features = ["nats"] }
rustgate-authz = { workspace = true }
tracing-subscriber = { workspace = true }
