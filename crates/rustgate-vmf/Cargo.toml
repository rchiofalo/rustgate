[package]
name = "rustgate-vmf"
description = "VMF (Variable Message Format, MIL-STD-6017) bit-level codec for rustgate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rustgate-core = { workspace = true }
# K05.1 decode is driven by `SchemaCodec` over the embedded
# `schemas/k05_1.yaml`. Encode stays hand-rolled (the #1393 lesson
# learned — the bit-stream encode path is the high-risk surface
# and the production hand-rolled implementation is tested by the
# fuzz target + 26 inline unit tests). The schema-parity proptest
# in `tests/schema_parity_k05_1.rs` continues to pin
# byte-identical round-trip between the two paths.
rustgate-codec-schema = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
