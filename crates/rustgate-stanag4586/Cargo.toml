[package]
name = "rustgate-stanag4586"
description = "STANAG 4586 LOI 2-3 telemetry codec for NATO UAS interoperability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rustgate-core = { workspace = true }
# `vehicle_position` is implemented on top of `SchemaCodec`: the YAML
# schema in `schemas/vehicle_position.yaml` declares the wire layout,
# and the wrapper in `src/vehicle_position.rs` projects entity
# attributes back to the typed `VehiclePosition` / `FlightState` API.
# The schema-parity proptest in `tests/schema_parity.rs` pins the
# byte-identical round-trip against the original hand-rolled encoder
# referenced in the git history.
rustgate-codec-schema = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
