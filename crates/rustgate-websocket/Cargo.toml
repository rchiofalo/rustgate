[package]
name = "rustgate-websocket"
description = "WebSocket (wss://) listener with mTLS for rustgate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Prometheus metrics for WebSocket connection / message / compression
# / subprotocol counters and active-connection gauge (issue #771). Off
# by default so the no-features build of `rustgate-websocket` does not
# pull in `prometheus`. Enabled by `rustgate-server` when its own
# `metrics` feature is on.
metrics = ["dep:prometheus", "dep:rustgate-metrics"]

[dependencies]
rustgate-core = { workspace = true }
rustgate-cot = { workspace = true }
rustgate-metrics = { workspace = true, optional = true }
rustgate-resilience = { workspace = true }
rustgate-tls = { workspace = true }
rustgate-router = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
prometheus = { workspace = true, optional = true }
tokio = { workspace = true, features = ["net", "time", "sync", "rt", "macros"] }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
socket2 = { workspace = true }

[dev-dependencies]
rustgate-test-utils = { workspace = true }
rustgate-transport = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tokio-tungstenite = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
futures = { workspace = true }
