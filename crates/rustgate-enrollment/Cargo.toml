[package]
name = "rustgate-enrollment"
description = "Certificate enrollment endpoint for TAK client self-provisioning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
est = ["dep:cms", "dep:der", "dep:x509-cert"]
fips = ["rcgen/fips"]
# Scaffold gate for ML-DSA cert/CRL issuance (ADR 0019 Phase 3). Empty on
# purpose: it does NOT enable rcgen's `aws_lc_rs_unstable` path, because that
# would break FIPS builds and emit pure (owner-rejected) ML-DSA certificates.
# ML-DSA selection fails closed via `signing::issue_mldsa_unavailable` until
# the Composite ML-DSA path lands. See #502.
post-quantum = []

[dependencies]
rustgate-core = { workspace = true, features = ["pem"] }
rustgate-resilience = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "io-util", "sync", "fs", "time"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
tokio-rustls = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
ring = { workspace = true }
cms = { workspace = true, optional = true }
der = { workspace = true, optional = true }
x509-cert = { workspace = true, optional = true }

[dev-dependencies]
rustgate-test-utils = { workspace = true }
x509-parser = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
hyper = { workspace = true, features = ["client"] }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
rcgen = { workspace = true }
proptest = { workspace = true }
