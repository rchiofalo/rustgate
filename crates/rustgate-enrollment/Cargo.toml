[package]
name = "rustgate-enrollment"
description = "Certificate enrollment endpoint for TAK client self-provisioning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
est = ["dep:cms", "dep:der", "dep:x509-cert"]
fips = ["rcgen/fips", "aws-lc-rs/fips"]
# Pure ML-DSA-87 X.509 cert/CRL issuance (RFC 9881, #502). rcgen cannot emit
# ML-DSA, so the `mldsa` module hand-assembles the TBS with x509-cert/der and
# signs the DER with the pure-Rust `fips204` crate. `der`/`x509-cert` are
# shared with the `est` feature (both must build independently and together).
# Composite ML-DSA + ECDSA hybrid certs (ADR 0019) remain deferred until the
# IETF composite-signature draft becomes an RFC; ML-DSA selection still fails
# closed unless an `MlDsaCa` is configured on the signer.
post-quantum = ["dep:fips204", "dep:der", "dep:x509-cert"]

[dependencies]
rustgate-core = { workspace = true, features = ["pem"] }
rustgate-resilience = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "io-util", "sync", "fs", "time"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
tokio-rustls = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
aws-lc-rs = { workspace = true }
cms = { workspace = true, optional = true }
der = { workspace = true, optional = true }
x509-cert = { workspace = true, optional = true }
fips204 = { workspace = true, optional = true }

[dev-dependencies]
rustgate-test-utils = { workspace = true, features = ["mldsa"] }
x509-parser = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
hyper = { workspace = true, features = ["client"] }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
rcgen = { workspace = true }
proptest = { workspace = true }
