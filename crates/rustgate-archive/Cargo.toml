[package]
name = "rustgate-archive"
description = "Encrypted hash-chained archives for tamper-evident audit and store-and-forward"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Surfaced from `rustgate_archive::archive_rotation` so consumers that
# build the rotation task in metrics-enabled mode can depend on the
# matching feature in this crate. The flag itself currently gates only
# documentation in this crate (the on-pass Prometheus gauge is wired in
# the server binary via the `OnRotationStats` callback) but is preserved
# so future archive-side metrics keep a single feature surface.
metrics = []

# SIEM forwarding (ADR 0028, Phase 1a). Off by default. Gates the
# `siem` module — a pure ArcSight CEF payload formatter with no I/O.
# The syslog-over-TLS transport that consumes it is deferred to Phase 1b.
siem = []

[dependencies]
rustgate-core = { workspace = true }
arc-swap = { workspace = true }
bytes = { workspace = true }
chacha20poly1305 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
zeroize = { workspace = true }
argon2 = { workspace = true }
hkdf = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "test-util"] }
tracing-subscriber = { workspace = true }
