[package]
name = "rustgate-lattice"
description = "Anduril Lattice bidirectional adapter — bridge trait, mock backend, and router wiring (real Lattice gRPC SDK behind partner-NDA, deferred to follow-up)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Selects the in-memory `MockLatticeBridge` backend. Used by the
# integration tests and by deployments that want to exercise the
# router → bridge → router path without a real Lattice endpoint
# available. The mock backend is a `tokio::sync::mpsc` round trip —
# no network, no SDK, no auth — so it stays out of the default build.
lattice-mock = []
# Reserved for the real Anduril Lattice gRPC client. The Lattice SDK
# is gated behind partnership / NDA at the time of this crate's
# initial PR; the feature is declared so a follow-up PR can drop in
# the partner-side `tonic` bindings + `LatticeBridge` impl behind the
# same flag without churning every consumer's `--features` list.
# The flag selects no deps today (the real bridge module is an empty
# stub) so a no-feature build of the workspace is unaffected.
lattice-real = []

[dependencies]
rustgate-core = { workspace = true }
rustgate-router = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time", "test-util"] }
toml = { workspace = true }
