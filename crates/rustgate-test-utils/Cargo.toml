[package]
name = "rustgate-test-utils"
description = "Test utilities for rustgate - certificate generation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Don't inherit workspace lints - test utilities use expect() for setup failures
[lints.rust]
unsafe_code = "forbid"
unused_results = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
# Allow panic/expect in test utilities - setup failures should panic
panic = "allow"
dbg_macro = "deny"
unused_async = "warn"

[features]
default = []
nats = ["dep:tempfile", "dep:tokio", "dep:async-nats"]
# Self-signed ML-DSA-87 CA generation for post-quantum issuance tests (#502,
# #501). Pulls the pure-Rust `fips204` plus `x509-cert`/`der` used to
# hand-assemble the self-signed CA certificate.
mldsa = ["dep:fips204", "dep:x509-cert", "dep:der"]

[dependencies]
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
x509-parser = { workspace = true }
time = { workspace = true }

# Optional deps for the `mldsa` feature
fips204 = { workspace = true, optional = true }
x509-cert = { workspace = true, optional = true }
der = { workspace = true, optional = true }

# Optional deps for the `nats` feature
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["net", "time", "io-util", "process", "rt"], optional = true }
# `kv` feature is needed by the `start_completes_only_after_jetstream_accepts_kv_create`
# regression test which put/get's a KV bucket to prove JetStream is operational
# (not just metadata-accepted) once `TestNatsServer::start()` returns. Callers
# of this crate who consume `TestNatsServer` themselves do not need KV — it's
# purely for our internal readiness test — but features are workspace-wide so
# we enable it here rather than bifurcating test vs. non-test dep lines.
async-nats = { workspace = true, features = ["kv"], optional = true }
