[package]
name = "rustgate-transport"
description = "TLS/mTLS listener and connection management"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
proto = ["dep:rustgate-proto"]
fips = ["rustls/aws_lc_rs", "rustls/fips"]
post-quantum = ["rustls/aws_lc_rs", "rustls/prefer-post-quantum"]

[dependencies]
rustgate-core = { workspace = true }
rustgate-cot = { workspace = true }
rustgate-proto = { workspace = true, optional = true }
arc-swap = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "time", "macros"] }
tokio-util = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
x509-parser = { workspace = true }
sha2 = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
rustgate-test-utils = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
futures = { workspace = true }
bytes = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "codec"
harness = false
