[package]
name = "rustgate-transport"
description = "Codec, framing, hardware-identity, and UDP transports for rustgate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
proto = ["dep:rustgate-proto"]
mavlink = ["dep:rustgate-mavlink"]
# Passthrough features so existing transport-test gates (`#![cfg(feature = "fips")]`,
# `#![cfg(feature = "post-quantum")]`, `#![cfg(feature = "ocsp")]`, `#![cfg(feature = "spiffe")]`)
# continue to compile after the TLS extraction (#890). The actual implementation lives
# in `rustgate-tls`; transport just forwards the flag.
fips = ["rustgate-tls/fips"]
post-quantum = ["rustgate-tls/post-quantum"]
mldsa-certs = ["rustgate-tls/mldsa-certs"]
ocsp = ["rustgate-tls/ocsp"]
spiffe = ["rustgate-tls/spiffe"]

[dependencies]
rustgate-core = { workspace = true, features = ["pem"] }
rustgate-cot = { workspace = true }
rustgate-resilience = { workspace = true }
rustgate-router = { workspace = true }
rustgate-proto = { workspace = true, optional = true }
rustgate-mavlink = { workspace = true, optional = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "time", "macros"] }
tokio-util = { workspace = true }
rustls = { workspace = true }
parking_lot = { workspace = true }
lru = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
# socket2 is used by `udp_multicast` to set SO_REUSEADDR on the inbound
# multicast bind so the tactical-radio test rig (and CI on Linux) can
# co-bind the same port from multiple sibling sockets — tokio's
# `UdpSocket` does not expose the option directly. Closes #861.
socket2 = { workspace = true }

[dev-dependencies]
rustgate-tls = { workspace = true }
rustgate-test-utils = { workspace = true }
x509-parser = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
tokio-rustls = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
tempfile = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
# Used by `tests/udp_multicast.rs` for SO_REUSEADDR on sniffer sockets
# that need to co-bind the same multicast port the inbound listener
# also binds. Same workspace pin as the production dep above.
socket2 = { workspace = true }
tracing-subscriber = { workspace = true }

[[bench]]
name = "codec"
harness = false
