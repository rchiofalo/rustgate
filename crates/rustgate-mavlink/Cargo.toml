[package]
name = "rustgate-mavlink"
description = "MAVLink v1/v2 frame codec and transport primitives for rustgate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rustgate-core = { workspace = true }
bytes = { workspace = true }
lru = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Schema-parity proptest in `tests/schema_parity.rs` builds a
# `SchemaCodec` from `schemas/v1_header.yaml` and asserts byte-
# equivalent round-trip against the hand-rolled v1 frame header
# encoder. Not pulled into the production crate.
rustgate-codec-schema = { workspace = true }
