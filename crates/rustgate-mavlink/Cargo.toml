[package]
name = "rustgate-mavlink"
description = "MAVLink v1/v2 frame codec and transport primitives for rustgate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Post-quantum signing-key rekey channel (ADR 0020). Pulls in aws-lc-rs
# for ML-KEM-768, which builds aws-lc from source (cmake + Go) — off by
# default so the standard build and most CI lanes stay lean. Exercised in
# the post-quantum CI lane.
mavlink-pq = ["dep:aws-lc-rs", "dep:ciborium", "dep:hkdf", "dep:chacha20poly1305", "dep:serde"]

[dependencies]
rustgate-core = { workspace = true }
bytes = { workspace = true }
lru = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "time", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

# --- mavlink-pq feature deps ---
aws-lc-rs = { workspace = true, optional = true }
ciborium = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
# Schema-parity proptest in `tests/schema_parity.rs` builds a
# `SchemaCodec` from `schemas/v1_header.yaml` and asserts byte-
# equivalent round-trip against the hand-rolled v1 frame header
# encoder. Not pulled into the production crate.
rustgate-codec-schema = { workspace = true }
