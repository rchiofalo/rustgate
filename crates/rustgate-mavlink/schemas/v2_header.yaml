# MAVLink v2 frame header (MAVLink v2.0 spec, 2017).
#
# A MAVLink v2 frame is
#   `[header (10 bytes)] [payload (len bytes)] [crc (2 bytes)]
#    [signature (13 bytes, optional)]`.
#
# v2 extends v1 with:
#   - A 24-bit message id (vs v1's 8-bit), unlocking the
#     dialect-extensible message-id space.
#   - Compat / incompat flag bytes for protocol-level negotiation
#     (`MAVLINK_IFLAG_SIGNED = 0x01` toggles the optional 13-byte
#     signature trailer).
#   - The same header → payload → CRC framing pattern as v1.
#
# Wire layout (little-endian — MAVLink is CPU-native LE):
#
# offset │ size │ field          │ notes
# ───────┼──────┼────────────────┼───────────────────────────────────
#   0    │  1   │ magic          │ always 0xFD (`MAVLINK_V2_MAGIC`)
#   1    │  1   │ len            │ payload length in bytes (0..=255)
#   2    │  1   │ incompat_flags │ bit 0 = MAVLINK_IFLAG_SIGNED
#   3    │  1   │ compat_flags   │ for future use, ignored if unknown
#   4    │  1   │ seq            │ wrapping per-(sysid,compid) sequence
#   5    │  1   │ sysid          │ source system id
#   6    │  1   │ compid         │ source component id
#   7    │  1   │ msgid_lo       │ MAVLink message id bits 0..=7
#   8    │  1   │ msgid_mid      │ MAVLink message id bits 8..=15
#   9    │  1   │ msgid_hi       │ MAVLink message id bits 16..=23
#
# # Why `msgid` stays three separate bytes (not one 24-bit u32)
#
# The v4 grammar's cross-byte bit-packing CAN express a 24-bit
# field — `bit-offset: 0, bit-width: 24` on a u32. The catch is
# that v4 bit-packing is **MSB-first big-endian bit stream**, but
# MAVLink stores msgid **little-endian** (lo / mid / hi at
# ascending byte offsets). Declaring a 24-bit bit-packed field
# would either reverse the byte order on decode or force the
# caller to byte-swap before projection — both are surprises.
# Three independent u8 fields is the straightforward declaration
# that matches the wire's little-endian byte order and keeps the
# byte-identical round-trip cheap. Consumers that want the typed
# 24-bit msgid recombine in the wrapper:
#   `(msgid_hi as u32) << 16 | (msgid_mid as u32) << 8 | msgid_lo`.
# A future grammar extension could add a `endian: little` knob to
# multi-byte bit-packed integers and let this declaration collapse
# back into a single field.
#
# # What this schema does NOT carry today
#
# - The MAVLink message-id enum vocabulary. Same rationale as the
#   v1 header schema: enums evolve, multi-dialect projection is a
#   v2 `value-mapping` overlay job.
# - The optional 13-byte signature trailer. The signature is gated
#   by `incompat_flags & MAVLINK_IFLAG_SIGNED (= 0x01)` and follows
#   the CRC; it needs a per-frame variable-tail schema feature
#   beyond the v3 fixed-byte-count repeat (`incompat_flags` is one
#   byte's bit 0, the tail length is 0 or 13). Tracked as a
#   follow-up; the parity test below covers the 10-byte header
#   only.
# - The payload + CRC trailer (same as v1).
# - The 24-bit msgid's combined enum value. The wrapper layer in
#   `rustgate-mavlink::frame` recombines `(msgid_hi, msgid_mid,
#   msgid_lo)` into a typed message-id integer; this schema carries
#   the three bytes verbatim.
#
# Provenance: byte layout cross-checked against
# `crates/rustgate-mavlink/src/frame.rs` (`MAVLINK_V2_MAGIC`,
# `MAVLINK_V2_HEADER_LEN = 10`). The `schema_parity_v2_header`
# proptest asserts byte-identical round-trip for every arbitrary
# 10-byte header proptest generates.
schema-version: "1"
protocol-name: "mavlink.v2_header"
message-types:
  - name: "V2Header"
    size-bytes: 10
    fields:
      - name: "magic"
        offset: 0
        field-type: { kind: u8 }
      - name: "len"
        offset: 1
        field-type: { kind: u8 }
      - name: "incompat_flags"
        offset: 2
        field-type: { kind: u8 }
      - name: "compat_flags"
        offset: 3
        field-type: { kind: u8 }
      - name: "seq"
        offset: 4
        field-type: { kind: u8 }
      - name: "sysid"
        offset: 5
        field-type: { kind: u8 }
      - name: "compid"
        offset: 6
        field-type: { kind: u8 }
      - name: "msgid_lo"
        offset: 7
        field-type: { kind: u8 }
      - name: "msgid_mid"
        offset: 8
        field-type: { kind: u8 }
      - name: "msgid_hi"
        offset: 9
        field-type: { kind: u8 }
