[package]
name = "rustgate-proto"
description = "TAK protocol buffer translation layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Prometheus metrics for protobuf<->XML decode counters / histograms
# (issue #771). Off by default so the no-features build of
# `rustgate-proto` does not pull in `prometheus`. Enabled by
# `rustgate-server` when its own `metrics` feature is on.
metrics = ["dep:prometheus", "rustgate-core/metrics"]

[dependencies]
rustgate-core = { workspace = true }
bytes = { workspace = true }
quick-xml = { workspace = true }
prometheus = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "time"] }
tokio-util = { workspace = true }
prost = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
proptest = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }
