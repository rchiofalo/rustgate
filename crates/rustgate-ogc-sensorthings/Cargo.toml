[package]
name = "rustgate-ogc-sensorthings"
description = "OGC SensorThings API v1.0 client — HTTP polling integration for IoT sensor data (REST + JSON; MQTT push deferred)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# MQTT push subscriber that connects to a remote SensorThings
# broker and subscribes to `v1.0/Datastreams(<N>)/Observations`.
# Reuses the same `observation_to_entity` mapper as the polling
# path. Off by default so the no-features build does not pull
# `rumqttc` into the dep tree.
mqtt-push = ["dep:rumqttc"]

[dependencies]
rustgate-core = { workspace = true }
rustgate-router = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
rumqttc = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
toml = { workspace = true }
wiremock = { workspace = true }
