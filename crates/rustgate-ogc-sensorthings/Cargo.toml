[package]
name = "rustgate-ogc-sensorthings"
description = "OGC SensorThings API v1.0 client — HTTP polling integration for IoT sensor data (REST + JSON; MQTT push deferred)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rustgate-core = { workspace = true, features = ["tls-provider"] }
rustgate-router = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
rumqttc = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `parsing` (on top of the workspace's `formatting`) for RFC 3339 cursor
# validation in the polling task — see `wiring::max_parseable_cursor`.
time = { workspace = true, features = ["parsing"] }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
toml = { workspace = true }
wiremock = { workspace = true }

[features]
# Adds SensorThings v1.0 §10 MQTT push subscription. Off by default;
# when enabled, the wiring layer can subscribe to
# `v1.0/Datastreams(N)/Observations` topics on a configured broker
# and feed received `Observation` documents through the same
# `observation_to_entity` mapper as the polling path. MVP rejects
# `mqtts://` broker URIs at startup — TLS lands once a deployment
# needs CA-pin / mTLS / SNI override knobs.
mqtt-push = ["dep:rumqttc"]
