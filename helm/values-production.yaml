# Production values override for rustgate Helm chart.
#
# Usage:
#   helm install rustgate helm/ -f helm/values-production.yaml -f my-values.yaml

image:
  # Pin to a SHA256 digest for immutable, reproducible deployments:
  # digest: "sha256:abc123..."
  digest: ""

replicaCount: 3

resources:
  requests:
    cpu: "1"
    memory: 512Mi
  limits:
    cpu: "4"
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

networkPolicy:
  enabled: true

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: rustgate

# External Secrets Operator — uncomment and configure for production.
# Requires ESO CRDs: https://external-secrets.io/
# externalSecrets:
#   enabled: true
#   secretStoreRef:
#     name: production-store
#     kind: ClusterSecretStore
#   nats:
#     enabled: true
#     remoteRef:
#       key: "production/rustgate/nats-credentials"
