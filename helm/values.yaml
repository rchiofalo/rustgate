replicaCount: 1
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/rchiofalo/rustgate
  # Use a specific version tag or SHA digest for production deployments.
  tag: "0.4.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  # Use LoadBalancer for external TCP access, ClusterIP for internal-only.
  type: ClusterIP
  port: 4433

tls:
  secretName: rustgate-tls
  cert: /certs/server.crt
  key: /certs/server.key
  ca: /certs/ca.crt

framing: tak-negotiate
encoding: tak-protobuf
maxConnections: 1024

nats:
  enabled: true
  url: nats://nats:4222
  credentials: ""
  # Name of an existing K8s Secret containing a NATS_CREDENTIALS key.
  # When set, takes precedence over the plain-text credentials value above.
  existingSecret: ""

enrollment:
  enabled: false
  bind: "0.0.0.0:8446"
  # Required when enrollment is enabled:
  caKey: ""           # Path to CA private key PEM (RUSTGATE_CA_KEY)
  user: ""            # HTTP Basic Auth username (ENROLLMENT_USER)
  password: ""        # HTTP Basic Auth password (ENROLLMENT_PASSWORD)
  caOrganization: ""  # Organization for issued certs (RUSTGATE_CA_ORG)
  # Name of an existing K8s Secret containing ENROLLMENT_USER and
  # ENROLLMENT_PASSWORD keys. When set, takes precedence over plain-text values.
  existingSecret: ""

websocket:
  # Enable WebSocket (wss://) listener for browser-based TAK clients.
  enabled: false
  bind: "0.0.0.0:8443"
  port: 8443

federation:
  enabled: false
  # V1 federation listen address (length-prefixed XML over mTLS).
  v1Bind: "0.0.0.0:9000"
  v1Port: 9000
  # V2 gRPC federation listen address. Leave empty to disable V2.
  v2Bind: ""
  v2Port: 9001
  # Unique federation server identity.
  id: "rustgate-federation-1"
  # Maximum federation hops before dropping a message (loop prevention).
  maxHops: 10
  # Skip TLS hostname verification for federation peers.
  skipHostnameVerify: false
  # Path to persistent federate store (JSON file).
  storePath: ""
  # Path to JSON file containing federation peer configurations.
  # Expected format: [{"id":"peer-1","address":"10.0.0.1:9001","groups":["Alpha"],...}]
  peersFile: ""
  # Name of an existing K8s Secret containing a FEDERATION_PEERS_FILE key.
  # When set, mounts the secret as a file and takes precedence over peersFile.
  existingSecret: ""

dataPackage:
  # Enable persistent data package storage for Marti sync API.
  # Requires enrollment to be enabled.
  enabled: false
  storageSize: 1Gi
  storageClassName: ""

plaintext:
  # Plaintext TCP/UDP inputs for trusted or air-gapped networks.
  # WARNING: Traffic is NOT encrypted. Use only behind VPN or on isolated networks.
  tcp:
    enabled: false
    bind: "0.0.0.0:8087"
    port: 8087
  udp:
    enabled: false
    bind: "0.0.0.0:8087"
    port: 8087
  # Identity assigned to plaintext clients.
  cn: "anonymous"
  group: "__plaintext__"

metrics:
  enabled: true
  port: 9090
  serviceMonitor:
    # Enable to create a Prometheus Operator ServiceMonitor resource.
    # Requires the Prometheus Operator CRDs to be installed in the cluster.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}

networkPolicy:
  enabled: false

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

persistence:
  # Enable to create a PersistentVolumeClaim for federation state.
  enabled: false
  storageClassName: ""
  size: 1Gi

resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Must be greater than drain timeout (110s) + preStop sleep (5s).
terminationGracePeriodSeconds: 120

# Spread replicas across nodes for HA. Uncomment for multi-replica deployments.
# topologySpreadConstraints:
#   - maxSkew: 1
#     topologyKey: kubernetes.io/hostname
#     whenUnsatisfiable: DoNotSchedule
#     labelSelector:
#       matchLabels:
#         app.kubernetes.io/name: rustgate
