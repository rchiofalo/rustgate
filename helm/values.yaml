replicaCount: 1
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/rchiofalo/rustgate
  # Use a specific version tag for deployments.
  tag: "0.6.0"
  # Set to a sha256:... value for immutable image references (overrides tag).
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  # Create a ServiceAccount for the rustgate pods.
  create: false
  # Name override; defaults to the fullname template.
  name: ""
  # Annotations to add (e.g., for IRSA / Workload Identity).
  annotations: {}
  # Mount the service account token into pods.
  automountToken: false

service:
  # Use LoadBalancer for external TCP access, ClusterIP for internal-only.
  type: ClusterIP
  port: 4433

tls:
  secretName: rustgate-tls
  cert: /certs/server.crt
  key: /certs/server.key
  ca: /certs/ca.crt

framing: tak-negotiate
encoding: tak-protobuf
maxConnections: 1024

nats:
  enabled: true
  url: nats://nats:4222
  # WARNING: Avoid storing credentials as plaintext in values files. Use
  # existingSecret or externalSecrets instead. Plaintext values are stored in
  # Helm release metadata and may appear in logs, version control, or CI output.
  credentials: ""
  # Name of an existing K8s Secret containing a RUSTGATE_NATS_CREDENTIALS key.
  # Takes precedence over plaintext credentials. ExternalSecrets take precedence over this.
  existingSecret: ""

enrollment:
  enabled: false
  bind: "0.0.0.0:8446"
  # Required when enrollment is enabled:
  caKey: ""           # Path to CA private key PEM (RUSTGATE_CA_KEY)
  # WARNING: Avoid storing credentials as plaintext in values files. Use
  # existingSecret or externalSecrets instead. Plaintext values are stored in
  # Helm release metadata and may appear in logs, version control, or CI output.
  user: ""            # HTTP Basic Auth username (RUSTGATE_ENROLLMENT_USER)
  password: ""        # HTTP Basic Auth password (RUSTGATE_ENROLLMENT_PASSWORD)
  caOrganization: ""  # Organization for issued certs (RUSTGATE_CA_ORG)
  # Name of an existing K8s Secret containing RUSTGATE_ENROLLMENT_USER and
  # RUSTGATE_ENROLLMENT_PASSWORD keys. Takes precedence over plaintext values.
  # ExternalSecrets take precedence over this.
  existingSecret: ""

websocket:
  # Enable WebSocket (wss://) listener for browser-based TAK clients.
  enabled: false
  bind: "0.0.0.0:8443"
  port: 8443

federation:
  enabled: false
  # V1 federation listen address (length-prefixed XML over mTLS).
  v1Bind: "0.0.0.0:9000"
  v1Port: 9000
  # V2 gRPC federation listen address. Leave empty to disable V2.
  v2Bind: ""
  v2Port: 9001
  # Unique federation server identity.
  id: "rustgate-federation-1"
  # Maximum federation hops before dropping a message (loop prevention).
  maxHops: 10
  # Skip TLS hostname verification for federation peers.
  skipHostnameVerify: false
  # Path to persistent federate store (JSON file).
  storePath: ""
  # WARNING: Avoid storing peer configurations with embedded credentials as
  # plaintext in values files. Use existingSecret or externalSecrets instead.
  # Path to JSON file containing federation peer configurations.
  # Expected format: [{"id":"peer-1","address":"10.0.0.1:9001","groups":["Alpha"],...}]
  peersFile: ""
  # Name of an existing K8s Secret containing a RUSTGATE_FEDERATION_PEERS_FILE key.
  # Mounts the secret as a file; takes precedence over peersFile.
  # ExternalSecrets take precedence over this.
  existingSecret: ""

dataPackage:
  # Enable persistent data package storage for Marti sync API.
  # Requires enrollment to be enabled.
  enabled: false
  storageSize: 1Gi
  storageClassName: ""

plaintext:
  # Plaintext TCP/UDP inputs for trusted or air-gapped networks.
  # WARNING: Traffic is NOT encrypted. Use only behind VPN or on isolated networks.
  tcp:
    enabled: false
    bind: "0.0.0.0:8087"
    port: 8087
  udp:
    enabled: false
    bind: "0.0.0.0:8087"
    port: 8087
  # Identity assigned to plaintext clients.
  cn: "anonymous"
  group: "__plaintext__"

metrics:
  enabled: true
  port: 9090
  serviceMonitor:
    # Enable to create a Prometheus Operator ServiceMonitor resource.
    # Requires the Prometheus Operator CRDs to be installed in the cluster.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}

networkPolicy:
  enabled: false

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

persistence:
  # Enable to create a PersistentVolumeClaim for federation state.
  enabled: false
  storageClassName: ""
  size: 1Gi

resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Must be greater than drain timeout (110s) + preStop sleep (5s).
terminationGracePeriodSeconds: 120

# Spread replicas across nodes for HA. Uncomment for multi-replica deployments.
# topologySpreadConstraints:
#   - maxSkew: 1
#     topologyKey: kubernetes.io/hostname
#     whenUnsatisfiable: DoNotSchedule
#     labelSelector:
#       matchLabels:
#         app.kubernetes.io/name: rustgate

# External Secrets Operator integration.
# Requires the External Secrets Operator CRDs to be installed in the cluster.
# See: https://external-secrets.io/
externalSecrets:
  enabled: false
  # SecretStore or ClusterSecretStore reference used by all ExternalSecret resources.
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore  # or SecretStore
  # How often to poll the external secret backend for updates.
  refreshInterval: 1h
  # NATS credentials ExternalSecret.
  nats:
    enabled: false
    # Name of the K8s Secret that the ESO controller will create and populate.
    # The deployment references this secret directly (not via nats.existingSecret).
    secretName: rustgate-nats-credentials
    # Remote key/path in the external secret backend.
    remoteRef:
      key: ""           # e.g., "production/rustgate/nats-credentials"
      property: ""      # optional property within the secret
  # Enrollment credentials ExternalSecret.
  enrollment:
    enabled: false
    secretName: rustgate-enrollment-credentials
    # Map of remote references for each secret key.
    remoteRefs:
      RUSTGATE_ENROLLMENT_USER:
        key: ""         # e.g., "production/rustgate/enrollment"
        property: "username"
      RUSTGATE_ENROLLMENT_PASSWORD:
        key: ""         # e.g., "production/rustgate/enrollment"
        property: "password"
  # Federation peers ExternalSecret.
  federation:
    enabled: false
    secretName: rustgate-federation-peers
    remoteRef:
      key: ""           # e.g., "production/rustgate/federation-peers"
      property: ""      # optional property within the secret
