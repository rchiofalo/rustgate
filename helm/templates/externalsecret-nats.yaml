{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.nats.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "rustgate.fullname" . }}-nats
  labels:
    {{- include "rustgate.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.externalSecrets.nats.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: NATS_CREDENTIALS
      remoteRef:
        key: {{ .Values.externalSecrets.nats.remoteRef.key | required "externalSecrets.nats.remoteRef.key is required when NATS ExternalSecret is enabled" }}
        {{- if .Values.externalSecrets.nats.remoteRef.property }}
        property: {{ .Values.externalSecrets.nats.remoteRef.property }}
        {{- end }}
{{- end }}
