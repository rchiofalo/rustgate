{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.enrollment.enabled }}
{{- if not .Values.enrollment.enabled }}
{{- fail "externalSecrets.enrollment.enabled requires enrollment.enabled=true" }}
{{- end }}
{{- if .Values.enrollment.existingSecret }}
{{- fail "Cannot set both externalSecrets.enrollment.enabled and enrollment.existingSecret" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "rustgate.fullname" . }}-enrollment
  labels:
    {{- include "rustgate.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    {{- include "rustgate.externalSecretStoreRef" . | nindent 4 }}
  target:
    name: {{ .Values.externalSecrets.enrollment.secretName }}
    creationPolicy: Owner
  data:
    {{- range $secretKey, $ref := .Values.externalSecrets.enrollment.remoteRefs }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $ref.key | required (printf "externalSecrets.enrollment.remoteRefs.%s.key is required when enrollment ExternalSecret is enabled" $secretKey) }}
        {{- if $ref.property }}
        property: {{ $ref.property }}
        {{- end }}
    {{- end }}
{{- end }}
