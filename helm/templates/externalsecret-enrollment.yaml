{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.enrollment.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "rustgate.fullname" . }}-enrollment
  labels:
    {{- include "rustgate.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.externalSecrets.enrollment.secretName }}
    creationPolicy: Owner
  data:
    {{- range $secretKey, $ref := .Values.externalSecrets.enrollment.remoteRefs }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $ref.key | required (printf "externalSecrets.enrollment.remoteRefs.%s.key is required when enrollment ExternalSecret is enabled" $secretKey) }}
        {{- if $ref.property }}
        property: {{ $ref.property }}
        {{- end }}
    {{- end }}
{{- end }}
