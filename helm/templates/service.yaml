apiVersion: v1
kind: Service
metadata:
  name: {{ include "rustgate.fullname" . }}
  labels:
    {{- include "rustgate.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: tak
      port: {{ .Values.service.port }}
      targetPort: tak
      protocol: TCP
    {{- if .Values.federation.enabled }}
    - name: federation
      port: 9000
      targetPort: federation
      protocol: TCP
    {{- end }}
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "rustgate.selectorLabels" . | nindent 4 }}
