apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rustgate.fullname" . }}
  labels:
    {{- include "rustgate.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rustgate.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rustgate.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustgate
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: tak
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.websocket.enabled }}
            - name: websocket
              containerPort: {{ .Values.websocket.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.federation.enabled }}
            - name: federation-v1
              containerPort: {{ .Values.federation.v1Port }}
              protocol: TCP
            {{- if .Values.federation.v2Bind }}
            - name: federation-v2
              containerPort: {{ .Values.federation.v2Port }}
              protocol: TCP
            {{- end }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.plaintext.tcp.enabled }}
            - name: tcp-plain
              containerPort: {{ .Values.plaintext.tcp.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.plaintext.udp.enabled }}
            - name: udp-input
              containerPort: {{ .Values.plaintext.udp.port }}
              protocol: UDP
            {{- end }}
          env:
            - name: RUSTGATE_BIND
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: RUSTGATE_CERT
              value: {{ .Values.tls.cert | quote }}
            - name: RUSTGATE_KEY
              value: {{ .Values.tls.key | quote }}
            - name: RUSTGATE_CA
              value: {{ .Values.tls.ca | quote }}
            - name: RUSTGATE_FRAMING
              value: {{ .Values.framing | quote }}
            - name: RUSTGATE_ENCODING
              value: {{ .Values.encoding | quote }}
            - name: RUSTGATE_MAX_CONNECTIONS
              value: {{ .Values.maxConnections | quote }}
            {{- if .Values.nats.enabled }}
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            {{- if .Values.nats.existingSecret }}
            - name: NATS_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nats.existingSecret }}
                  key: NATS_CREDENTIALS
            {{- else if .Values.nats.credentials }}
            - name: NATS_CREDENTIALS
              value: {{ .Values.nats.credentials | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_BIND
              value: "0.0.0.0:{{ .Values.metrics.port }}"
            {{- end }}
            {{- if .Values.enrollment.enabled }}
            - name: ENROLLMENT_BIND
              value: {{ .Values.enrollment.bind | quote }}
            {{- if .Values.enrollment.caKey }}
            - name: RUSTGATE_CA_KEY
              value: {{ .Values.enrollment.caKey | quote }}
            {{- end }}
            {{- if .Values.enrollment.existingSecret }}
            - name: ENROLLMENT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.enrollment.existingSecret }}
                  key: ENROLLMENT_USER
            - name: ENROLLMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.enrollment.existingSecret }}
                  key: ENROLLMENT_PASSWORD
            {{- else }}
            {{- if .Values.enrollment.user }}
            - name: ENROLLMENT_USER
              value: {{ .Values.enrollment.user | quote }}
            {{- end }}
            {{- if .Values.enrollment.password }}
            - name: ENROLLMENT_PASSWORD
              value: {{ .Values.enrollment.password | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.enrollment.caOrganization }}
            - name: RUSTGATE_CA_ORG
              value: {{ .Values.enrollment.caOrganization | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.websocket.enabled }}
            - name: WEBSOCKET_BIND
              value: {{ .Values.websocket.bind | quote }}
            {{- end }}
            {{- if .Values.federation.enabled }}
            - name: FEDERATION_V1_BIND
              value: {{ .Values.federation.v1Bind | quote }}
            {{- if .Values.federation.v2Bind }}
            - name: FEDERATION_V2_BIND
              value: {{ .Values.federation.v2Bind | quote }}
            {{- end }}
            - name: FEDERATION_ID
              value: {{ .Values.federation.id | quote }}
            - name: FEDERATION_MAX_HOPS
              value: {{ .Values.federation.maxHops | quote }}
            {{- if .Values.federation.skipHostnameVerify }}
            - name: FEDERATION_SKIP_HOSTNAME_VERIFY
              value: "true"
            {{- end }}
            {{- if and .Values.persistence.enabled .Values.federation.enabled }}
            - name: FEDERATION_STORE_PATH
              value: /data/federation-store.json
            {{- else if .Values.federation.storePath }}
            - name: FEDERATION_STORE_PATH
              value: {{ .Values.federation.storePath | quote }}
            {{- end }}
            {{- if .Values.federation.existingSecret }}
            - name: FEDERATION_PEERS_FILE
              value: /etc/federation/peers.json
            {{- else if .Values.federation.peersFile }}
            - name: FEDERATION_PEERS_FILE
              value: {{ .Values.federation.peersFile | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.dataPackage.enabled }}
            - name: DATA_PACKAGE_DIR
              value: /data/packages
            {{- end }}
            {{- if .Values.plaintext.tcp.enabled }}
            - name: RUSTGATE_TCP_BIND
              value: {{ .Values.plaintext.tcp.bind | quote }}
            {{- end }}
            {{- if .Values.plaintext.udp.enabled }}
            - name: RUSTGATE_UDP_BIND
              value: {{ .Values.plaintext.udp.bind | quote }}
            {{- end }}
            {{- if or .Values.plaintext.tcp.enabled .Values.plaintext.udp.enabled }}
            - name: RUSTGATE_PLAINTEXT_CN
              value: {{ .Values.plaintext.cn | quote }}
            - name: RUSTGATE_PLAINTEXT_GROUP
              value: {{ .Values.plaintext.group | quote }}
            {{- end }}
          {{- if .Values.metrics.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- else }}
          startupProbe:
            tcpSocket:
              port: tak
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: tak
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: tak
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
              readOnly: true
            {{- if and .Values.federation.enabled .Values.federation.existingSecret }}
            - name: federation-peers
              mountPath: /etc/federation
              readOnly: true
            {{- end }}
            {{- if and .Values.persistence.enabled .Values.federation.enabled }}
            - name: federation-data
              mountPath: /data
            {{- end }}
            {{- if .Values.dataPackage.enabled }}
            - name: data-packages
              mountPath: /data/packages
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      volumes:
        - name: tls-certs
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- if and .Values.federation.enabled .Values.federation.existingSecret }}
        - name: federation-peers
          secret:
            secretName: {{ .Values.federation.existingSecret }}
            items:
              - key: FEDERATION_PEERS_FILE
                path: peers.json
        {{- end }}
        {{- if and .Values.persistence.enabled .Values.federation.enabled }}
        - name: federation-data
          persistentVolumeClaim:
            claimName: {{ include "rustgate.fullname" . }}-federation
        {{- end }}
        {{- if .Values.dataPackage.enabled }}
        - name: data-packages
          persistentVolumeClaim:
            claimName: {{ include "rustgate.fullname" . }}-data-packages
        {{- end }}
