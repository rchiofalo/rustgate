{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rustgate.fullname" . }}-operator
  labels:
    {{- include "rustgate.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
  {{- with .Values.operator.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Hot-standby with leader election. Set
  # `operator.replicas: 1` and `operator.leaderElection.enabled: false`
  # in values.yaml to fall back to single-replica mode.
  replicas: {{ .Values.operator.replicas | default 2 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "rustgate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "rustgate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
      annotations:
        # Prometheus scrape config so the `/metrics` endpoint is
        # discovered without a ServiceMonitor. ServiceMonitor users can
        # disable these annotations via `operator.prometheus.scrape: false`.
        {{- if .Values.operator.prometheus.scrape }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.operator.httpPort | default 8080 }}"
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.operator.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "rustgate.fullname" . }}-operator
      automountServiceAccountToken: true
      # Spread operator replicas across nodes/zones for HA when the
      # cluster has multi-AZ topology spread keys configured.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "rustgate.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - run
            {{- if not .Values.operator.leaderElection.enabled }}
            - --no-leader-elect
            {{- end }}
            {{- if .Values.operator.watchNamespace }}
            - --namespace
            - {{ .Values.operator.watchNamespace | quote }}
            {{- end }}
            - --http-addr
            - 0.0.0.0:{{ .Values.operator.httpPort | default 8080 }}
            {{- with .Values.operator.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: RUST_LOG
              value: {{ .Values.operator.logLevel | quote }}
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.operator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.operator.httpPort | default 8080 }}
              protocol: TCP
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.operator.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.operator.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Allow the leader to drain in-flight reconciles and release its
      # Lease before SIGKILL. The operator's signal handler flips the
      # shutdown watch on SIGTERM, the reconcile loop completes its
      # current pass, and the lease release fires before the pod exits.
      terminationGracePeriodSeconds: {{ .Values.operator.terminationGracePeriodSeconds | default 30 }}
{{- end }}
