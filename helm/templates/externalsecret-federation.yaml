{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.federation.enabled }}
{{- if not .Values.federation.enabled }}
{{- fail "externalSecrets.federation.enabled requires federation.enabled=true" }}
{{- end }}
{{- if .Values.federation.existingSecret }}
{{- fail "Cannot set both externalSecrets.federation.enabled and federation.existingSecret" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "rustgate.fullname" . }}-federation
  labels:
    {{- include "rustgate.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    {{- include "rustgate.externalSecretStoreRef" . | nindent 4 }}
  target:
    name: {{ .Values.externalSecrets.federation.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: RUSTGATE_FEDERATION_PEERS_FILE
      remoteRef:
        key: {{ .Values.externalSecrets.federation.remoteRef.key | required "externalSecrets.federation.remoteRef.key is required when federation ExternalSecret is enabled" }}
        {{- if .Values.externalSecrets.federation.remoteRef.property }}
        property: {{ .Values.externalSecrets.federation.remoteRef.property }}
        {{- end }}
{{- end }}
