{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.federation.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "rustgate.fullname" . }}-federation
  labels:
    {{- include "rustgate.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.externalSecrets.federation.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: FEDERATION_PEERS_FILE
      remoteRef:
        key: {{ .Values.externalSecrets.federation.remoteRef.key | required "externalSecrets.federation.remoteRef.key is required when federation ExternalSecret is enabled" }}
        {{- if .Values.externalSecrets.federation.remoteRef.property }}
        property: {{ .Values.externalSecrets.federation.remoteRef.property }}
        {{- end }}
{{- end }}
