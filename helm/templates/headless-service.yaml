{{- if .Values.storeForward.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rustgate.fullname" . }}-headless
  labels:
    {{- include "rustgate.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "rustgate.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: tak
      protocol: TCP
      name: tls
{{- end }}
