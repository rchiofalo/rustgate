{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rustgate.fullname" . }}
  labels:
    {{- include "rustgate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rustgate.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - port: {{ .Values.metrics.port }}
          protocol: TCP
        {{- end }}
        {{- if .Values.enrollment.enabled }}
        - port: 8446
          protocol: TCP
        {{- end }}
        {{- if .Values.federation.enabled }}
        - port: 9000
          protocol: TCP
        {{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.nats.enabled }}
    - ports:
        - port: 4222
          protocol: TCP
    {{- end }}
    {{- if .Values.federation.enabled }}
    - ports:
        - port: 9000
          protocol: TCP
        - port: 9001
          protocol: TCP
    {{- end }}
{{- end }}
