{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rustgate.fullname" . }}
  labels:
    {{- include "rustgate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rustgate.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {{- if .Values.networkPolicy.ingressSelectors }}
      from:
        {{- toYaml .Values.networkPolicy.ingressSelectors | nindent 8 }}
      {{- end }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
        {{- if .Values.websocket.enabled }}
        - port: {{ .Values.websocket.port }}
          protocol: TCP
        {{- end }}
        {{- if .Values.metrics.enabled }}
        - port: {{ .Values.metrics.port }}
          protocol: TCP
        {{- end }}
        {{- if .Values.enrollment.enabled }}
        - port: 8446
          protocol: TCP
        {{- end }}
        {{- if .Values.federation.enabled }}
        - port: {{ .Values.federation.v1Port }}
          protocol: TCP
        {{- if .Values.federation.v2Bind }}
        - port: {{ .Values.federation.v2Port }}
          protocol: TCP
        {{- end }}
        {{- end }}
        {{- if .Values.plaintext.tcp.enabled }}
        - port: {{ .Values.plaintext.tcp.port }}
          protocol: TCP
        {{- end }}
        {{- if .Values.plaintext.udp.enabled }}
        - port: {{ .Values.plaintext.udp.port }}
          protocol: UDP
        {{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.nats.enabled }}
    - {{- if .Values.networkPolicy.egressSelectors }}
      to:
        {{- toYaml .Values.networkPolicy.egressSelectors | nindent 8 }}
      {{- end }}
      ports:
        - port: 4222
          protocol: TCP
    {{- end }}
    {{- if .Values.federation.enabled }}
    - {{- if .Values.networkPolicy.egressSelectors }}
      to:
        {{- toYaml .Values.networkPolicy.egressSelectors | nindent 8 }}
      {{- end }}
      ports:
        - port: {{ .Values.federation.v1Port }}
          protocol: TCP
        - port: {{ .Values.federation.v2Port }}
          protocol: TCP
        - port: 443
          protocol: TCP
    {{- end }}
{{- end }}
