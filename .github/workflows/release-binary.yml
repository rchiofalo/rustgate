name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_FEATURES: nats,enrollment,proto,full-detail,metrics,federation,federation-ha,websocket

jobs:
  build:
    permissions:
      contents: write # required for gh release upload
      id-token: write # required for cosign keyless signing via OIDC
      attestations: write # required for build provenance attestation

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cc: musl-gcc
            fips: false
          - target: aarch64-unknown-linux-musl
            cc: aarch64-linux-gnu-gcc
            linker: aarch64-linux-gnu-gcc
            fips: false
          - target: x86_64-unknown-linux-musl
            cc: musl-gcc
            fips: true
          - target: aarch64-unknown-linux-gnu
            cc: aarch64-linux-gnu-gcc
            linker: aarch64-linux-gnu-gcc
            fips: true

    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler musl-tools

      - name: Install aarch64 cross-compiler
        if: contains(matrix.target, 'aarch64')
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install FIPS build dependencies
        if: matrix.fips
        run: sudo apt-get install -y cmake golang-go

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Set cross-compilation env
        if: contains(matrix.target, 'aarch64')
        run: |
          TARGET_UPPER=$(echo "${{ matrix.target }}" | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=${{ matrix.linker }}" >> $GITHUB_ENV

      - name: Build (auditable)
        env:
          CC_${{ matrix.target }}: ${{ matrix.cc }}
          C_INCLUDE_PATH: ${{ matrix.fips && contains(matrix.target, 'musl') && '/usr/include:/usr/include/x86_64-linux-gnu' || '' }}
        run: |
          FEATURES="${{ env.RELEASE_FEATURES }}"
          if [ "${{ matrix.fips }}" = "true" ]; then
            FEATURES="${FEATURES},fips"
          fi
          cargo auditable build --locked --release --features "$FEATURES" --target ${{ matrix.target }}

      - name: Package binary
        run: |
          if [ "${{ matrix.fips }}" = "true" ]; then
            ARCHIVE="rustgate-fips-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          else
            ARCHIVE="rustgate-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          fi
          tar -czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" rustgate
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Generate SHA256 checksum
        run: sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Sign binary archive with cosign
        run: cosign sign-blob --yes --bundle "$ARCHIVE.bundle" "$ARCHIVE"

      - name: Attest binary provenance
        if: github.repository_visibility == 'public'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.version }}" \
            "$ARCHIVE" "$ARCHIVE.sha256" "$ARCHIVE.bundle" --clobber

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read # required for sbom-action artifact upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          artifact-name: sbom-source-${{ steps.version.outputs.version }}.spdx.json
          output-file: sbom-source.spdx.json
          format: spdx-json

      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv sbom-source.spdx.json "sbom-source-${{ steps.version.outputs.version }}.spdx.json"
          gh release upload "${{ steps.version.outputs.version }}" \
            "sbom-source-${{ steps.version.outputs.version }}.spdx.json" --clobber
