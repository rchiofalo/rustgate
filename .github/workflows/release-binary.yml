name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_FEATURES: nats,enrollment,proto,full-detail,metrics,federation,federation-ha,websocket,otel,http

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}

    permissions:
      contents: write # required for gh release upload
      id-token: write # required for cosign keyless signing via OIDC
      attestations: write # required for build provenance attestation

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cc: musl-gcc
            fips: false
            pq: false
          - target: aarch64-unknown-linux-musl
            cc: aarch64-linux-gnu-gcc
            linker: aarch64-linux-gnu-gcc
            fips: false
            pq: false
          - target: x86_64-unknown-linux-musl
            cc: musl-gcc
            fips: true
            pq: false
          - target: aarch64-unknown-linux-gnu
            cc: aarch64-linux-gnu-gcc
            linker: aarch64-linux-gnu-gcc
            fips: true
            pq: false
          - target: x86_64-unknown-linux-musl
            cc: musl-gcc
            fips: false
            pq: true
          - target: aarch64-unknown-linux-gnu
            cc: aarch64-linux-gnu-gcc
            linker: aarch64-linux-gnu-gcc
            fips: false
            pq: true

    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler musl-tools

      - name: Install aarch64 cross-compiler
        if: contains(matrix.target, 'aarch64')
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install aws-lc-rs build dependencies (FIPS / post-quantum)
        if: matrix.fips || matrix.pq
        run: sudo apt-get install -y cmake golang-go

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Set cross-compilation env
        if: contains(matrix.target, 'aarch64')
        run: |
          TARGET_UPPER=$(echo "${{ matrix.target }}" | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=${{ matrix.linker }}" >> $GITHUB_ENV

      - name: Build (auditable)
        env:
          CC_${{ matrix.target }}: ${{ matrix.cc }}
          C_INCLUDE_PATH: ${{ matrix.fips && contains(matrix.target, 'musl') && '/usr/include:/usr/include/x86_64-linux-gnu' || '' }}
        run: |
          FEATURES="${{ env.RELEASE_FEATURES }}"
          if [ "${{ matrix.fips }}" = "true" ]; then
            FEATURES="${FEATURES},fips"
          fi
          if [ "${{ matrix.pq }}" = "true" ]; then
            FEATURES="${FEATURES},post-quantum"
          fi
          cargo auditable build --locked --release --features "$FEATURES" --target ${{ matrix.target }}

      - name: Package binary
        run: |
          if [ "${{ matrix.fips }}" = "true" ]; then
            ARCHIVE="rustgate-fips-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          elif [ "${{ matrix.pq }}" = "true" ]; then
            ARCHIVE="rustgate-pq-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          else
            ARCHIVE="rustgate-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          fi
          tar -czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" rustgate
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Generate SHA256 checksum
        run: sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload hash for SLSA provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slsa-hash-${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Sign binary archive with cosign
        run: cosign sign-blob --yes --bundle "$ARCHIVE.sigstore.json" "$ARCHIVE"

      - name: Attest binary provenance
        # Previously gated on `github.repository_visibility == 'public'`, which
        # silently skipped binary provenance attestation on private forks /
        # internal mirrors. `attest-build-provenance` uses the Sigstore public
        # good instance for both public and private repos per upstream docs —
        # the transparency-log entry contains only the archive digest and the
        # build metadata, no private source material — so unconditional
        # attestation is both safe and required for SLSA L3 for every build.
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.version }}" \
            "$ARCHIVE" "$ARCHIVE.sha256" "$ARCHIVE.sigstore.json" --clobber

  combine-hashes:
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.combine.outputs.hashes }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - name: Download hash artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: slsa-hash-*
          merge-multiple: true

      - name: Combine hashes for SLSA provenance
        id: combine
        run: |
          echo "hashes=$(cat *.sha256 | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [build, combine-hashes]
    permissions:
      actions: read
      id-token: write
      contents: write
    # SLSA provenance generator must be referenced by tag, not commit hash.
    # Produces .intoto.jsonl attestation files uploaded as release assets.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.combine-hashes.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: "${{ needs.build.outputs.version }}"

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read # required for sbom-action artifact upload
      id-token: write # required for cosign keyless signing of the SBOM via OIDC
      attestations: write # required for attest-build-provenance on the SBOM file

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          artifact-name: sbom-source-${{ steps.version.outputs.version }}.spdx.json
          output-file: sbom-source.spdx.json
          format: spdx-json

      - name: Rename SBOM to versioned filename
        run: mv sbom-source.spdx.json "sbom-source-${{ steps.version.outputs.version }}.spdx.json"

      - name: Sign source SBOM with cosign
        # Source SBOMs ship as release assets, not registry-addressable
        # artefacts, so `cosign sign-blob` (not `cosign attest`) is the
        # correct primitive: it produces a detached Sigstore bundle that
        # downstream consumers verify with `cosign verify-blob`. Kept in
        # the `sbom` job rather than the per-target `build` job because
        # the source SBOM is repo-global (one per release, not per target)
        # and the build job matrix runs six parallel cross-arch builds.
        run: |
          SBOM="sbom-source-${{ steps.version.outputs.version }}.spdx.json"
          cosign sign-blob --yes \
            --bundle "${SBOM}.sigstore.json" \
            "${SBOM}"

      - name: Attest source SBOM provenance
        # Provenance attestation on the SBOM file proves it was produced by
        # this exact workflow run (not substituted after release). Consumers
        # verify with `gh attestation verify sbom-source-*.spdx.json`.
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "sbom-source-${{ steps.version.outputs.version }}.spdx.json"

      - name: Upload SBOM and signature to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SBOM="sbom-source-${{ steps.version.outputs.version }}.spdx.json"
          gh release upload "${{ steps.version.outputs.version }}" \
            "${SBOM}" "${SBOM}.sigstore.json" --clobber
