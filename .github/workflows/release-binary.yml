name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write # required for cosign keyless signing via OIDC
  attestations: write # required for build provenance attestation

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install cross
        run: cargo install cross --locked

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Build with cross
        run: cross build --release --all-features --target ${{ matrix.target }}

      - name: Package binary
        run: |
          ARCHIVE="rustgate-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" rustgate
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Generate SHA256 checksum
        run: sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Sign binary archive with cosign
        run: cosign sign-blob --yes --output-signature "$ARCHIVE.sig" --output-certificate "$ARCHIVE.pem" "$ARCHIVE"

      - name: Attest binary provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.version }}" \
            "$ARCHIVE" "$ARCHIVE.sha256" "$ARCHIVE.sig" "$ARCHIVE.pem" --clobber

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate source SBOM
        uses: anchore/sbom-action@17ae1740179002c89186b61233e0f892c3118b11 # v0.23.0
        with:
          path: .
          artifact-name: sbom-source-${{ steps.version.outputs.version }}.spdx.json
          output-file: sbom-source.spdx.json
          format: spdx-json

      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv sbom-source.spdx.json "sbom-source-${{ steps.version.outputs.version }}.spdx.json"
          gh release upload "${{ steps.version.outputs.version }}" \
            "sbom-source-${{ steps.version.outputs.version }}.spdx.json" --clobber
