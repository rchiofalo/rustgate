name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1" # Monday 6am UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Public repositories only. On a private repository the default
    # GITHUB_TOKEN cannot list commits through the GraphQL API the action
    # uses ("Resource not accessible by integration") and `publish_results`
    # is refused outright, so the previous `|| schedule` escape hatch just
    # produced a guaranteed-red run every Monday. To run Scorecard against a
    # private repository, supply a fine-grained PAT via `repo_token` and set
    # `publish_results: false` — see the ossf/scorecard-action README.
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-latest # publish_results requires GitHub-hosted runners
    permissions:
      contents: read # clone the repository
      security-events: write # upload SARIF
      id-token: write # publish results
      actions: read # read workflow for token-permissions check

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          sarif_file: results.sarif
