name: Release Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      actions: read # required for codeql upload-sarif to read workflow run
      attestations: write # required for build provenance attestation
      contents: read
      packages: write
      id-token: write # required for cosign keyless signing via OIDC
      security-events: write # required for Trivy SARIF upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Tag as "latest" only for stable releases (no pre-release suffix)
          if echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_stable=true" >> $GITHUB_OUTPUT
          else
            echo "is_stable=false" >> $GITHUB_OUTPUT
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          if [ "${{ steps.version.outputs.is_stable }}" == "true" ]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Run Trivy vulnerability scanner
        # Trivy gates the signature: a CRITICAL or HIGH finding fails this
        # step, which short-circuits the job before `cosign sign` runs, so
        # we never attach a cosign signature to a vulnerable image. The
        # image is already pushed at this point — consumers who rely on
        # the signature for admission control will correctly reject it.
        # To ship an image despite a known finding, add a dated entry to
        # `.trivyignore` with reviewer rationale rather than relaxing the
        # exit-code or re-introducing continue-on-error here.
        if: ${{ !cancelled() && steps.push.conclusion == 'success' }}
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Sign image with cosign
        # Only reached when Trivy finds no CRITICAL/HIGH vulnerabilities.
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

      # ── Post-sign metadata steps ────────────────────────────────
      # These steps are best-effort: individual failures must not cascade
      # or fail the overall job. The image is already pushed and signed;
      # SARIF upload and SBOM generation are informational artefacts.

      - name: Attest build provenance
        # `actions/attest-build-provenance` ultimately calls the GitHub
        # attestation API (`POST /repos/.../attestations`). The earlier
        # iteration of this comment claimed the action uses Sigstore's public
        # good instance directly — that was wrong. The GitHub API endpoint is
        # gated on the repo being **public** (or on a paid GHEC plan with
        # the feature explicitly enabled); user-owned private repos receive
        # `Feature not available for user-owned private repositories` and
        # the step fails, taking the whole release job with it. Gate on
        # `repository_visibility == 'public'` so the release succeeds on
        # private forks / internal mirrors. Add `continue-on-error` as a
        # second safety net so a transient API hiccup on a public repo
        # also does not un-ship a built image.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ github.event.repository.visibility == 'public' }}
        continue-on-error: true
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Upload Trivy scan results to GitHub Security tab
        # Runs with `!cancelled()` so SARIF is uploaded even when Trivy
        # failed the job — findings appear in the Security tab regardless
        # of whether the release was signed, aiding triage.
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' && github.repository_visibility == 'public' }}
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Generate container SBOM
        id: sbom
        if: ${{ !cancelled() && steps.push.conclusion == 'success' }}
        continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          artifact-name: sbom-container-${{ steps.version.outputs.version }}.spdx.json
          output-file: sbom-container.spdx.json
          format: spdx-json

      - name: Attest container SBOM with cosign
        # Binds the SPDX SBOM to the image digest via a cosign attestation of
        # predicate type `spdxjson`. Downstream consumers can verify the SBOM
        # provenance without a separate trust root by calling
        # `cosign verify-attestation --type spdxjson`. Requires the image to
        # be signed first (the cosign signing step above), since attestations
        # inherit the signer identity through the image digest. Kept inside
        # the post-sign best-effort block with continue-on-error so an SBOM
        # generation or attestation hiccup does not un-ship an already-signed
        # image; consumers who require attested SBOMs gate admission on the
        # attestation's presence, not on the release job's exit code.
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' && hashFiles('sbom-container.spdx.json') != '' }}
        continue-on-error: true
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate sbom-container.spdx.json \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      # ── CycloneDX source SBOM ────────────────────────────────────
      # Some downstream compliance pipelines (Iron Bank, NTIA "Minimum
      # Elements for an SBOM") prefer CycloneDX over SPDX. We publish
      # both: the SPDX flow above attests the container image, and the
      # CycloneDX flow below produces a workspace-level SBOM in JSON
      # and XML for archival in the release notes. The job is
      # best-effort and never gates the release.
      - name: Generate CycloneDX SBOM (source)
        id: cyclonedx
        if: ${{ !cancelled() && steps.push.conclusion == 'success' }}
        continue-on-error: true
        run: |
          cargo install --locked cargo-cyclonedx --version 0.5.7
          cargo cyclonedx --format json --override-filename rustgate.cdx
          # The XML form is also accepted by the CycloneDX tooling; emit
          # both so consumers can pick whichever format their pipeline
          # consumes natively.
          cargo cyclonedx --format xml --override-filename rustgate.cdx
          # Move the generated files to the workspace root so the
          # signing / upload steps below can find them with predictable
          # paths regardless of where cargo-cyclonedx writes them.
          find . -maxdepth 3 -name 'rustgate.cdx.json' -exec cp {} ./rustgate.cdx.json \; -quit
          find . -maxdepth 3 -name 'rustgate.cdx.xml' -exec cp {} ./rustgate.cdx.xml \; -quit
          ls -la rustgate.cdx.* || true

      - name: Sign CycloneDX SBOM with cosign (key-signed)
        # TODO(operator): set the `COSIGN_KEY` repository secret to a
        # cosign private key (`cosign generate-key-pair`) and the
        # `COSIGN_PASSWORD` secret to its passphrase. Without those
        # secrets the step is silently skipped — consumers in forks /
        # mirrors are not blocked from building. The keyless OIDC
        # signature on the container image continues to work without
        # this secret because it uses GitHub's OIDC issuer.
        if: ${{ !cancelled() && steps.cyclonedx.outcome == 'success' && env.COSIGN_KEY != '' }}
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        continue-on-error: true
        run: |
          # Write the key out to a tmpfs path; cosign accepts it via
          # `--key`. The runner cleans /tmp at end of job.
          install -m 0600 /dev/null /tmp/cosign.key
          printf '%s' "$COSIGN_KEY" > /tmp/cosign.key
          cosign sign-blob --yes \
            --key /tmp/cosign.key \
            --output-signature rustgate.cdx.json.sig \
            rustgate.cdx.json
          rm -f /tmp/cosign.key

      - name: Upload CycloneDX SBOM to release
        if: ${{ !cancelled() && steps.cyclonedx.outcome == 'success' && github.event_name == 'release' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Best-effort upload of the CycloneDX SBOM (and its
          # signature, when produced) to the GitHub release. Missing
          # files are tolerated so a failed cyclonedx step does not
          # cascade.
          gh release upload "${{ steps.version.outputs.version }}" \
            rustgate.cdx.json rustgate.cdx.xml --clobber || true
          if [ -f rustgate.cdx.json.sig ]; then
            gh release upload "${{ steps.version.outputs.version }}" \
              rustgate.cdx.json.sig --clobber || true
          fi

      - name: Generate release notes
        if: ${{ github.event_name == 'release' && !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.version.outputs.version }}" --generate-notes
