name: Release Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      actions: read # required for codeql upload-sarif to read workflow run
      attestations: write # required for build provenance attestation
      contents: read
      packages: write
      id-token: write # required for cosign keyless signing via OIDC
      security-events: write # required for Trivy SARIF upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Tag as "latest" only for stable releases (no pre-release suffix)
          if echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_stable=true" >> $GITHUB_OUTPUT
          else
            echo "is_stable=false" >> $GITHUB_OUTPUT
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          if [ "${{ steps.version.outputs.is_stable }}" == "true" ]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push
        id: push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Run Trivy vulnerability scanner
        # Trivy gates the signature: a CRITICAL or HIGH finding fails this
        # step, which short-circuits the job before `cosign sign` runs, so
        # we never attach a cosign signature to a vulnerable image. The
        # image is already pushed at this point — consumers who rely on
        # the signature for admission control will correctly reject it.
        # To ship an image despite a known finding, add a dated entry to
        # `.trivyignore` with reviewer rationale rather than relaxing the
        # exit-code or re-introducing continue-on-error here.
        if: ${{ !cancelled() && steps.push.conclusion == 'success' }}
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Sign image with cosign
        # Only reached when Trivy finds no CRITICAL/HIGH vulnerabilities.
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

      # ── Post-sign metadata steps ────────────────────────────────
      # These steps are best-effort: individual failures must not cascade
      # or fail the overall job. The image is already pushed and signed;
      # SARIF upload and SBOM generation are informational artefacts.

      - name: Attest build provenance
        # Previously gated on `github.repository_visibility == 'public'`, which
        # silently skipped provenance attestation on private forks / internal
        # mirrors. The `attest-build-provenance` action uses the Sigstore public
        # good instance for both public and private repos per upstream docs —
        # the transparency-log entry contains only the subject digest and the
        # build metadata, no private source material — so unconditional
        # attestation is both safe and required by SLSA L3 for every build.
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Upload Trivy scan results to GitHub Security tab
        # Runs with `!cancelled()` so SARIF is uploaded even when Trivy
        # failed the job — findings appear in the Security tab regardless
        # of whether the release was signed, aiding triage.
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' && github.repository_visibility == 'public' }}
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Generate container SBOM
        id: sbom
        if: ${{ !cancelled() && steps.push.conclusion == 'success' }}
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          artifact-name: sbom-container-${{ steps.version.outputs.version }}.spdx.json
          output-file: sbom-container.spdx.json
          format: spdx-json

      - name: Attest container SBOM with cosign
        # Binds the SPDX SBOM to the image digest via a cosign attestation of
        # predicate type `spdxjson`. Downstream consumers can verify the SBOM
        # provenance without a separate trust root by calling
        # `cosign verify-attestation --type spdxjson`. Requires the image to
        # be signed first (the cosign signing step above), since attestations
        # inherit the signer identity through the image digest. Kept inside
        # the post-sign best-effort block with continue-on-error so an SBOM
        # generation or attestation hiccup does not un-ship an already-signed
        # image; consumers who require attested SBOMs gate admission on the
        # attestation's presence, not on the release job's exit code.
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' && hashFiles('sbom-container.spdx.json') != '' }}
        continue-on-error: true
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate sbom-container.spdx.json \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Generate release notes
        if: ${{ github.event_name == 'release' && !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.version.outputs.version }}" --generate-notes
