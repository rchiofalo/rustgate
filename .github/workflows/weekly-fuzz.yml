name: Weekly Extended Fuzz

on:
  schedule:
    # Run every Saturday at 02:00 UTC for deeper coverage.
    - cron: "0 2 * * 6"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - cot_mask_strip_coordinates
          - cot_parse
          - crl_parse
          - csr_parse
          - federation_frame_parse
          - jwt_parse
          - length_prefixed_codec
          - mavlink_v2_frame
          - nats_wire_event
          - obligation_apply
          - proto_roundtrip
          - structured_cot_event
          - structured_routable_message
          - tak_frame_codec
          - v2_federation_convert
          - ws_frame
          - xml_stream_codec
          - asterix_cat021
          - asterix_cat062
          - stanag4586_vehicle_position
          - meshtastic_decode
          - vmf_decode
          - dis_entity_state
          - link16_jreap_frame
          - sapient_decode
          - nffi_document
          - sensorthings_observation
    name: fuzz-extended (${{ matrix.target }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly

      - name: Install protoc
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          fi

      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            cargo +nightly install cargo-fuzz --locked
          fi

      - name: Run fuzzer for 30 minutes
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=1800

      - name: Upload corpus artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-extended-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          retention-days: 90
