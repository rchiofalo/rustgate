name: UDS Package

# Validates the Zarf package + UDS bundle artifacts every time a PR
# (or push to main) touches the deployment surface. Catches three
# common drift modes the deployer would otherwise discover at
# `zarf package create` / `uds create` time:
#
#   1. `zarf/zarf.yaml` references a non-existent Helm chart path
#      or a missing container image.
#   2. `bundle/uds-bundle.yaml` references a non-existent Zarf
#      package or a UDS Core init version that's been yanked.
#   3. The version-triangle drifts: `helm/Chart.yaml`'s
#      `appVersion`, `zarf/zarf.yaml`'s `metadata.version`, and
#      `bundle/uds-bundle.yaml`'s `metadata.version` MUST agree.
#
# Lives in its own workflow file (not ci.yml) so the deployment
# surface can iterate on tooling versions without rebuilding the
# whole CI matrix. Mirrors the existing helm-lint stanza's path
# filtering.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile*"
      - "helm/**"
      - "zarf/**"
      - "bundle/**"
      - ".github/workflows/uds-package.yml"
  pull_request:
    paths:
      - "Dockerfile*"
      - "helm/**"
      - "zarf/**"
      - "bundle/**"
      - ".github/workflows/uds-package.yml"
  # The image-pulling jobs (zarf-create / uds-create) only work once the
  # versioned container images are published, which happens at release
  # time — so they are gated to `release` events (see the per-job `if:`).
  # The cheap, image-free checks (version-triangle, uds-package-cr) still
  # run on every push/PR above.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Job 1: Version triangle. Cheapest check; runs in <5 seconds.
  # Fails the build if the three deployment artifacts disagree on
  # what version of rustgate they're packaging.
  #
  # Tolerates missing files: a PR that touches only `helm/` (without
  # zarf/ or bundle/) — or only zarf/ without bundle/ — gets a pass
  # rather than a hard fail. The check only fires when all three
  # artifacts exist (the on-main steady state). This is the
  # chicken-and-egg accommodation for the H1–H5 PR sequence: each PR
  # in batch H lands its own slice of the deployment surface, and
  # the workflow needs to be friendly to that incremental landing
  # pattern as well as to future PRs that touch only one slice.
  # ------------------------------------------------------------------
  version-triangle:
    name: Deployment version triangle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check which deployment artifacts are present
        id: artifacts
        run: |
          set -euo pipefail
          has_helm=0
          has_zarf=0
          has_bundle=0
          [ -f helm/Chart.yaml ] && has_helm=1
          [ -f zarf/zarf.yaml ] && has_zarf=1
          [ -f bundle/uds-bundle.yaml ] && has_bundle=1
          echo "has_helm=${has_helm}" >> "$GITHUB_OUTPUT"
          echo "has_zarf=${has_zarf}" >> "$GITHUB_OUTPUT"
          echo "has_bundle=${has_bundle}" >> "$GITHUB_OUTPUT"
          echo "helm: ${has_helm}, zarf: ${has_zarf}, bundle: ${has_bundle}"

      - name: Check helm / zarf / bundle agree on version
        if: steps.artifacts.outputs.has_helm == '1' && steps.artifacts.outputs.has_zarf == '1' && steps.artifacts.outputs.has_bundle == '1'
        run: |
          set -euo pipefail

          # appVersion is the rustgate binary version the chart ships.
          # (The chart's own `version` is the chart-package SemVer and
          # drifts independently — that's expected.)
          helm_appversion=$(awk '/^appVersion:/ {gsub(/"/,"",$2); print $2}' helm/Chart.yaml)
          zarf_version=$(awk '/^  version:/ {gsub(/"/,"",$2); print $2; exit}' zarf/zarf.yaml)
          bundle_version=$(awk '/^  version:/ {gsub(/"/,"",$2); print $2; exit}' bundle/uds-bundle.yaml)

          echo "helm/Chart.yaml appVersion:           ${helm_appversion}"
          echo "zarf/zarf.yaml metadata.version:      ${zarf_version}"
          echo "bundle/uds-bundle.yaml metadata.version: ${bundle_version}"

          if [ "${helm_appversion}" != "${zarf_version}" ] \
              || [ "${zarf_version}" != "${bundle_version}" ]; then
              echo ""
              echo "::error::Deployment version triangle is out of sync."
              echo "::error::Bump helm/Chart.yaml appVersion, zarf/zarf.yaml metadata.version,"
              echo "::error::and bundle/uds-bundle.yaml metadata.version in lockstep when"
              echo "::error::cutting a new rustgate release."
              exit 1
          fi

      - name: Check zarf images match helm values
        if: steps.artifacts.outputs.has_helm == '1' && steps.artifacts.outputs.has_zarf == '1'
        run: |
          set -euo pipefail

          # The Zarf package's `images:` block declares what gets
          # embedded for airgap pull. Those tags MUST match the Helm
          # chart's image references — Zarf can only embed what the
          # chart actually deploys.
          helm_image_tag=$(awk '
              /^image:/ { in_image=1; next }
              in_image && /^[^ ]/ { in_image=0 }
              in_image && /^  tag:/ { gsub(/"/, "", $2); print $2; exit }
          ' helm/values.yaml)

          zarf_app_tag=$(awk '
              /ghcr\.io\/rchiofalo\/rustgate:/ && !/operator/ {
                  sub(/.*rustgate:/, ""); sub(/[ ]*#.*/, ""); print; exit
              }
          ' zarf/zarf.yaml)

          echo "helm/values.yaml image.tag:           ${helm_image_tag}"
          echo "zarf/zarf.yaml rustgate image tag:    ${zarf_app_tag}"

          if [ "${helm_image_tag}" != "${zarf_app_tag}" ]; then
              echo ""
              echo "::error::helm/values.yaml image.tag (${helm_image_tag}) does not match"
              echo "::error::the rustgate tag in zarf/zarf.yaml images: (${zarf_app_tag})."
              echo "::error::Zarf cannot embed an image the chart does not deploy."
              exit 1
          fi

      - name: Skip notice (incomplete deployment surface on this branch)
        if: steps.artifacts.outputs.has_zarf == '0' || steps.artifacts.outputs.has_bundle == '0'
        run: |
          echo "::notice::Skipped version-triangle check — this branch does not have the"
          echo "::notice::full helm/ + zarf/ + bundle/ surface yet. The check fires when"
          echo "::notice::all three exist on the same branch (the on-main steady state)."

  # ------------------------------------------------------------------
  # Job 2: Zarf package builds. Validates `zarf/zarf.yaml` parses,
  # the referenced Helm chart resolves, and all declared images can
  # be pulled. ~3-4 minutes on the GitHub runner; the image pulls
  # dominate the wall time.
  #
  # Release-gated: `zarf package create` pulls the versioned rustgate /
  # rustgate-operator images, which only exist in the registry once a
  # release is published. On PRs / main-dev those images 403, so this
  # job would always fail — it is therefore restricted to `release`
  # events, where the images it needs are available.
  # ------------------------------------------------------------------
  zarf-create:
    name: zarf package create
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: version-triangle
    steps:
      - uses: actions/checkout@v7

      - name: Check whether zarf/zarf.yaml exists
        id: check
        run: |
          if [ -f zarf/zarf.yaml ]; then
              echo "exists=1" >> "$GITHUB_OUTPUT"
          else
              echo "exists=0" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping — zarf/zarf.yaml not present on this branch."
          fi

      - name: Install Zarf
        if: steps.check.outputs.exists == '1'
        uses: defenseunicorns/setup-zarf@main

      - name: zarf package create (rustgate)
        if: steps.check.outputs.exists == '1'
        working-directory: zarf
        run: |
          zarf package create --confirm --output ../

      - name: Upload Zarf package as artifact
        if: steps.check.outputs.exists == '1'
        uses: actions/upload-artifact@v7
        with:
          name: rustgate-zarf-package
          path: zarf-package-rustgate-*.tar.zst
          retention-days: 7

  # ------------------------------------------------------------------
  # Job 3: UDS bundle builds. Validates `bundle/uds-bundle.yaml`
  # parses and composes the Zarf package from job 2 with the UDS
  # Core init package. Pulls the UDS Core init package over the
  # network.
  #
  # Release-gated (same rationale as zarf-create): it composes the
  # image-bearing Zarf package from job 2 and pulls the UDS Core init
  # package, so it can only succeed once the release images exist.
  # ------------------------------------------------------------------
  uds-create:
    name: uds bundle create
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: zarf-create
    steps:
      - uses: actions/checkout@v7

      - name: Check whether zarf and bundle files both exist
        id: check
        run: |
          if [ -f zarf/zarf.yaml ] && [ -f bundle/uds-bundle.yaml ]; then
              echo "exists=1" >> "$GITHUB_OUTPUT"
          else
              echo "exists=0" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping — full zarf/ + bundle/ surface not on this branch."
          fi

      - name: Install Zarf
        if: steps.check.outputs.exists == '1'
        uses: defenseunicorns/setup-zarf@main

      - name: Install UDS CLI
        if: steps.check.outputs.exists == '1'
        uses: defenseunicorns/setup-uds@main

      - name: Download Zarf package from job 2
        if: steps.check.outputs.exists == '1'
        uses: actions/download-artifact@v8
        with:
          name: rustgate-zarf-package
          path: ./

      - name: uds create (composes UDS Core + rustgate)
        if: steps.check.outputs.exists == '1'
        working-directory: bundle
        run: |
          uds create --confirm --output ../

      - name: Upload UDS bundle as artifact
        if: steps.check.outputs.exists == '1'
        uses: actions/upload-artifact@v7
        with:
          name: rustgate-uds-bundle
          path: uds-bundle-rustgate-*.tar.zst
          retention-days: 7

  # ------------------------------------------------------------------
  # Job 4: UDS Package CR schema validation. Runs kubeconform with
  # the UDS Core schema registry to confirm `bundle/uds-package.yaml`
  # is valid against the `Package.uds.dev/v1alpha1` schema. Cheap;
  # skips the full UDS Core install path that production deploys
  # exercise.
  # ------------------------------------------------------------------
  uds-package-cr:
    name: UDS Package CR schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check whether uds-package.yaml exists
        id: check
        run: |
          if [ -f bundle/uds-package.yaml ]; then
              echo "exists=1" >> "$GITHUB_OUTPUT"
          else
              echo "exists=0" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping — bundle/uds-package.yaml not on this branch."
          fi

      - name: Install kubeconform
        if: steps.check.outputs.exists == '1'
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
              https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin/

      - name: Validate uds-package.yaml against UDS Core schema
        if: steps.check.outputs.exists == '1'
        # Failure is non-blocking until the UDS Core schema is
        # published to a public OCI registry kubeconform can reach
        # without auth — track upstream at
        # https://github.com/defenseunicorns/uds-core/issues
        continue-on-error: true
        run: |
          kubeconform -strict -summary \
              -schema-location 'default' \
              -schema-location 'https://raw.githubusercontent.com/defenseunicorns/uds-core/main/src/pepr/operator/crd/sources/uds.dev/v1alpha1/{kind}.json' \
              bundle/uds-package.yaml
