name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan — Wednesday 4am UTC
    - cron: "0 4 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload SARIF
      actions: read # required for private repos

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          languages: actions
          # actions: scans GitHub Actions workflows for misconfigurations
          # Note: CodeQL does not support Rust directly. The 'actions' analysis
          # catches dangerous workflow patterns (script injection, untrusted input
          # in run steps, etc.) which complements our Rust-specific tooling
          # (clippy, cargo-audit, cargo-deny, fuzzing).

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        # SARIF upload requires GitHub Advanced Security, which is not available
        # on private repos without a GHAS license. Allow this step to fail
        # gracefully so the workflow does not block PRs.
        continue-on-error: true
        with:
          category: "/language:actions"
