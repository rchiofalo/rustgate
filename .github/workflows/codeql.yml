name: CodeQL

# Results go to the repository's Security tab (code scanning is free on public
# repositories). On pull requests GitHub adds a "Code scanning results" check
# that fails when the PR introduces a new alert, so no local gate is needed.
#
# - actions: GitHub Actions workflows (script injection, untrusted input in
#   run steps, over-broad permissions).
# - rust: the workspace, analysed without a build (`build-mode: none`). This
#   complements clippy, cargo-deny and the fuzzers rather than replacing them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan — Wednesday 4am UTC
    - cron: "0 4 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
