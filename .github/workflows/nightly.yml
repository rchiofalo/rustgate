name: Nightly

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  security-audit:
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write # required for actions-rust-lang/audit to create issues
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check licenses, bans, and sources
        run: cargo deny check

      - name: Audit dependencies for vulnerabilities
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          ignore: RUSTSEC-2025-0134

      - name: Check for outdated dependencies
        run: |
          cargo install --locked cargo-outdated 2>/dev/null || true
          echo "## Outdated Dependencies" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo outdated --root-deps-only 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  container-scan:
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build image for scanning
        run: docker build -t rustgate:nightly-scan .

      - name: Install Trivy
        run: |
          if ! command -v trivy &>/dev/null; then
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          fi

      - name: Scan container image for vulnerabilities
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --format table \
            rustgate:nightly-scan 2>&1 | tee trivy-results.txt

      - name: Post scan results to job summary
        if: always()
        run: |
          echo "## Container Image Scan (Trivy)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-results.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup scan image
        if: always()
        run: docker rmi rustgate:nightly-scan 2>/dev/null || true

  fuzz:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        target:
          - cot_parse
          - length_prefixed_codec
          - tak_frame_codec
          - v2_federation_convert
          - xml_stream_codec
    name: fuzz (${{ matrix.target }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        run: |
          RHOME="${RUSTUP_HOME:-$HOME/.rustup}"
          rm -rf "$RHOME"/toolchains/nightly-* "$RHOME"/tmp
          rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: Run fuzzer for 5 minutes
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300
