name: Nightly

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  security-audit:
    runs-on: ${{ vars.RUNNER_POOL == 'self-hosted' && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write # required for actions-rust-lang/audit to create issues
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check licenses, bans, and sources
        run: cargo deny check

      - name: Audit dependencies for vulnerabilities
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          ignore: RUSTSEC-2025-0134,RUSTSEC-2026-0049

      - name: Check for outdated dependencies
        run: |
          cargo install --locked cargo-outdated 2>/dev/null || true
          echo "## Outdated Dependencies" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo outdated --root-deps-only 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  container-scan:
    runs-on: ${{ vars.RUNNER_POOL == 'self-hosted' && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build image for scanning
        run: docker build -t rustgate:nightly-scan .

      - name: Install Trivy
        run: |
          TRIVY_VERSION="0.69.3"
          curl -fSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          sudo tar xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          rm -f /tmp/trivy.tar.gz

      - name: Scan container image for vulnerabilities
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --format table \
            rustgate:nightly-scan 2>&1 | tee trivy-results.txt

      - name: Post scan results to job summary
        if: always()
        run: |
          echo "## Container Image Scan (Trivy)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-results.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup scan image
        if: always()
        run: docker rmi rustgate:nightly-scan 2>/dev/null || true

  fuzz:
    runs-on: ${{ vars.RUNNER_POOL == 'self-hosted' && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - cot_mask_strip_coordinates
          - cot_parse
          - crl_parse
          - csr_parse
          - jwt_parse
          - length_prefixed_codec
          - mavlink_v2_frame
          - nats_wire_event
          - obligation_apply
          - proto_roundtrip
          - structured_cot_event
          - structured_routable_message
          - tak_frame_codec
          - v2_federation_convert
          - ws_frame
          - xml_stream_codec
    name: fuzz (${{ matrix.target }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly

      - name: Install protoc
        # No-op on self-hosted runners where protobuf-compiler is baked into
        # the container image; apt-get install on the GitHub-hosted fallback.
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          fi

      - name: Install cargo-fuzz
        # No-op on self-hosted runners where cargo-fuzz is baked into the
        # container image; installs via cargo on the GitHub-hosted fallback.
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            cargo +nightly install cargo-fuzz --locked
          fi

      - name: Run fuzzer for 10 minutes
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600

      - name: Upload corpus artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          retention-days: 30
