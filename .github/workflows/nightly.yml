name: Nightly

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # required for actions-rust-lang/audit to create issues
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check licenses, bans, and sources
        run: cargo deny check

      - name: Audit dependencies for vulnerabilities
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          ignore: RUSTSEC-2025-0134,RUSTSEC-2026-0049

      - name: Check for outdated dependencies
        run: |
          cargo install --locked cargo-outdated 2>/dev/null || true
          echo "## Outdated Dependencies" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo outdated --root-deps-only 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  container-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build image for scanning
        run: docker build -t rustgate:nightly-scan .

      - name: Install Trivy
        run: |
          TRIVY_VERSION="0.69.3"
          curl -fSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          sudo tar xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          rm -f /tmp/trivy.tar.gz

      - name: Scan container image for vulnerabilities
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --format table \
            rustgate:nightly-scan 2>&1 | tee trivy-results.txt

      - name: Post scan results to job summary
        if: always()
        run: |
          echo "## Container Image Scan (Trivy)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-results.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup scan image
        if: always()
        run: docker rmi rustgate:nightly-scan 2>/dev/null || true

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - cot_parse
          - crl_parse
          - csr_parse
          - jwt_parse
          - length_prefixed_codec
          - nats_wire_event
          - proto_roundtrip
          - tak_frame_codec
          - v2_federation_convert
          - ws_frame
          - xml_stream_codec
    name: fuzz (${{ matrix.target }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: Run fuzzer for 5 minutes
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300
