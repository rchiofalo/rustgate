name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -Dwarnings

jobs:
  commit-lint:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|deps|ci|refactor|test|chore|style|perf|build|revert)(\(.+\))?!?: .+'
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title does not follow Conventional Commits format."
            echo ""
            echo "Expected: <type>(<scope>): <description>"
            echo "Types: feat, fix, docs, deps, ci, refactor, test, chore, style, perf, build, revert"
            echo ""
            echo "Got: $PR_TITLE"
            exit 1
          fi

  lint:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Check for unused dependencies
        run: cargo machete

  clippy:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: self-hosted
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Clippy (all features)
        run: cargo clippy --all-features --all-targets

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps

  check-features:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cargo-hack
        run: cargo install cargo-hack --locked

      - name: Check all feature combinations
        run: cargo hack check --feature-powerset --depth 2 --exclude-features jemalloc --no-dev-deps

  test:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Run tests
        run: cargo nextest run --all-features

      - name: Run doc tests
        run: cargo test --all-features --doc

  coverage:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Generate coverage report
        run: cargo tarpaulin --engine llvm --all-features --out xml --output-dir coverage/

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/cobertura.xml

  audit:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [check-features, test]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

      - name: Run cargo audit
        run: cargo audit

  helm:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint Helm chart
        run: helm lint helm/

  docker:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [check-features, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Docker build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
