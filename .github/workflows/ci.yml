name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -Dwarnings
  NATS_VERSION: "2.11.1"

jobs:
  lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install cargo-machete
        uses: taiki-e/install-action@205eb1d74c6feda89abb1f3a09360601953286c0 # v2.68.18
        with:
          tool: cargo-machete

      - name: Check for unused dependencies
        run: cargo machete

  clippy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install protobuf compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

      - name: Clippy (all features)
        run: cargo clippy --all-features --all-targets

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps

  test:
    if: github.event.pull_request.draft == false
    needs: [lint, clippy]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ""
            needs_protoc: false
            needs_nats: false
          - name: nats
            flags: "--features nats"
            needs_protoc: false
            needs_nats: true
          - name: enrollment
            flags: "--features enrollment"
            needs_protoc: false
            needs_nats: false
          - name: proto
            flags: "--features proto"
            needs_protoc: true
            needs_nats: false
          - name: metrics
            flags: "--features metrics"
            needs_protoc: false
            needs_nats: false
          - name: websocket
            flags: "--features websocket"
            needs_protoc: false
            needs_nats: false
          - name: federation
            flags: "--features federation"
            needs_protoc: true
            needs_nats: false
          - name: websocket-nats
            flags: "--features websocket,nats"
            needs_protoc: false
            needs_nats: true
          - name: websocket-federation
            flags: "--features websocket,federation"
            needs_protoc: true
            needs_nats: false
          - name: federation-nats
            flags: "--features federation,nats"
            needs_protoc: true
            needs_nats: true
          - name: federation-metrics
            flags: "--features federation,metrics"
            needs_protoc: true
            needs_nats: false
          - name: proto-federation
            flags: "--features proto,federation"
            needs_protoc: true
            needs_nats: false
          - name: enrollment-federation
            flags: "--features enrollment,federation"
            needs_protoc: true
            needs_nats: false
          - name: nats-metrics
            flags: "--features nats,metrics"
            needs_protoc: false
            needs_nats: true
          - name: full-detail
            flags: "--features full-detail"
            needs_protoc: true
            needs_nats: true
          - name: federation-ha
            flags: "--features federation-ha,nats"
            needs_protoc: true
            needs_nats: true
          - name: all
            flags: "--all-features"
            needs_protoc: true
            needs_nats: true
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install protobuf compiler
        if: matrix.needs_protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nats-server
        if: matrix.needs_nats
        run: |
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v${NATS_VERSION}/nats-server-v${NATS_VERSION}-linux-amd64.tar.gz" \
            | tar xzf - --strip-components=1 -C /usr/local/bin "nats-server-v${NATS_VERSION}-linux-amd64/nats-server"
          nats-server --version

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: ${{ matrix.name }}

      - name: Run tests
        run: cargo test ${{ matrix.flags }}

  audit:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cargo-deny
        uses: taiki-e/install-action@205eb1d74c6feda89abb1f3a09360601953286c0 # v2.68.18
        with:
          tool: cargo-deny

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

      - name: Install cargo-audit
        uses: taiki-e/install-action@205eb1d74c6feda89abb1f3a09360601953286c0 # v2.68.18
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit

  helm:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Lint Helm chart
        run: helm lint helm/

  docker:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Docker build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: false
