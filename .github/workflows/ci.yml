name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -Dwarnings

jobs:
  commit-lint:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: self-hosted
    steps:
      - name: Validate PR title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|deps|ci|refactor|test|chore|style|perf|build|revert)(\(.+\))?!?: .+'
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title does not follow Conventional Commits format."
            echo ""
            echo "Expected: <type>(<scope>): <description>"
            echo "Types: feat, fix, docs, deps, ci, refactor, test, chore, style, perf, build, revert"
            echo ""
            echo "Got: $PR_TITLE"
            exit 1
          fi

  lint:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        continue-on-error: true
        with:
          cache-on-failure: true

      - name: Ensure nightly rustfmt is available
        run: rustup component add --toolchain nightly rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Check for unused dependencies
        run: cargo machete

  clippy:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: self-hosted
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        continue-on-error: true
        with:
          cache-on-failure: true

      - name: Clippy (all features)
        run: cargo clippy --locked --workspace --all-targets --features nats,enrollment,proto,full-detail,metrics,federation,federation-ha,websocket

      - name: Build documentation
        run: cargo doc --workspace --no-deps --features nats,enrollment,proto,full-detail,metrics,federation,federation-ha,websocket

  check-features:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        continue-on-error: true
        with:
          cache-on-failure: true

      - name: Install cargo-hack
        run: cargo install cargo-hack --locked --force

      - name: Check all feature combinations
        # NOTE: --locked is omitted because --no-dev-deps temporarily modifies
        # Cargo.toml files, which invalidates the lockfile.
        run: cargo hack check --feature-powerset --depth 2 --exclude-features jemalloc,fips --no-dev-deps

  test:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        continue-on-error: true
        with:
          cache-on-failure: true

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --force

      - name: Run tests
        run: cargo nextest run --locked --workspace --features nats,enrollment,proto,full-detail,metrics,federation,federation-ha,websocket

      - name: Run doc tests
        run: cargo test --locked --workspace --doc --features nats,enrollment,proto,full-detail,metrics,federation,federation-ha,websocket

  coverage:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        continue-on-error: true
        with:
          cache-on-failure: true

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked --force

      - name: Generate coverage report
        run: cargo tarpaulin --locked --engine llvm --features nats,enrollment,proto,full-detail,metrics,federation,federation-ha,websocket --out xml --output-dir coverage/

      - name: Upload coverage artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-report
          path: coverage/cobertura.xml

  fips:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        continue-on-error: true
        with:
          cache-on-failure: true

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --force

      - name: Clippy (FIPS)
        run: cargo clippy --locked -p rustgate-transport -p rustgate-server -p rustgate-enrollment --features fips --all-targets

      - name: Build server with FIPS
        run: cargo build --locked -p rustgate-server --features fips,federation,enrollment

      - name: Run FIPS tests
        run: cargo nextest run --locked -p rustgate-transport --features fips

  audit:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [check-features, test]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

      - name: Run cargo audit
        run: cargo audit --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2026-0042 --ignore RUSTSEC-2026-0049

  helm:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Lint Helm chart
        run: helm lint helm/

  docker:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [check-features, test]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Docker build (no push)
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
