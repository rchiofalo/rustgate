name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -Dwarnings

jobs:
  commit-lint:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|deps|ci|refactor|test|chore|style|perf|build|revert)(\(.+\))?!?: .+'
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title does not follow Conventional Commits format."
            echo ""
            echo "Expected: <type>(<scope>): <description>"
            echo "Types: feat, fix, docs, deps, ci, refactor, test, chore, style, perf, build, revert"
            echo ""
            echo "Got: $PR_TITLE"
            exit 1
          fi

  lint:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly-2026-04-01
          components: rustfmt

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Check formatting
        run: cargo +nightly-2026-04-01 fmt --all -- --check

      - uses: taiki-e/install-action@94cb46f8d6e437890146ffbd78a778b78e623fb2 # v2.74.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tool: cargo-machete
      - name: Check for unused dependencies
        run: cargo machete

  clippy:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Clippy (all features)
        run: cargo clippy --locked --workspace --all-targets --features nats,enrollment,est,proto,full-detail,metrics,federation,federation-ha,websocket,mqtt,otel

      - name: Build documentation
        run: cargo doc --workspace --no-deps --features nats,enrollment,est,proto,full-detail,metrics,federation,federation-ha,websocket,mqtt,otel

  check-features:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: taiki-e/install-action@94cb46f8d6e437890146ffbd78a778b78e623fb2 # v2.74.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tool: cargo-hack

      - name: Check all feature combinations
        # NOTE: --locked is omitted because --no-dev-deps temporarily modifies
        # Cargo.toml files, which invalidates the lockfile.
        run: cargo hack check --feature-powerset --depth 2 --exclude-features jemalloc,fips,otel,post-quantum --no-dev-deps

  test:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache nats-server binary
        id: cache-nats
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /usr/local/bin/nats-server
          key: nats-server-v2.10.24-linux-amd64-ee6500f364e3a741b496ae0296c04f2a9d53bbaabac457104ac74596b4a59d85

      - name: Install nats-server
        if: steps.cache-nats.outputs.cache-hit != 'true'
        env:
          NATS_SHA256: ee6500f364e3a741b496ae0296c04f2a9d53bbaabac457104ac74596b4a59d85
        run: |
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.10.24/nats-server-v2.10.24-linux-amd64.tar.gz -o /tmp/nats.tar.gz
          echo "${NATS_SHA256}  /tmp/nats.tar.gz" | sha256sum -c -
          tar xzf /tmp/nats.tar.gz -C /tmp
          sudo mv /tmp/nats-server-v2.10.24-linux-amd64/nats-server /usr/local/bin/

      - name: Verify nats-server
        run: nats-server --version

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Run tests
        run: cargo nextest run --locked --workspace --features nats,enrollment,est,proto,full-detail,metrics,federation,federation-ha,websocket,mqtt,otel

      - name: Authz P99 budget gate (release)
        run: cargo nextest run --locked --release -p rustgate-authz --run-ignored all perf_budget

      - name: Run doc tests
        run: cargo test --locked --workspace --doc --features nats,enrollment,est,proto,full-detail,metrics,federation,federation-ha,websocket,mqtt,otel

  coverage:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache nats-server binary
        id: cache-nats
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /usr/local/bin/nats-server
          key: nats-server-v2.10.24-linux-amd64-ee6500f364e3a741b496ae0296c04f2a9d53bbaabac457104ac74596b4a59d85

      - name: Install nats-server
        if: steps.cache-nats.outputs.cache-hit != 'true'
        env:
          NATS_SHA256: ee6500f364e3a741b496ae0296c04f2a9d53bbaabac457104ac74596b4a59d85
        run: |
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.10.24/nats-server-v2.10.24-linux-amd64.tar.gz -o /tmp/nats.tar.gz
          echo "${NATS_SHA256}  /tmp/nats.tar.gz" | sha256sum -c -
          tar xzf /tmp/nats.tar.gz -C /tmp
          sudo mv /tmp/nats-server-v2.10.24-linux-amd64/nats-server /usr/local/bin/

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: taiki-e/install-action@94cb46f8d6e437890146ffbd78a778b78e623fb2 # v2.74.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tool: cargo-tarpaulin

      - name: Generate coverage report
        run: cargo tarpaulin --locked --engine llvm --features nats,enrollment,est,proto,full-detail,metrics,federation,federation-ha,websocket,mqtt,otel --out xml --output-dir coverage/

      - name: Upload coverage artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-report
          path: coverage/cobertura.xml

  fips:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cc: musl-gcc
            run_tests: true
          - target: aarch64-unknown-linux-gnu
            cc: aarch64-linux-gnu-gcc
            linker: aarch64-linux-gnu-gcc
            run_tests: false # cannot run aarch64 binaries on x86 runner

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install FIPS build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake golang-go musl-tools

      - name: Install aarch64 cross-compiler
        if: contains(matrix.target, 'aarch64')
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Clippy (FIPS)
        if: matrix.run_tests
        run: cargo clippy --locked -p rustgate-transport -p rustgate-server -p rustgate-enrollment --features fips --all-targets

      - name: Build server with FIPS
        env:
          CC_${{ matrix.target }}: ${{ matrix.cc }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
          C_INCLUDE_PATH: ${{ contains(matrix.target, 'musl') && '/usr/include:/usr/include/x86_64-linux-gnu' || '' }}
        run: cargo build --locked -p rustgate-server --features fips,federation,enrollment --target ${{ matrix.target }}

      - name: Run FIPS tests
        if: matrix.run_tests
        run: cargo nextest run --locked -p rustgate-transport --features fips

  post-quantum:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Install PQ build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake golang-go

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Clippy (post-quantum)
        run: cargo clippy --locked -p rustgate-transport -p rustgate-server --features post-quantum --all-targets

      - name: Build server with post-quantum
        run: cargo build --locked -p rustgate-server --features post-quantum,federation,enrollment

      - name: Run PQ tests
        run: cargo nextest run --locked -p rustgate-transport --features post-quantum

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  audit:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [check-features, test]
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: taiki-e/install-action@94cb46f8d6e437890146ffbd78a778b78e623fb2 # v2.74.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tool: cargo-deny,cargo-audit

      - name: Check advisories, licenses, bans, and sources
        # continue-on-error guards against upstream advisory DB parse failures
        #   (e.g., RUSTSEC-2025-0138 malformed TOML). Remove once DB is fixed.
        continue-on-error: true
        run: cargo deny check

      - name: Run cargo audit
        # RUSTSEC-2025-0134: unmaintained crate with no available replacement yet;
        #   tracked upstream, no security impact in our usage.
        # RUSTSEC-2026-0049: advisory does not affect our configuration;
        #   mitigation is in place via input validation at the transport layer.
        # continue-on-error guards against upstream advisory DB parse failures
        #   (e.g., RUSTSEC-2025-0138 malformed TOML). Remove once DB is fixed.
        continue-on-error: true
        run: cargo audit --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2026-0049

  helm:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Lint Helm chart
        run: helm lint helm/

      - name: Validate template rendering with production values
        run: helm template rustgate helm/ -f helm/values-production.yaml > /dev/null

  docker:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [check-features, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate Dockerfile COPY matches workspace members
        run: |
          # Extract crate directory names from Cargo.toml members list
          members=$(sed -n '/^\[workspace\]/,/^$/p' Cargo.toml \
            | grep -oP '"crates/[^"]+"' \
            | tr -d '"')

          missing=()
          for member in $members; do
            crate_name=$(basename "$member")
            if ! grep -q "COPY ${member}/Cargo.toml" Dockerfile; then
              missing+=("$member")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Dockerfile is missing COPY for workspace members:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All workspace members have corresponding COPY in Dockerfile."

      - name: Check for Docker-relevant changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'Cargo.*'
              - 'crates/**'
              - '.github/workflows/ci.yml'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.docker == 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Docker build (no push)
        if: steps.filter.outputs.docker == 'true'
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
