name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -Dwarnings

jobs:
  commit-lint:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|deps|ci|refactor|test|chore|style|perf|build|revert)(\(.+\))?!?: .+'
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title does not follow Conventional Commits format."
            echo ""
            echo "Expected: <type>(<scope>): <description>"
            echo "Types: feat, fix, docs, deps, ci, refactor, test, chore, style, perf, build, revert"
            echo ""
            echo "Got: $PR_TITLE"
            exit 1
          fi

  lint:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - uses: taiki-e/install-action@735e5933943122c5ac182670a935f54a949265c1 # v2.52.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tool: cargo-machete
      - name: Check for unused dependencies
        run: cargo machete

  clippy:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Clippy (all features)
        run: cargo clippy --locked --workspace --all-targets --features nats,enrollment,proto,full-detail,metrics,federation,federation-ha,websocket,otel

      - name: Build documentation
        run: cargo doc --workspace --no-deps --features nats,enrollment,proto,full-detail,metrics,federation,federation-ha,websocket,otel

  check-features:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: taiki-e/install-action@735e5933943122c5ac182670a935f54a949265c1 # v2.52.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tool: cargo-hack

      - name: Check all feature combinations
        # NOTE: --locked is omitted because --no-dev-deps temporarily modifies
        # Cargo.toml files, which invalidates the lockfile.
        run: cargo hack check --feature-powerset --depth 2 --exclude-features jemalloc,fips,otel --no-dev-deps

  test:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install nats-server
        run: |
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.10.24/nats-server-v2.10.24-linux-amd64.tar.gz -o /tmp/nats.tar.gz
          tar xzf /tmp/nats.tar.gz -C /tmp
          sudo mv /tmp/nats-server-v2.10.24-linux-amd64/nats-server /usr/local/bin/
          nats-server --version

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Run tests
        run: cargo nextest run --locked --workspace --features nats,enrollment,proto,full-detail,metrics,federation,federation-ha,websocket,otel

      - name: Run doc tests
        run: cargo test --locked --workspace --doc --features nats,enrollment,proto,full-detail,metrics,federation,federation-ha,websocket,otel

  coverage:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install nats-server
        run: |
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.10.24/nats-server-v2.10.24-linux-amd64.tar.gz -o /tmp/nats.tar.gz
          tar xzf /tmp/nats.tar.gz -C /tmp
          sudo mv /tmp/nats-server-v2.10.24-linux-amd64/nats-server /usr/local/bin/

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - uses: taiki-e/install-action@735e5933943122c5ac182670a935f54a949265c1 # v2.52.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tool: cargo-tarpaulin

      - name: Generate coverage report
        run: cargo tarpaulin --locked --engine llvm --features nats,enrollment,proto,full-detail,metrics,federation,federation-ha,websocket,otel --out xml --output-dir coverage/

      - name: Upload coverage artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-report
          path: coverage/cobertura.xml

  fips:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cc: musl-gcc
            run_tests: true
          - target: aarch64-unknown-linux-gnu
            cc: aarch64-linux-gnu-gcc
            linker: aarch64-linux-gnu-gcc
            run_tests: false # cannot run aarch64 binaries on x86 runner

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install FIPS build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake golang-go musl-tools

      - name: Install aarch64 cross-compiler
        if: contains(matrix.target, 'aarch64')
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Clippy (FIPS)
        if: matrix.run_tests
        run: cargo clippy --locked -p rustgate-transport -p rustgate-server -p rustgate-enrollment --features fips --all-targets

      - name: Build server with FIPS
        env:
          CC_${{ matrix.target }}: ${{ matrix.cc }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
          C_INCLUDE_PATH: ${{ contains(matrix.target, 'musl') && '/usr/include:/usr/include/x86_64-linux-gnu' || '' }}
        run: cargo build --locked -p rustgate-server --features fips,federation,enrollment --target ${{ matrix.target }}

      - name: Run FIPS tests
        if: matrix.run_tests
        run: cargo nextest run --locked -p rustgate-transport --features fips

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  audit:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [check-features, test]
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@735e5933943122c5ac182670a935f54a949265c1 # v2.52.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tool: cargo-deny,cargo-audit

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

      - name: Run cargo audit
        # RUSTSEC-2025-0134: unmaintained crate with no available replacement yet;
        #   tracked upstream, no security impact in our usage.
        # RUSTSEC-2026-0049: advisory does not affect our configuration;
        #   mitigation is in place via input validation at the transport layer.
        run: cargo audit --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2026-0049

  helm:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Lint Helm chart
        run: helm lint helm/

  docker:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [check-features, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check for Docker-relevant changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'Cargo.*'
              - 'crates/**'
              - '.github/workflows/ci.yml'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.docker == 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Docker build (no push)
        if: steps.filter.outputs.docker == 'true'
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
