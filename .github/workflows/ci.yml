name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  # -Dwarnings is workspace-wide policy (all warnings are errors).
  RUSTFLAGS: -Dwarnings
  # Pinned nats-server release used by the `test` and `coverage` jobs.
  # Bumping the version requires updating NATS_SERVER_SHA256 — check
  # https://github.com/nats-io/nats-server/releases for the tarball checksum.
  NATS_SERVER_VERSION: "2.10.24"
  NATS_SERVER_SHA256: "ee6500f364e3a741b496ae0296c04f2a9d53bbaabac457104ac74596b4a59d85"

jobs:
  commit-lint:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Validate PR title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|deps|ci|refactor|test|chore|style|perf|build|revert)(\(.+\))?!?: .+'
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title does not follow Conventional Commits format."
            echo ""
            echo "Expected: <type>(<scope>): <description>"
            echo "Types: feat, fix, docs, deps, ci, refactor, test, chore, style, perf, build, revert"
            echo ""
            echo "Got: $PR_TITLE"
            exit 1
          fi

  playbook-lint:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
          fi

      - name: Enforce shared-infrastructure patterns
        run: bash scripts/check-playbook-drift.sh

      - name: REUSE licensing compliance
        # Every tracked file must carry machine-readable copyright and license
        # information: an SPDX header for source files, or a REUSE.toml
        # annotation for docs, config and test data. REUSE.toml deliberately
        # does not match *.rs / *.proto / *.py / *.sh, so a new source file
        # without an SPDX header fails here. Installed into a venv to avoid
        # the PEP 668 "externally managed" error on system Python; version
        # pinned for reproducibility.
        run: |
          if ! python3 -c 'import ensurepip' 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-venv
          fi
          python3 -m venv "$RUNNER_TEMP/reuse-venv"
          "$RUNNER_TEMP/reuse-venv/bin/pip" install --quiet 'reuse[charset-normalizer]==6.2.0'
          "$RUNNER_TEMP/reuse-venv/bin/reuse" lint

      - name: Install Python YAML dependency
        # Install via apt rather than pip to avoid the PEP 668 "externally
        # managed" error that system Python raises on Ubuntu 23.04+ when pip
        # writes to the system site-packages without --break-system-packages.
        # No-op when already present. (Same pattern used by the helm job below
        # for the RBAC scanner.)
        run: |
          if ! python3 -c 'import yaml' 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-yaml
          fi

      # Guards against a future edit of `release-binary.yml` silently making
      # two matrix entries produce the same `.tar.gz` filename (F-21). Runs
      # on every PR — even those not touching the workflow — so a rename of
      # the matrix discriminator in an unrelated file (e.g. a shared shell
      # helper) still surfaces here before a release tag cuts in.
      - name: Enforce release artifact filename uniqueness (F-21)
        run: python3 scripts/check-release-artifact-names.py

      # Requires `// justification:` comments on every production `#[allow(...)]`
      # annotation (F-156). Test modules, `#[cfg(test)]`-gated items, and the
      # `rustgate-test-utils` crate are exempt — rationale lives in
      # `CONTRIBUTING.md` under "Allow annotations (F-156)".
      - name: Enforce #[allow] justifications (F-156)
        run: python3 scripts/check-allow-justified.py

  lint:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads Cargo.lock only (no toolchain needed), so it runs first. Catches
      # a lockfile re-resolve (`cargo update`, Dependabot) that moves bindgen
      # 0.73 onto syn 3, which otherwise surfaces late as an obscure E0277 in
      # the `fips` job. See the pin comment above `aws-lc-rs` in Cargo.toml.
      - name: Check hand-maintained Cargo.lock pins
        run: bash scripts/check-lock-pins.sh

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action pin; toolchain set below
        with:
          toolchain: "1.99"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly-2026-04-01
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo +nightly-2026-04-01 fmt --all -- --check

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tool: cargo-machete
      - name: Check for unused dependencies
        run: cargo machete

  clippy:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action pin; toolchain set below
        with:
          toolchain: "1.99"
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install protoc
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          fi

      - name: Clippy (all features)
        run: cargo clippy --locked --workspace --all-targets --features nats,enrollment,est,proto,full-detail,metrics,federation,federation-ha,websocket,mqtt,otel,http

      - name: Build documentation
        run: cargo doc --workspace --no-deps --features nats,enrollment,est,proto,full-detail,metrics,federation,federation-ha,websocket,mqtt,otel,http

  check-features:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action pin; toolchain set below
        with:
          toolchain: "1.99"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install protoc
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          fi

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tool: cargo-hack

      - name: Check all feature combinations
        # NOTE: --locked is omitted because --no-dev-deps temporarily modifies
        # Cargo.toml files, which invalidates the lockfile.
        #
        # Depth is event-conditional:
        # - PRs: --depth 1 — checks each feature individually (C(N,1) combos).
        #   Catches the common case (per-feature breakage) in ~8-12 minutes.
        # - push to main: --depth 2 — checks every 2-feature combination as well
        #   (C(N,2)). Catches combinatorial pair breakage before it reaches a
        #   release tag. Runs ~40-45 minutes, which is acceptable post-merge.
        #
        # Rationale: most feature regressions are per-feature, not combinatorial;
        # depth 2 on every PR burns ~32 wall-clock minutes per run for rare
        # regressions. main-branch protection ensures depth-2 runs before any
        # release is cut, so pair-breakage still gets caught pre-release.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DEPTH=1
          else
            DEPTH=2
          fi
          echo "Running cargo hack check at depth $DEPTH (event=${{ github.event_name }})"
          cargo hack check --feature-powerset --depth "$DEPTH" --exclude-features jemalloc,fips,otel,post-quantum,mavlink-pq --no-dev-deps

  check-features-triples:
    # Targeted three-way feature interaction coverage (issue #832 F-147).
    # `cargo hack --feature-powerset --depth 2` (the `check-features` job
    # above) covers C(N,1) and C(N,2) but not C(N,3); the full N=3 powerset
    # would multiply check time by ~N (currently ~12 features under
    # consideration → ~220 triples) which is too heavy for every PR.
    # Instead, this job runs a curated allowlist of triples picked because
    # they exercise distinct cross-crate wiring surfaces that have
    # historically been the cheapest place for a three-way regression to
    # land:
    #   * federation+mqtt+http        — full bridge fan-out (NATS-free)
    #   * federation+nats+websocket   — full bridge fan-out alternative
    #   * mqtt+enrollment+est         — broker + client identity provisioning
    #   * federation-ha+federation+nats — high-availability federation path
    #   * mqtt+otel+full-detail       — broker with full observability
    #   * enrollment+est+websocket    — provisioning with browser clients
    # Each triple runs as an independent matrix entry so a failure
    # pinpoints the offending combination in the GitHub Actions run UI
    # rather than batching them into a single opaque step. `fail-fast` is
    # off so all triples report; one bad triple does not mask the rest.
    # Scope is `cargo check` (not clippy / test) — clippy and tests are
    # already covered by the workspace-wide all-features jobs above; this
    # job exists only to catch the rare three-way cfg-gate or feature-
    # propagation breakage that pair-coverage misses.
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        triple:
          - federation,mqtt,http
          - federation,nats,websocket
          - mqtt,enrollment,est
          - federation-ha,federation,nats
          - mqtt,otel,full-detail
          - enrollment,est,websocket

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action pin; toolchain set below
        with:
          toolchain: "1.99"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install protoc
        # `proto` and `otel` features pull in tonic/prost build scripts that
        # invoke protoc; some matrix triples (mqtt+otel+full-detail) require it.
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          fi

      - name: Check workspace with feature triple
        # `cargo check` (not `build` or `clippy`) keeps wall-time per matrix
        # entry under ~3 minutes on a cache-warm runner. The point is to
        # verify cfg gates, feature unification, and dependency resolution
        # — not to recompile the whole workspace under every triple.
        run: |
          echo "::group::Triple: ${{ matrix.triple }}"
          cargo check --locked --workspace --features ${{ matrix.triple }}
          echo "::endgroup::"

  msrv:
    # MSRV verification gate (issue #783). The workspace declares
    # `rust-version = "1.99"` in the root Cargo.toml, but until this job
    # landed nothing in CI actually verified the claim — a PR that
    # introduced a feature requiring a newer rustc would compile fine on the
    # current toolchain (every other job pins `1.99` exactly today, but
    # that is brittle: a future bump of the workspace toolchain pin in
    # `rust-toolchain.toml` to a newer compiler would silently mask MSRV
    # regressions in the rest of CI). This job pins the exact MSRV via
    # `dtolnay/rust-toolchain` and runs `cargo check` against the same
    # production feature set as the `check-features` and `clippy` jobs,
    # so any new feature, syntax, or stdlib API that requires a
    # toolchain newer than 1.99 fails here loudly.
    #
    # Compilation only — no tests, no clippy. Tests would ~3x the wall
    # time without buying additional MSRV coverage (test failures are
    # caught by the `test` job on the workspace toolchain), and clippy
    # lints evolve between releases so a new clippy warning between releases
    # would be a false MSRV positive.
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action pin; toolchain set below
        with:
          toolchain: "1.99"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install protoc
        # Required by the `proto` and `otel` features, which the production
        # feature set below depends on.
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          fi

      - name: Verify rust toolchain version
        # Defensive sanity check: fails the job loudly if `dtolnay/rust-toolchain`
        # ever silently installs a different version. The version string
        # must contain "1.99" — anything else means MSRV verification is not
        # actually happening on this runner.
        run: |
          rustc --version
          rustc --version | grep -F '1.99' >/dev/null

      - name: Cargo check at MSRV (production feature set)
        # Feature set must stay in sync with the `clippy`, `check-features`,
        # and `test` jobs above so MSRV coverage matches what we actually
        # ship. Drift between this list and those jobs creates MSRV blind
        # spots — a feature only checked here would not be MSRV-verified
        # if it were ever removed from this list, and a feature only
        # checked elsewhere would not be MSRV-verified at all.
        run: cargo check --locked --workspace --features nats,enrollment,est,proto,full-detail,metrics,federation,federation-ha,websocket,mqtt,otel,http

  test:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action pin; toolchain set below
        with:
          toolchain: "1.99"

      - name: Install protoc
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          fi

      - name: Cache nats-server binary
        id: cache-nats
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/nats-server
          key: nats-server-v${{ env.NATS_SERVER_VERSION }}-linux-amd64-${{ env.NATS_SERVER_SHA256 }}

      - name: Install nats-server
        if: steps.cache-nats.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v${NATS_SERVER_VERSION}/nats-server-v${NATS_SERVER_VERSION}-linux-amd64.tar.gz" -o /tmp/nats.tar.gz
          echo "${NATS_SERVER_SHA256}  /tmp/nats.tar.gz" | sha256sum -c -
          tar xzf /tmp/nats.tar.gz -C /tmp
          sudo mv "/tmp/nats-server-v${NATS_SERVER_VERSION}-linux-amd64/nats-server" /usr/local/bin/

      - name: Verify nats-server
        run: nats-server --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-nextest
        run: |
          if ! command -v cargo-nextest >/dev/null 2>&1; then
            curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
          fi

      - name: Run tests
        # `schema` is included so the config-schema drift guard
        # (`rustgate-server/tests/schema_export.rs`, gated on `#[cfg(feature
        # = "schema")]`) actually compiles and runs here — it re-emits the
        # JSON schema and asserts the checked-in `schemas/rustgate-v0.8.json`
        # matches byte-for-byte, catching a forgotten regen in CI.
        run: cargo nextest run --locked --workspace --features nats,enrollment,est,proto,full-detail,metrics,federation,federation-ha,websocket,mqtt,otel,http,schema,marti-compat,missions,video,correlation

      - name: Test federation JWKS client
        # `jwks` is not enabled by any rustgate-server feature, so the
        # workspace run above never compiles these tests.
        run: cargo nextest run --locked -p rustgate-federation --features jwks --test jwks_client

      - name: Test NATS bridge without full-detail
        # The workspace run above enables `full-detail`, which switches the
        # NATS publisher to a different CoT parser. Run the bridge's own
        # tests on the basic-parser path too.
        run: cargo nextest run --locked -p rustgate-nats

      - name: Authz P99 budget gate (release)
        run: cargo nextest run --locked --release -p rustgate-authz --run-ignored all perf_budget

      - name: Run doc tests
        run: cargo test --locked --workspace --doc --features nats,enrollment,est,proto,full-detail,metrics,federation,federation-ha,websocket,mqtt,otel,http,marti-compat,missions,video,correlation

  coverage:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action pin; toolchain set below
        with:
          toolchain: "1.99"
          # cargo-llvm-cov needs the LLVM profiling runtime and the
          # `llvm-profdata`/`llvm-cov` binaries that ship with this component.
          components: llvm-tools-preview

      - name: Install protoc
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          fi

      - name: Cache nats-server binary
        id: cache-nats
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/nats-server
          key: nats-server-v${{ env.NATS_SERVER_VERSION }}-linux-amd64-${{ env.NATS_SERVER_SHA256 }}

      - name: Install nats-server
        if: steps.cache-nats.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v${NATS_SERVER_VERSION}/nats-server-v${NATS_SERVER_VERSION}-linux-amd64.tar.gz" -o /tmp/nats.tar.gz
          echo "${NATS_SERVER_SHA256}  /tmp/nats.tar.gz" | sha256sum -c -
          tar xzf /tmp/nats.tar.gz -C /tmp
          sudo mv "/tmp/nats-server-v${NATS_SERVER_VERSION}-linux-amd64/nats-server" /usr/local/bin/

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-nextest
        run: |
          if ! command -v cargo-nextest >/dev/null 2>&1; then
            curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
          fi

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tool: cargo-llvm-cov

      - name: Generate coverage report
        # cargo-llvm-cov replaces cargo-tarpaulin: it drives `cargo nextest run`
        # with `-Cinstrument-coverage` (LLVM source-based coverage, same model
        # tarpaulin's `--engine llvm` used), but without tarpaulin's ptrace
        # wrapper — nextest runs test binaries in parallel natively. Output is
        # Cobertura XML so the artifact format matches the pre-migration run
        # and any downstream consumer (Codecov, etc.) keeps working unchanged.
        #
        # Flag order matters: llvm-cov options (--cobertura, --output-path,
        # --features, --locked, --workspace) are top-level and MUST precede
        # the `nextest` subcommand. The parent coverage/ directory is created
        # up front because cargo-llvm-cov does not auto-mkdir --output-path.
        run: |
          mkdir -p coverage
          cargo llvm-cov --locked --workspace --features nats,enrollment,est,proto,full-detail,metrics,federation,federation-ha,websocket,mqtt,otel,http,marti-compat,missions,video,correlation --cobertura --output-path coverage/cobertura.xml nextest

      - name: Enforce line-coverage floor
        # Ratchet gate (SEC-17): fail the build if workspace line coverage
        # regresses below the floor. `cargo llvm-cov report` re-reads the
        # profile data the step above already collected (no re-instrumentation,
        # no re-run of the test binaries) and `--fail-under-lines` makes it exit
        # non-zero when the measured line rate drops under the threshold.
        # `report` re-reads already-collected profile data, so it does NOT take
        # `--features` (features only apply to the collection/nextest run above).
        # The floor is deliberately seeded well below the current measured line
        # rate so it never red-lines an in-flight PR on landing; bump it upward
        # (toward `current − small margin`) as coverage climbs so it only ever
        # ratchets forward and can never silently slide backward.
        run: cargo llvm-cov report --locked --fail-under-lines 55

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/cobertura.xml

  fuzz-smoke:
    # Per-PR shallow libFuzzer smoke (SEC-17). The nightly/weekly fuzz jobs run
    # a long deep budget; this job instead spends a fixed ~45s per target on the
    # highest-risk ingress/codec framers so a crash reachable from a freshly
    # introduced parser bug fails the PR that introduced it, not a run days
    # later. Skipped on draft PRs like the other heavyweight jobs.
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: ubuntu-latest
    env:
      # Fuzzing runs on the latest nightly, where lints and deprecations land
      # before stable. Denying warnings here would fail the job on nightly-only
      # deprecations unrelated to fuzzing; the stable `clippy` job enforces
      # warnings. Matches the nightly and weekly fuzz workflows.
      RUSTFLAGS: ""
    strategy:
      # Do not cancel every sibling on the first crash — surface all failing
      # framers in one run so a reviewer sees the full blast radius.
      fail-fast: false
      matrix:
        target:
          # Ingress/codec framers that parse untrusted bytes on the hot path.
          - xml_stream_codec
          - obligation_apply
          - length_prefixed_codec
          - tak_frame_codec
          - federation_frame_parse
          - ws_frame
          - mavlink_v2_frame
    name: fuzz-smoke (${{ matrix.target }})
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly

      - name: Install protoc
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          fi

      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            cargo +nightly install cargo-fuzz --locked
          fi

      - name: Smoke-fuzz ${{ matrix.target }} (~45s)
        # -max_total_time caps the wall budget; the target still replays the
        # checked-in corpus first, so this catches both a corpus-reachable
        # regression and any new crash libFuzzer finds inside the window.
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=45

  fips:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cc: musl-gcc
            run_tests: true
          - target: aarch64-unknown-linux-gnu
            cc: aarch64-linux-gnu-gcc
            linker: aarch64-linux-gnu-gcc
            run_tests: false # cannot run aarch64 binaries on x86 runner

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action pin; toolchain set below
        with:
          toolchain: "1.99"
          components: clippy

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install FIPS build dependencies
        run: |
          if ! command -v protoc >/dev/null 2>&1 || ! command -v cmake >/dev/null 2>&1 || ! command -v go >/dev/null 2>&1 || ! command -v musl-gcc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake golang-go musl-tools
          fi

      - name: Install aarch64 cross-compiler
        if: contains(matrix.target, 'aarch64')
        run: |
          if ! command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Install cargo-nextest
        run: |
          if ! command -v cargo-nextest >/dev/null 2>&1; then
            curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
          fi

      - name: Clippy (FIPS)
        if: matrix.run_tests
        run: |
          cargo clippy --locked -p rustgate-transport -p rustgate-server -p rustgate-enrollment -p rustgate-http --features fips --all-targets
          cargo clippy --locked -p rustgate-federation --features fips,v2 --all-targets

      - name: Build server with FIPS
        env:
          CC_${{ matrix.target }}: ${{ matrix.cc }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
          C_INCLUDE_PATH: ${{ contains(matrix.target, 'musl') && '/usr/include:/usr/include/x86_64-linux-gnu' || '' }}
        run: cargo build --locked -p rustgate-server --features fips,federation,enrollment,http --target ${{ matrix.target }}

      - name: Run FIPS tests
        if: matrix.run_tests
        run: |
          cargo nextest run --locked -p rustgate-transport --features fips
          cargo nextest run --locked -p rustgate-http --features fips

  post-quantum:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action pin; toolchain set below
        with:
          toolchain: "1.99"
          components: clippy

      - name: Install protoc
        # Federation v2 needs protoc. Nothing in this job needs Go or cmake
        # any more: only the FIPS module build does (ADR 0037).
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          fi

      - name: Install cargo-nextest
        run: |
          if ! command -v cargo-nextest >/dev/null 2>&1; then
            curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
          fi

      # Post-quantum key exchange and ML-DSA verification are on in every build
      # (ADR 0037), so the default clippy/test jobs cover them. This job keeps
      # the opt-in post-quantum extras: federation v2, the MAVLink ML-KEM rekey
      # channel, and enrollment's ML-DSA-87 certificate issuance.
      - name: Clippy federation v2
        run: cargo clippy --locked -p rustgate-federation --features v2 --all-targets

      - name: Clippy + test MAVLink PQ rekey channel
        # `mavlink-pq` is excluded from the cargo-hack feature-powerset job;
        # exercise it here.
        run: |
          cargo clippy --locked -p rustgate-mavlink --features mavlink-pq --all-targets
          cargo nextest run --locked -p rustgate-mavlink --features mavlink-pq

      # rustgate-enrollment's `post-quantum` feature is the pure-Rust fips204
      # ML-DSA-87 issuance path (#502). It shares the `post-quantum` name, which
      # the check-features powerset excludes, so it is covered here.
      - name: Clippy + test enrollment ML-DSA-87 issuance (#502)
        run: |
          cargo clippy --locked -p rustgate-enrollment --features post-quantum,est --all-targets
          cargo nextest run --locked -p rustgate-enrollment --features post-quantum,est

  binary-size:
    # Release-binary size regression gate (issue #832). Builds the same
    # feature set as .github/workflows/release-binary.yml's default target
    # (nats,enrollment,proto,full-detail,metrics,federation,federation-ha,
    # websocket,otel,http), strips the binary, and compares its byte count
    # against the checked-in baseline in ci/binary-size-baseline.json.
    #
    # First-run behaviour: the baseline ships as 0, so the check is
    # report-only — it emits a `::notice::` with the observed size and
    # exits 0. A follow-up PR commits the observed value to enable the
    # ±10% regression gate. After that, any PR whose binary grows beyond
    # the threshold fails CI until the PR either reduces the growth or
    # bumps baseline_bytes in the same commit (so the delta is visible
    # in review).
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action pin; toolchain set below
        with:
          toolchain: "1.99"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build release binary
        # Must stay in sync with RELEASE_FEATURES in release-binary.yml and
        # the `features` field of `rustgate-default` in
        # ci/binary-size-baseline.json. Drift between the three will cause
        # the baseline to measure a different binary than what we ship.
        run: cargo build --locked --release --package rustgate-server --features nats,enrollment,proto,full-detail,metrics,federation,federation-ha,websocket,otel,http

      - name: Strip release binary
        # Release packaging in release-binary.yml ships the stripped binary (via
        # `tar -czf` of the default cargo output which includes debug info only
        # when debug=1). Strip here to measure the same shape.
        run: strip target/release/rustgate

      - name: Check binary size against baseline
        # Emits a GitHub step-summary table and a `::notice::` (or
        # `::error::` on regression) annotation. See
        # scripts/check-binary-size.py module docstring for details.
        run: python3 scripts/check-binary-size.py rustgate-default target/release/rustgate

  # ---------------------------------------------------------------------------
  # Split-gate audit model (closes #776)
  #
  # The previous single `audit` job ran `cargo deny check` (advisories +
  # licenses + bans + sources, all blocking) and then `cargo audit` with a
  # hardcoded ignore list that was NOT mirrored in `deny.toml`. That made
  # every advisory category — including `unmaintained` informational
  # warnings on transitive deps — equally merge-blocking, and let the two
  # ignore lists drift apart over time.
  #
  # The split below separates the gate by severity and ties the soft job's
  # ignore list to deny.toml so they cannot drift:
  #
  #   * audit — CI-blocking. `cargo deny check` with the
  #     `unmaintained` / `yanked` / `notice` lints demoted to warn so only
  #     true vulnerabilities (`vulnerability`, `unsound`) plus the static
  #     license/bans/sources policies block merge. Severity threshold for
  #     this gate: `high` — see the comment block at the top of deny.toml.
  #
  #   * audit-soft — never blocks merge. Runs `cargo audit` (which surfaces
  #     RustSec vulnerabilities, unmaintained advisories, and yanked
  #     versions) using the SAME ignore list as deny.toml, extracted by
  #     `scripts/extract-audit-ignores.py`. Findings show up as
  #     `::warning::` annotations on the PR's checks tab; exit code is
  #     pinned to 0 so a new "unmaintained" advisory on a transitive
  #     dependency cannot create a false-positive merge block.
  #
  # Single source of truth: `[advisories].ignore` in deny.toml. Both jobs
  # derive their per-advisory exemptions from there. Do NOT add a per-job
  # ignore list here — that drift is exactly what #776 fixes.
  # ---------------------------------------------------------------------------

  audit:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [check-features, test]
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action pin; toolchain set below
        with:
          toolchain: "1.99"

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tool: cargo-deny

      - name: Check advisories (vulnerabilities, unsound), licenses, bans, sources
        # Severity gate — blocks merge on real vulnerabilities only.
        #
        # `cargo deny` lint categories:
        #   * vulnerability  — RUSTSEC entries with a CVE / security impact.
        #                      Default lint level: deny. Stays at deny here.
        #   * unsound        — RUSTSEC entries flagging unsound public APIs.
        #                      Default lint level: deny. Stays at deny here.
        #   * unmaintained   — informational; upstream crate no longer
        #                      maintained. Demoted to warn in this gate so
        #                      a new "unmaintained" advisory on a transitive
        #                      dep does not block PR merges. Surfaced via
        #                      the audit-soft job below.
        #   * yanked         — registry yanked the version. Demoted to warn;
        #                      audit-soft surfaces it.
        #   * notice         — registry notice (informational). Demoted to
        #                      warn; audit-soft surfaces it.
        #
        # The license/bans/sources sub-checks remain at their deny.toml
        # levels (license violations and disallowed crates DO block merge).
        # Per-advisory exemptions live in deny.toml's `[advisories].ignore`
        # — single source of truth shared with the audit-soft job below.
        run: |
          cargo deny check \
            --hide-inclusion-graph \
            --warn unmaintained \
            --warn yanked \
            --warn notice

  audit-soft:
    # Never blocks merge — surfaces unmaintained / informational advisories
    # as `::warning::` annotations so operators see the surface area without
    # creating false-positive merge blocks. Exit code pinned to 0.
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [check-features, test]
    runs-on: ubuntu-latest
    # `continue-on-error: true` belt-and-braces against an unexpected
    # `cargo audit` exit code escaping the inline `|| true` in the step
    # body. The intent of this job is "report, never block" — both the
    # job-level flag and the step-level `|| true` enforce that.
    continue-on-error: true
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action pin; toolchain set below
        with:
          toolchain: "1.99"

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tool: cargo-audit

      - name: Derive cargo audit ignore list from deny.toml
        # `scripts/extract-audit-ignores.py` reads deny.toml's
        # `[advisories].ignore` array and emits the equivalent set of
        # `--ignore RUSTSEC-XXXX-YYYY` flags for `cargo audit`. Keeping
        # the extraction in a script means the deny.toml ignore list is
        # the single source of truth for both audit jobs.
        id: ignores
        run: |
          flags="$(python3 scripts/extract-audit-ignores.py)"
          echo "Resolved cargo audit ignore flags from deny.toml:"
          echo "  ${flags:-<none>}"
          # GITHUB_OUTPUT is the canonical step-output channel; quote on
          # both sides to preserve the empty case and any embedded spaces.
          echo "flags=${flags}" >> "$GITHUB_OUTPUT"

      - name: Run cargo audit (warning-only)
        # Soft gate. We deliberately do NOT pass `--deny warnings` so
        # unmaintained / yanked findings exit 0; if a `vulnerability`-class
        # advisory slips past audit (e.g. the advisory database
        # picked up a new entry between the two jobs), `cargo audit` would
        # exit non-zero — the trailing `|| true` plus job-level
        # `continue-on-error: true` keep it warning-only. The required
        # gate is the load-bearing block; this job is operator visibility.
        #
        # The `--ignore` flags come from deny.toml via the previous step,
        # not from a hardcoded list in this YAML — that is the alignment
        # #776 calls for.
        env:
          AUDIT_IGNORE_FLAGS: ${{ steps.ignores.outputs.flags }}
        run: |
          set +e
          # AUDIT_IGNORE_FLAGS is a space-separated string of flags
          # (e.g. "--ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-1234").
          # We intentionally rely on shell word-splitting here so each
          # `--ignore <ID>` pair is passed as separate argv entries to
          # `cargo audit`. Quoting would collapse them into a single
          # malformed arg.
          # shellcheck disable=SC2086
          cargo audit ${AUDIT_IGNORE_FLAGS}
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::cargo audit reported soft findings (rc=$rc); see job log for details. This job is warning-only and does not block merge — see audit for the load-bearing gate."
          fi
          exit 0

  helm:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint Helm chart
        run: helm lint helm/

      - name: Render manifests with production values
        run: |
          mkdir -p /tmp/helm-render
          helm template rustgate helm/ -f helm/values-production.yaml \
            > /tmp/helm-render/rendered.yaml

      - name: Validate rendered template is non-empty
        run: test -s /tmp/helm-render/rendered.yaml

      - name: Install Python YAML dependency
        # Install via apt rather than pip to avoid the PEP 668 "externally
        # managed" error that system Python raises on Ubuntu 23.04+ when pip
        # writes to the system site-packages without --break-system-packages.
        # No-op when already present.
        run: |
          if ! python3 -c 'import yaml' 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-yaml
          fi

      - name: Scan RBAC and ServiceAccount posture (least-privilege)
        # Enforces the claims the helm chart makes about its own security
        # posture. Fails the job on any of:
        #   - wildcard verbs / resources / apiGroups / resourceNames in
        #     Role or ClusterRole objects (RBAC least-privilege)
        #   - Role/ClusterRole permissions targeting cluster-level
        #     resources that are typically dangerous (secrets across all
        #     namespaces, node objects, CRD management)
        #   - ClusterRoleBinding whose subject is a `default` SA
        #   - ServiceAccount objects that mount API tokens by default
        #     (automountServiceAccountToken missing or true)
        #   - PodSpec (Pod, Deployment, StatefulSet, DaemonSet, Job,
        #     CronJob, ReplicaSet) that omits automountServiceAccountToken
        #     without naming a non-default ServiceAccount
        #
        # Intentionally implemented as a pure-Python scanner rather than
        # kubeaudit or polaris: kubeaudit is deprecated upstream (Oct 2024)
        # and polaris pulls in a large Go binary for broader hardening
        # checks that are out of scope for this PR. The checks below are
        # the direct asks of issue #782 (RBAC least-privilege on the helm
        # chart); broader pod-security hardening can be layered in a
        # follow-up PR if desired.
        run: |
          python3 <<'PY'
          import sys
          import yaml

          WORKLOAD_KINDS = {
              "Pod", "Deployment", "StatefulSet", "DaemonSet",
              "Job", "CronJob", "ReplicaSet",
          }
          RBAC_RULE_KINDS = {"Role", "ClusterRole"}
          RBAC_BINDING_KINDS = {"RoleBinding", "ClusterRoleBinding"}

          with open("/tmp/helm-render/rendered.yaml") as f:
              docs = [d for d in yaml.safe_load_all(f) if isinstance(d, dict)]

          violations = []
          summary = {"rbac_rules": 0, "rbac_bindings": 0, "service_accounts": 0, "pod_specs": 0}

          def pod_spec(doc):
              """Return the PodSpec for a workload document, or None."""
              kind = doc.get("kind", "")
              if kind == "Pod":
                  return doc.get("spec")
              if kind == "CronJob":
                  return (
                      doc.get("spec", {})
                         .get("jobTemplate", {})
                         .get("spec", {})
                         .get("template", {})
                         .get("spec")
                  )
              if kind in WORKLOAD_KINDS:
                  return (
                      doc.get("spec", {})
                         .get("template", {})
                         .get("spec")
                  )
              return None

          for doc in docs:
              kind = doc.get("kind", "")
              name = doc.get("metadata", {}).get("name", "?")
              ref = f"{kind}/{name}"

              # --- RBAC rule documents: reject wildcards and dangerous combos ---
              if kind in RBAC_RULE_KINDS:
                  summary["rbac_rules"] += 1
                  for rule in doc.get("rules") or []:
                      verbs = rule.get("verbs") or []
                      resources = rule.get("resources") or []
                      api_groups = rule.get("apiGroups") or []
                      resource_names = rule.get("resourceNames") or []
                      for field, values in (
                          ("verbs", verbs),
                          ("resources", resources),
                          ("apiGroups", api_groups),
                          ("resourceNames", resource_names),
                      ):
                          if "*" in values:
                              violations.append(f"{ref}: wildcard in .rules[].{field}")
                      # Dangerous cluster-scope combos even without wildcards
                      if "secrets" in resources and "list" in verbs and kind == "ClusterRole":
                          violations.append(f"{ref}: ClusterRole lists secrets cluster-wide")
                      if "nodes" in resources and any(v in verbs for v in ("create", "delete", "patch", "update")):
                          violations.append(f"{ref}: grants mutating verbs on nodes")
                      if "customresourcedefinitions" in resources and any(v in verbs for v in ("create", "delete", "patch", "update")):
                          violations.append(f"{ref}: grants CRD mutation")

              # --- Binding documents: reject default-SA subjects ---
              if kind in RBAC_BINDING_KINDS:
                  summary["rbac_bindings"] += 1
                  for subject in doc.get("subjects") or []:
                      s_kind = subject.get("kind", "")
                      s_name = subject.get("name", "")
                      if s_kind == "ServiceAccount" and s_name == "default":
                          violations.append(f"{ref}: binds to default ServiceAccount")

              # --- ServiceAccount: must explicitly disable token automount ---
              if kind == "ServiceAccount":
                  summary["service_accounts"] += 1
                  automount = doc.get("automountServiceAccountToken")
                  if automount is not False:
                      violations.append(
                          f"{ref}: automountServiceAccountToken must be explicitly false "
                          f"(got {automount!r})"
                      )

              # --- PodSpec: must either name a non-default SA or disable automount ---
              spec = pod_spec(doc)
              if spec is not None:
                  summary["pod_specs"] += 1
                  automount = spec.get("automountServiceAccountToken")
                  sa_name = spec.get("serviceAccountName") or spec.get("serviceAccount")
                  if automount is not False and (not sa_name or sa_name == "default"):
                      violations.append(
                          f"{ref}: PodSpec uses default SA without automountServiceAccountToken=false "
                          f"(sa={sa_name!r}, automount={automount!r})"
                      )

          print("Helm RBAC/SA scan summary:")
          for key, count in summary.items():
              print(f"  {key}: {count}")

          if violations:
              print("\nRBAC/SA least-privilege violations:")
              for v in violations:
                  print(f"  - {v}")
              sys.exit(1)
          print("\nRBAC/SA check passed: no wildcard permissions or default-SA leaks.")
          PY

  docker:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [check-features, test]
    runs-on: ubuntu-latest
    # dorny/paths-filter calls listFiles(pull_number) via the GitHub API on
    # pull_request events; on private repos this requires explicit
    # pull-requests: read (the top-level permissions block only grants
    # contents: read, which leaves all other scopes as `none`).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # dorny/paths-filter uses the GitHub API on pull_request events, but
      # shells out to `git` for push events. With `persist-credentials:
      # false` (our workspace-wide hardening), a shallow clone leaves the
      # action unable to authenticate when it tries to fetch the base SHA,
      # so we ask for full history up front and let paths-filter do all
      # its diffing locally.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate Dockerfile COPY matches workspace members
        run: |
          # Extract crate directory names from Cargo.toml members list
          members=$(sed -n '/^\[workspace\]/,/^$/p' Cargo.toml \
            | grep -oP '"crates/[^"]+"' \
            | tr -d '"')

          missing=()
          for member in $members; do
            crate_name=$(basename "$member")
            if ! grep -q "COPY ${member}/Cargo.toml" Dockerfile; then
              missing+=("$member")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Dockerfile is missing COPY for workspace members:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All workspace members have corresponding COPY in Dockerfile."

      - name: Validate Dockerfile FROM digest pinning
        run: |
          # Every FROM line must pin a @sha256 digest — defends against
          # tag-hijack and makes builds reproducible (issue #779).
          # Dependabot's `docker` ecosystem (see .github/dependabot.yml)
          # rotates these weekly. `FROM scratch` is allowed since it
          # is a zero-byte fixed base image.
          #
          # Exemption: `Dockerfile.ironbank` references the Iron Bank
          # `registry1.dso.mil` mirror, which requires CAC/PIV
          # authentication and is not reachable from public CI. DoD
          # operators who consume this Dockerfile pin the digest in
          # their own CI based on what their accessible registry
          # mirror serves. The `:9-latest` tag on the in-tree file
          # is a placeholder the consumer replaces — see the header
          # comment in `Dockerfile.ironbank` for the operator
          # procedure. Public-network Dockerfiles (`Dockerfile`,
          # `Dockerfile.operator`, …) are still strictly checked.
          set -euo pipefail
          bad=0
          while IFS= read -r file; do
            awk -v f="$file" '
              /^[[:space:]]*FROM[[:space:]]/ && !/^[[:space:]]*#/ {
                if ($0 ~ /^[[:space:]]*FROM[[:space:]]+scratch([[:space:]]|$)/) next
                if ($0 !~ /@sha256:[0-9a-f]{64}/) {
                  printf "::error file=%s,line=%d::FROM is not pinned to @sha256 digest: %s\n", f, NR, $0
                  exit 2
                }
              }
            ' "$file" || bad=$((bad+1))
          done < <(git ls-files '*Dockerfile*' | grep -v '^\.claude/' | grep -v '^Dockerfile\.ironbank$')
          if [ "$bad" -gt 0 ]; then
            echo "::error::${bad} Dockerfile(s) contain FROM lines without @sha256 digest pinning."
            echo "::error::Resolve with: docker buildx imagetools inspect <image>:<tag>  → copy the top-level Digest, then pin as 'FROM <image>:<tag>@sha256:<digest>'."
            exit 1
          fi
          echo "All FROM lines are pinned to @sha256 digests (Dockerfile.ironbank exempt — DoD-restricted registry; operators re-pin in their own CI)."

      - name: Check for Docker-relevant changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'Cargo.*'
              - 'crates/**'
              - '.github/workflows/ci.yml'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.docker == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker build (no push)
        if: steps.filter.outputs.docker == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
