name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -Dwarnings

jobs:
  commit-lint:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate PR title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|deps|ci|refactor|test|chore|style|perf|build|revert)(\(.+\))?!?: .+'
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title does not follow Conventional Commits format."
            echo ""
            echo "Expected: <type>(<scope>): <description>"
            echo "Types: feat, fix, docs, deps, ci, refactor, test, chore, style, perf, build, revert"
            echo ""
            echo "Got: $PR_TITLE"
            exit 1
          fi

  lint:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Check for unused dependencies
        run: cargo machete

  clippy:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: self-hosted
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Clippy (all features)
        run: cargo clippy --all-features --all-targets

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps

  test:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [lint, clippy]
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ""
          - name: nats
            flags: "--features nats"
          - name: enrollment
            flags: "--features enrollment"
          - name: proto
            flags: "--features proto"
          - name: metrics
            flags: "--features metrics"
          - name: websocket
            flags: "--features websocket"
          - name: federation
            flags: "--features federation"
          - name: websocket-nats
            flags: "--features websocket,nats"
          - name: websocket-federation
            flags: "--features websocket,federation"
          - name: federation-nats
            flags: "--features federation,nats"
          - name: federation-metrics
            flags: "--features federation,metrics"
          - name: proto-federation
            flags: "--features proto,federation"
          - name: enrollment-federation
            flags: "--features enrollment,federation"
          - name: nats-metrics
            flags: "--features nats,metrics"
          - name: full-detail
            flags: "--features full-detail"
          - name: federation-ha
            flags: "--features federation-ha,nats"
          - name: all
            flags: "--all-features"
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run tests
        run: cargo test ${{ matrix.flags }}

  audit:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [test]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

      - name: Run cargo audit
        run: cargo audit

  helm:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [test]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint Helm chart
        run: helm lint helm/

  docker:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Docker build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: false
