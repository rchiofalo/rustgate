version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    rebase-strategy: auto
    commit-message:
      prefix: "deps"
    ignore:
      # rasn-ocsp must stay on the same version as ocsp-stapler's transitive
      # copy (see the comment in Cargo.toml); bump it with ocsp-stapler.
      - dependency-name: "rasn-ocsp"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # der 0.8 / x509-cert 0.3 are blocked until cms (enrollment PKCS#12)
      # ships a release built on them; cms 0.2 requires der 0.7.
      - dependency-name: "der"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "x509-cert"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # opentelemetry, opentelemetry_sdk, opentelemetry-otlp and
      # tracing-opentelemetry must move together: bumping one alone mixes
      # two opentelemetry versions and fails to compile. Dependabot assigns
      # a dependency to the first group it matches, so these come first.
      opentelemetry-security:
        applies-to: security-updates
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      opentelemetry:
        applies-to: version-updates
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      security:
        applies-to: security-updates
        patterns:
          - "*"
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    rebase-strategy: auto
    commit-message:
      prefix: "ci"
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: docker
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "deps"
