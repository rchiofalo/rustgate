[workspace]
resolver = "2"
members = [
    "crates/rustgate-core",
    "crates/rustgate-cot",
    "crates/rustgate-enrollment",
    "crates/rustgate-federation",
    "crates/rustgate-nats",
    "crates/rustgate-proto",
    "crates/rustgate-transport",
    "crates/rustgate-server",
    "crates/rustgate-test-utils",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
repository = "https://github.com/rchiofalo/rustgate"
keywords = ["tak", "cot", "mtls", "nats", "tactical"]
categories = ["network-programming", "command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_results = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
dbg_macro = "deny"
unused_async = "warn"

[workspace.dependencies]
tokio = { version = "1", default-features = false }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
x509-parser = "0.18"
sha2 = "0.10"
bytes = "1"
quick-xml = "0.39"
thiserror = "2"
anyhow = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http-body-util = "0.1"
base64 = "0.22"
async-nats = { version = "0.46", default-features = false, features = ["jetstream", "nkeys"] }
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false }
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
prometheus = { version = "0.14", default-features = false }
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

# Internal crates
rustgate-core = { path = "crates/rustgate-core" }
rustgate-cot = { path = "crates/rustgate-cot" }
rustgate-enrollment = { path = "crates/rustgate-enrollment" }
rustgate-nats = { path = "crates/rustgate-nats" }
rustgate-proto = { path = "crates/rustgate-proto" }
rustgate-federation = { path = "crates/rustgate-federation" }
rustgate-transport = { path = "crates/rustgate-transport" }
rustgate-test-utils = { path = "crates/rustgate-test-utils" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
