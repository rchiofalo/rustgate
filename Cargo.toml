[workspace]
resolver = "2"
members = [
    "crates/rustgate-core",
    "crates/rustgate-cot",
    "crates/rustgate-enrollment",
    "crates/rustgate-nats",
    "crates/rustgate-transport",
    "crates/rustgate-server",
    "crates/rustgate-test-utils",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
repository = "https://github.com/rchiofalo/rustgate"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_results = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
dbg_macro = "deny"
unused_async = "warn"

[workspace.dependencies]
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1"
x509-parser = "0.17"
sha2 = "0.10"
bytes = "1"
quick-xml = "0.37"
thiserror = "2"
anyhow = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
rcgen = "0.13"

# Internal crates
rustgate-core = { path = "crates/rustgate-core" }
rustgate-cot = { path = "crates/rustgate-cot" }
rustgate-enrollment = { path = "crates/rustgate-enrollment" }
rustgate-nats = { path = "crates/rustgate-nats" }
rustgate-transport = { path = "crates/rustgate-transport" }
rustgate-test-utils = { path = "crates/rustgate-test-utils" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
