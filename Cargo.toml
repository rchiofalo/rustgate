[workspace]
resolver = "2"
members = [
    "crates/rustgate-core",
    "crates/rustgate-cot",
    "crates/rustgate-enrollment",
    "crates/rustgate-federation",
    "crates/rustgate-nats",
    "crates/rustgate-proto",
    "crates/rustgate-transport",
    "crates/rustgate-websocket",
    "crates/rustgate-server",
    "crates/rustgate-test-utils",
    "crates/rustgate-client",
    "crates/rustgate-authz",
    "crates/rustgate-mqtt",
    "crates/rustgate-http",
    "crates/rustgate-mavlink",
    "crates/rustgate-asterix",
    "crates/rustgate-dis",
    "crates/rustgate-resilience",
    "crates/rustgate-stanag4586",
    "crates/rustgate-meshtastic",
    "crates/rustgate-guard",
    "crates/rustgate-admin",
    "crates/rustgate-archive",
    "crates/rustgate-metrics",
    "crates/rustgate-tls",
    "crates/rustgate-router",
    "crates/rustgate-sapient",
    "crates/rustgate-nffi",
    "crates/rustgate-vmf",
    "crates/rustgate-link16",
    "crates/rustgate-missions",
    "crates/rustgate-lattice",
    "crates/rustgate-foundry",
    "crates/rustgate-dds",
    "crates/rustgate-ogc-sensorthings",
    "crates/rustgate-correlation",
    "crates/rustgate-operator",
    "crates/rustgate-inference",
    "crates/rustgate-codec-schema",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.94"
license = "LicenseRef-Proprietary"
repository = "https://github.com/rchiofalo/rustgate"
keywords = ["tak", "cot", "mtls", "nats", "tactical"]
categories = ["network-programming", "command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_results = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
dbg_macro = "deny"
unused_async = "warn"

[workspace.dependencies]
tokio = { version = "1", default-features = false }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
x509-parser = "0.18"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
bytes = "1"
quick-xml = "0.39"
thiserror = "2"
anyhow = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
rcgen = { version = "0.14", features = ["x509-parser", "zeroize"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http-body = "1"
http-body-util = "0.1"
base64 = "0.22"
tokio-tungstenite = "0.29"
# `permessage-deflate` (RFC 7692) is implemented at the application layer
# inside `rustgate-websocket::compression` because tokio-tungstenite 0.29
# does not yet ship a `deflate` feature on its `tungstenite` dep — the only
# consumer today is the deflate-codec round-trip and the negotiation-handshake
# header echo, but it is workspace-level so future per-frame wire-up (slated
# for whichever release first exposes the upstream feature) can adopt the same
# version pin without churn.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
socket2 = "0.6"
rustix = { version = "1", default-features = false, features = ["process"] }
async-nats = { version = "0.47", default-features = false, features = ["jetstream", "nkeys", "server_2_10"] }
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false }
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML serialization for the Kubernetes operator's manifest renderer
# (`rustgate-operator`, closes #874). The operator emits Kubernetes
# manifests (StatefulSet, Service, ConfigMap, Certificate) as YAML
# strings for golden-render snapshot tests and `kubectl apply -f -`
# pipelines. `serde_yaml` is unmaintained upstream (RUSTSEC-2024-0320,
# informational) but remains the de-facto serde-compatible YAML codec
# in the Rust ecosystem and is purely a serialization concern with no
# network surface; the audit-soft pipeline already tolerates this
# class of advisory under the split-gate model.
serde_yaml = "0.9"
# Snapshot-test framework used by `rustgate-operator` golden-render
# tests so a manifest layout regression fails the test rather than
# silently passing.
insta = { version = "1", features = ["yaml"] }
# JSON Schema generation for the optional `schema` feature on `rustgate-server`.
# Pulled in only when the operator builds with `--features schema` to emit a
# JSON Schema for `rustgate.toml` (issue #815, F-137); the no-schema build does
# not carry the dep.
schemars = "1.2"
time = { version = "0.3", features = ["formatting"] }
prometheus = { version = "0.14", default-features = false }
opentelemetry = { version = "0.31", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "metrics", "grpc-tonic"] }
tracing-opentelemetry = { version = "0.32", default-features = false }
parking_lot = "0.12"
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = "0.6"
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
arbitrary = { version = "1", features = ["derive"] }
proptest = "1"
ring = "0.17"
cms = "0.2.3"
der = "0.7"
x509-cert = "0.2"
subtle = "2"
unicode-normalization = "0.1"
arc-swap = "1"
dashmap = "6"
lru = "0.18.0"
# R*-tree spatial index for the multi-sensor track correlation engine
# (`rustgate-correlation`, closes #848). Used to find fused-entity
# candidates near an incoming sensor report so the gating ladder runs in
# O(log N) per submit instead of scanning the whole fused-entity map.
rstar = "0.12"
zeroize = { version = "1", features = ["derive"] }
ocsp-stapler = "0.4"
fastrand = "2"
figment = { version = "0.10", features = ["toml"] }
toml = "1.1"
# Comment-preserving TOML editor used by the `migrate-config` subcommand
# (issue #815, F-138). Unlike the `toml` crate, `toml_edit` round-trips
# through a syntax tree that preserves blank lines, comments, and key
# ordering, which keeps an operator's hand-written annotations intact when
# their config is rewritten across a version boundary.
toml_edit = "0.22"
serial_test = "3"
redb = "4"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
hex = "0.4"
ahash = "0.8"
smol_str = { version = "0.3", features = ["serde"] }
cedar-policy = "4"
spiffe = { version = "0.14", default-features = false, features = ["workload-api-x509"] }
async-trait = "0.1.89"
mdns-sd = { version = "0.19", default-features = false, features = ["async"] }
etcd-client = { version = "0.18", default-features = false, features = ["tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
wiremock = "0.6"
# Kubernetes client + runtime for the operator's live apply-loop
# (`rustgate-operator`, feature `controller`). Pulls in the typed API
# client, the `kube_runtime::Controller` harness used to watch and
# reconcile `RustgateCluster` resources, the `derive` macros for
# generating a `CustomResource` wrapper, and the leader-election
# primitives backed by `coordination.k8s.io/v1` Leases. Default features
# include `openssl-tls`, which would pull `openssl` into the dep tree and
# trip the deny.toml ban, so the default set is disabled and
# `rustls-tls` is opted into explicitly.
kube = { version = "3.1", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
# Typed Kubernetes resource bindings. Pinned to the same minor as `kube`'s
# tested-against version per the `kube` README. The `latest` feature picks
# the most recent Kubernetes API surface the bindings ship; the operator
# only uses StatefulSet / Service / ConfigMap / Lease / Event types so any
# 1.28+ cluster works.
k8s-openapi = { version = "0.27", features = ["latest"] }
# Lightweight HTTP router for the operator's `/healthz`, `/readyz`, and
# `/metrics` endpoints. Default features are disabled so we don't pull in
# multipart, ws, or other surface area we don't need.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
# JSON Patch (RFC 6902) — used to build the strategic-merge / JSON-patch
# document for `Api::patch_status`. Re-exported from `kube` but pinning it
# at workspace level so any other crate that needs it lands on the same
# version.
json-patch = "4"
# Calendar / wall-clock timestamps for the operator's `lastReconciled`
# field and `Condition.lastTransitionTime`. The `time` crate is already
# in the workspace for `formatting` only, but `chrono` matches the RFC
# 3339 + serde patterns used by `k8s-openapi` and `kube` everywhere
# else, so for the operator we use `chrono` to avoid impedance mismatch.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
# Pure-Rust DDS implementation (RTPS wire protocol) used by
# `rustgate-dds` behind the `dds-real` feature flag. Chosen over the
# Cyclone DDS FFI binding because rustdds is `#![forbid(unsafe_code)]`
# compatible, has no native-library install step, and is the
# foundation `ros2-client` builds on (so the same dependency satisfies
# both raw-DDS and ROS 2 wire compat).
rustdds = "0.11"
# ROS 2 client wrapping rustdds. Exposes the ROS 2 graph (nodes,
# topics, parameters, rosout) and applies the ROS 2 name-mangling
# convention (`rt/<topic>`) so a rustgate-published message is
# visible to `ros2 topic echo`.
ros2-client = "0.8"

# Internal crates
rustgate-core = { path = "crates/rustgate-core" }
rustgate-cot = { path = "crates/rustgate-cot" }
rustgate-enrollment = { path = "crates/rustgate-enrollment" }
rustgate-nats = { path = "crates/rustgate-nats" }
rustgate-proto = { path = "crates/rustgate-proto" }
rustgate-federation = { path = "crates/rustgate-federation" }
rustgate-transport = { path = "crates/rustgate-transport" }
rustgate-websocket = { path = "crates/rustgate-websocket" }
rustgate-test-utils = { path = "crates/rustgate-test-utils" }
rustgate-client = { path = "crates/rustgate-client" }
rustgate-authz = { path = "crates/rustgate-authz" }
rustgate-mqtt = { path = "crates/rustgate-mqtt" }
rustgate-http = { path = "crates/rustgate-http" }
rustgate-mavlink = { path = "crates/rustgate-mavlink" }
rustgate-asterix = { path = "crates/rustgate-asterix" }
rustgate-dis = { path = "crates/rustgate-dis" }
rustgate-resilience = { path = "crates/rustgate-resilience" }
rustgate-stanag4586 = { path = "crates/rustgate-stanag4586" }
rustgate-meshtastic = { path = "crates/rustgate-meshtastic" }
rustgate-guard = { path = "crates/rustgate-guard" }
rustgate-admin = { path = "crates/rustgate-admin" }
rustgate-archive = { path = "crates/rustgate-archive" }
rustgate-metrics = { path = "crates/rustgate-metrics" }
rustgate-tls = { path = "crates/rustgate-tls" }
rustgate-router = { path = "crates/rustgate-router" }
rustgate-sapient = { path = "crates/rustgate-sapient" }
rustgate-nffi = { path = "crates/rustgate-nffi" }
rustgate-vmf = { path = "crates/rustgate-vmf" }
rustgate-link16 = { path = "crates/rustgate-link16" }
rustgate-missions = { path = "crates/rustgate-missions" }
rustgate-lattice = { path = "crates/rustgate-lattice" }
rustgate-foundry = { path = "crates/rustgate-foundry" }
rustgate-dds = { path = "crates/rustgate-dds" }
rustgate-ogc-sensorthings = { path = "crates/rustgate-ogc-sensorthings" }
rustgate-correlation = { path = "crates/rustgate-correlation" }
rustgate-operator = { path = "crates/rustgate-operator" }
rustgate-inference = { path = "crates/rustgate-inference" }
rustgate-codec-schema = { path = "crates/rustgate-codec-schema" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
