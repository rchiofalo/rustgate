[workspace]
resolver = "2"
members = [
    "crates/rustgate-core",
    "crates/rustgate-cot",
    "crates/rustgate-enrollment",
    "crates/rustgate-federation",
    "crates/rustgate-nats",
    "crates/rustgate-proto",
    "crates/rustgate-transport",
    "crates/rustgate-websocket",
    "crates/rustgate-server",
    "crates/rustgate-test-utils",
    "crates/rustgate-client",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.93"
license = "LicenseRef-Proprietary"
repository = "https://github.com/rchiofalo/rustgate"
keywords = ["tak", "cot", "mtls", "nats", "tactical"]
categories = ["network-programming", "command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_results = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
dbg_macro = "deny"
unused_async = "warn"

[workspace.dependencies]
tokio = { version = "1", default-features = false }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
x509-parser = "0.18"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
bytes = "1"
quick-xml = "0.39"
thiserror = "2"
anyhow = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http-body = "1"
http-body-util = "0.1"
base64 = "0.22"
tokio-tungstenite = "0.29"
socket2 = "0.6"
async-nats = { version = "0.47", default-features = false, features = ["jetstream", "nkeys"] }
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false }
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
prometheus = { version = "0.14", default-features = false }
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "grpc-tonic"] }
tracing-opentelemetry = { version = "0.32", default-features = false }
parking_lot = "0.12"
tikv-jemallocator = "0.6"
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
arbitrary = { version = "1", features = ["derive"] }
proptest = "1"
ring = "0.17"
subtle = "2"
unicode-normalization = "0.1"
arc-swap = "1"
lru = "0.12"
zeroize = { version = "1", features = ["derive"] }
ocsp-stapler = "0.4"
fastrand = "2"
figment = { version = "0.10", features = ["toml"] }
toml = "0.8"
serial_test = "3"
redb = "2"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
hex = "0.4"
spiffe = { version = "0.12", default-features = false, features = ["workload-api-x509"] }

# Internal crates
rustgate-core = { path = "crates/rustgate-core" }
rustgate-cot = { path = "crates/rustgate-cot" }
rustgate-enrollment = { path = "crates/rustgate-enrollment" }
rustgate-nats = { path = "crates/rustgate-nats" }
rustgate-proto = { path = "crates/rustgate-proto" }
rustgate-federation = { path = "crates/rustgate-federation" }
rustgate-transport = { path = "crates/rustgate-transport" }
rustgate-websocket = { path = "crates/rustgate-websocket" }
rustgate-test-utils = { path = "crates/rustgate-test-utils" }
rustgate-client = { path = "crates/rustgate-client" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
