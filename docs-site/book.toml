[book]
title = "rustgate"
description = "Tactical mTLS message router — documentation, operations, and research"
authors = ["rustgate contributors"]
language = "en"
src = "src"
multilingual = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.0.2"

[preprocessor.toc]
command = "mdbook-toc"
renderer = ["html"]

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/rchiofalo/rustgate"
edit-url-template = "https://github.com/rchiofalo/rustgate/edit/main/docs-site/{path}"
mathjax-support = true
additional-css = ["theme/custom.css"]

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = true
level = 1

[output.linkcheck]
follow-web-links = false
warning-policy = "error"
# Cross-references inside {{#include}}'d docs/ files resolve against their
# original directory, not the mdBook src/ tree.  These patterns suppress the
# known-broken relative links from included content.
exclude = [
  "cot-delta-encoding\\.md",
  "authorization\\.md",
  "runbooks/authz\\.md",
  "federation\\.md",
  "observability\\.md",
  "security-posture\\.md",
  "tls-certificates\\.md",
  "deployment\\.md",
  "graceful-degradation\\.md",
  "configuration\\.md",
  "\\.\\./crates/",
  "\\.\\./SECURITY\\.md",
  # CHANGELOG uses Keep-a-Changelog [version] headers that look like
  # incomplete reference links to the checker.
  "^Unreleased$",
  "^\\d+\\.\\d+\\.\\d+$",
]
