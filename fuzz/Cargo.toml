[package]
name = "rustgate-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tokio-util = { version = "0.7", features = ["codec"] }
rustgate-core = { path = "../crates/rustgate-core" }
rustgate-transport = { path = "../crates/rustgate-transport" }
rustgate-cot = { path = "../crates/rustgate-cot" }
rustgate-proto = { path = "../crates/rustgate-proto" }
rustgate-federation = { path = "../crates/rustgate-federation", features = ["v2"] }
rustgate-nats = { path = "../crates/rustgate-nats" }
rustgate-enrollment = { path = "../crates/rustgate-enrollment" }
rustgate-websocket = { path = "../crates/rustgate-websocket" }
rcgen = { version = "0.14", features = ["x509-parser"] }
serde_json = "1"
rustls-pki-types = { version = "1", features = ["std"] }
tokio-tungstenite = "0.29"

[[bin]]
name = "xml_stream_codec"
path = "fuzz_targets/xml_stream_codec.rs"
doc = false

[[bin]]
name = "cot_parse"
path = "fuzz_targets/cot_parse.rs"
doc = false

[[bin]]
name = "tak_frame_codec"
path = "fuzz_targets/tak_frame_codec.rs"
doc = false

[[bin]]
name = "length_prefixed_codec"
path = "fuzz_targets/length_prefixed_codec.rs"
doc = false

[[bin]]
name = "v2_federation_convert"
path = "fuzz_targets/v2_federation_convert.rs"
doc = false

[[bin]]
name = "jwt_parse"
path = "fuzz_targets/jwt_parse.rs"
doc = false

[[bin]]
name = "csr_parse"
path = "fuzz_targets/csr_parse.rs"
doc = false

[[bin]]
name = "nats_wire_event"
path = "fuzz_targets/nats_wire_event.rs"
doc = false

[[bin]]
name = "ws_frame"
path = "fuzz_targets/ws_frame.rs"
doc = false

[[bin]]
name = "crl_parse"
path = "fuzz_targets/crl_parse.rs"
doc = false

[[bin]]
name = "proto_roundtrip"
path = "fuzz_targets/proto_roundtrip.rs"
doc = false
