[workspace]

[package]
name = "rustgate-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[package.metadata.cargo-machete]
ignored = ["arbitrary"]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
tokio-util = { version = "0.7", features = ["codec"] }
rustgate-core = { path = "../crates/rustgate-core", features = ["fuzz"] }
rustgate-transport = { path = "../crates/rustgate-transport" }
rustgate-router = { path = "../crates/rustgate-router" }
rustgate-cot = { path = "../crates/rustgate-cot", features = ["fuzz"] }
rustgate-mavlink = { path = "../crates/rustgate-mavlink" }
rustgate-proto = { path = "../crates/rustgate-proto" }
rustgate-federation = { path = "../crates/rustgate-federation", features = ["v2"] }
rustgate-nats = { path = "../crates/rustgate-nats" }
rustgate-authz = { path = "../crates/rustgate-authz" }
rustgate-stanag4586 = { path = "../crates/rustgate-stanag4586" }
rustgate-asterix = { path = "../crates/rustgate-asterix" }
rustgate-meshtastic = { path = "../crates/rustgate-meshtastic" }
rustgate-vmf = { path = "../crates/rustgate-vmf" }
rustgate-dis = { path = "../crates/rustgate-dis" }
rustgate-link16 = { path = "../crates/rustgate-link16" }
rustgate-sapient = { path = "../crates/rustgate-sapient" }
rustgate-nffi = { path = "../crates/rustgate-nffi" }
rustgate-ogc-sensorthings = { path = "../crates/rustgate-ogc-sensorthings" }
rcgen = { version = "0.14", features = ["x509-parser"] }
serde_json = "1"
rustls-pki-types = { version = "1", features = ["std"] }
tokio-tungstenite = "0.29"

[[bin]]
name = "xml_stream_codec"
path = "fuzz_targets/xml_stream_codec.rs"
doc = false

[[bin]]
name = "cot_parse"
path = "fuzz_targets/cot_parse.rs"
doc = false

