[graph]
targets = []
all-features = true

[advisories]
ignore = [
    # tikv-jemallocator 0.6.1 depends on paste, which is archived/unmaintained.
    # paste is a proc-macro with no runtime code and no security surface; the
    # advisory is informational, not a vulnerability. tikv-jemallocator has no
    # newer release that drops paste. Remove this ignore when they do.
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

# aws-lc-sys and aws-lc-fips-sys are licensed ISC + Apache-2.0 + OpenSSL.
# The OpenSSL license is FSF-approved. These crates provide the crypto
# primitives for rustls (default) and FIPS 140-3 validated builds.
[[licenses.exceptions]]
allow = ["OpenSSL"]
crate = "aws-lc-sys"
[[licenses.exceptions]]
allow = ["OpenSSL"]
crate = "aws-lc-fips-sys"

# ocsp-stapler is MPL-2.0. The MPL-2.0 is a file-level (weak) copyleft: only
# modifications to MPL-licensed source files must be released under MPL.
# Linking the unmodified upstream crate into a proprietary binary is
# explicitly permitted, so this exception is safe for downstream consumers.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "ocsp-stapler"

# ar_archive_writer is "Apache-2.0 WITH LLVM-exception". It is a transitive
# build-time dependency pulled in only via the `cedar` feature:
#   cedar-policy -> cedar-policy-core -> stacker -> psm -> ar_archive_writer
# (as a build dep). The LLVM exception is the standard LLVM linking
# exemption that waives GPL-style copyleft propagation when linked into
# a downstream binary; it is strictly more permissive than plain
# Apache-2.0 for our usage and is explicitly listed as acceptable by
# the FSF. Pinning the exception at the crate name keeps us from
# silently widening the LLVM-exception allowance to unrelated crates.
[[licenses.exceptions]]
allow = ["Apache-2.0 WITH LLVM-exception"]
crate = "ar_archive_writer"

[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-core"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-cot"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-enrollment"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-nats"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-proto"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-transport"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-websocket"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-server"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-federation"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-test-utils"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-client"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-authz"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-mqtt"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-http"

[bans]
multiple-versions = "warn"
wildcards = "allow"

# Explicit bans — these crates must never enter the dependency tree.
# rustgate uses rustls exclusively; pulling in OpenSSL or native-tls
# would introduce C library dependencies, complicate FIPS validation,
# and widen the attack surface.
deny = [
    # OpenSSL bindings — rustls is the sole TLS provider
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    # openssl-probe is allowed: it only locates OS certificate paths for
    # rustls-native-certs, it does not link or use OpenSSL.

    # native-tls dispatches to platform TLS (SChannel/SecureTransport/OpenSSL)
    { crate = "native-tls", use-instead = "rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
