# =============================================================================
# Audit policy — split-gate model (closes #776)
# =============================================================================
#
# CI runs two distinct audit jobs against this configuration:
#
#   1. `audit` (CI-blocking)
#      Runs `cargo deny check` and blocks merge ONLY on real
#      vulnerabilities — i.e. the `vulnerability` and `unsound` advisory
#      lints, plus the static `licenses` / `bans` / `sources` policies
#      below. The `unmaintained`, `yanked`, and `notice` lints are
#      demoted to warnings via the job's `--warn` flags so an upstream
#      crate going into maintenance mode does NOT block PR merges.
#
#   2. `audit-soft` (warning-only, never blocks)
#      Runs `cargo audit` with the same RUSTSEC ignore list as this
#      file (extracted by `scripts/extract-audit-ignores.py`) and emits
#      `::warning::` annotations on the PR for any unmaintained / yanked
#      / informational findings. Always exits 0. Operators see surface
#      area without false-positive merge blocks.
#
# Severity threshold (chosen for the required gate): `high`. The cargo-deny
# advisory model maps to RustSec's vulnerability classification — the
# `vulnerability` and `unsound` lints are the ones that carry a CVSS-style
# severity rating, and historically every RUSTSEC-* with a documented CVE
# in our dependency graph has been classified into one of those two buckets.
# Suppressing `unmaintained`/`yanked`/`notice` from the required gate
# captures the "high/critical only" policy issue #776 calls out.
#
# SINGLE SOURCE OF TRUTH: the `ignore` array in `[advisories]` below is
# the only list of advisories we knowingly accept. Both audit jobs derive
# their per-advisory exemptions from this array — `cargo deny check` reads
# it directly, and `scripts/extract-audit-ignores.py` translates it into
# `--ignore <RUSTSEC-ID>` flags for the `cargo audit` invocation in the
# soft job. Do NOT add a duplicate ignore list to the CI workflow — the
# split-gate design exists specifically to prevent that drift.
#
# When a new advisory needs temporary acceptance: add it here with a
# multi-line justification (issue link, why it does not apply, removal
# trigger). The required gate will keep failing until the entry is
# present, which is the point.
# =============================================================================

[graph]
targets = []
all-features = true

[advisories]
ignore = [
    # RUSTSEC-2024-0436 — paste 1.0.15 is archived/unmaintained.
    # Refs #714 (original observation), #1249 (re-investigation:
    # confirmed paste is purely transitive, no direct use site to swap),
    # and #1315 (github-actions auto-regenerated tracking issue;
    # closed via the PR that this entry now references).
    #
    # Dependency-graph entry point: paste enters the dep graph only when
    # the `jemalloc` feature is enabled, via the chain
    #   rustgate-server -> tikv-jemalloc-ctl 0.6.1 -> paste 1.0.15
    # `cargo tree --workspace -e normal --all-features -i paste` confirms
    # this is the only path; rustgate has no direct paste dependency, no
    # `use paste::*` import, and no `paste!` macro invocation in any
    # workspace crate.
    #
    # Risk surface: the advisory is "unmaintained" (informational), not a
    # vulnerability. paste is a proc-macro that runs at compile time and
    # produces no runtime code, so it carries no runtime-exploitable
    # security surface. A malicious upstream release would still need to
    # pass our `Cargo.lock` review and `cargo deny check sources` gate
    # before it could enter a build.
    #
    # Why we cannot fix this in our tree: the latest release of
    # `tikv-jemalloc-ctl` (0.6.1) still depends on `paste`. The community
    # fork `pastey` is a drop-in replacement for direct consumers, but
    # tikv-jemalloc-ctl is the consumer here, not us — adopting pastey
    # would require forking tikv-jemalloc-ctl itself. Upstream is aware:
    # https://github.com/tikv/jemallocator/pull/130 (open, not yet
    # merged) migrates jemallocator from `paste` to `preinterpret`. We
    # are tracking that PR rather than carrying a downstream fork.
    #
    # Removal trigger: drop this ignore the next release after
    # tikv/jemallocator#130 (or any equivalent upstream change) lands in
    # a published `tikv-jemalloc-ctl` and we bump our pin past it. At
    # that point `cargo tree -i paste` should return no entries.
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

# aws-lc-sys and aws-lc-fips-sys are licensed ISC + Apache-2.0 + OpenSSL.
# The OpenSSL license is FSF-approved. These crates provide the crypto
# primitives for rustls (default) and FIPS 140-3 validated builds.
[[licenses.exceptions]]
allow = ["OpenSSL"]
crate = "aws-lc-sys"
[[licenses.exceptions]]
allow = ["OpenSSL"]
crate = "aws-lc-fips-sys"

# ocsp-stapler is MPL-2.0. The MPL-2.0 is a file-level (weak) copyleft: only
# modifications to MPL-licensed source files must be released under MPL.
# Linking the unmodified upstream crate into a proprietary binary is
# explicitly permitted, so this exception is safe for downstream consumers.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "ocsp-stapler"

# ar_archive_writer is "Apache-2.0 WITH LLVM-exception". It is a transitive
# build-time dependency pulled in only via the `cedar` feature:
#   cedar-policy -> cedar-policy-core -> stacker -> psm -> ar_archive_writer
# (as a build dep). The LLVM exception is the standard LLVM linking
# exemption that waives GPL-style copyleft propagation when linked into
# a downstream binary; it is strictly more permissive than plain
# Apache-2.0 for our usage and is explicitly listed as acceptable by
# the FSF. Pinning the exception at the crate name keeps us from
# silently widening the LLVM-exception allowance to unrelated crates.
[[licenses.exceptions]]
allow = ["Apache-2.0 WITH LLVM-exception"]
crate = "ar_archive_writer"

