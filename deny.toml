[graph]
targets = []
all-features = true

[advisories]
ignore = [
    # rustls-pemfile 2.x is marked unmaintained (RUSTSEC-2025-0134).
    # Transitive dependency from async-nats; no action available until
    # async-nats drops the dep. Track upstream: https://github.com/nats-io/nats.rs
    "RUSTSEC-2025-0134",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-core"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-cot"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-enrollment"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-nats"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-proto"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-transport"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-server"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "rustgate-test-utils"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
