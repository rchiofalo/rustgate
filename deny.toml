# =============================================================================
# Audit policy — split-gate model (closes #776)
# =============================================================================
#
# CI runs two distinct audit jobs against this configuration:
#
#   1. `audit` (CI-blocking)
#      Runs `cargo deny check` and blocks merge ONLY on real
#      vulnerabilities — i.e. the `vulnerability` and `unsound` advisory
#      lints, plus the static `licenses` / `bans` / `sources` policies
#      below. The `unmaintained`, `yanked`, and `notice` lints are
#      demoted to warnings via the job's `--warn` flags so an upstream
#      crate going into maintenance mode does NOT block PR merges.
#
#   2. `audit-soft` (warning-only, never blocks)
#      Runs `cargo audit` with the same RUSTSEC ignore list as this
#      file (extracted by `scripts/extract-audit-ignores.py`) and emits
#      `::warning::` annotations on the PR for any unmaintained / yanked
#      / informational findings. Always exits 0. Operators see surface
#      area without false-positive merge blocks.
#
# Severity threshold (chosen for the required gate): `high`. The cargo-deny
# advisory model maps to RustSec's vulnerability classification — the
# `vulnerability` and `unsound` lints are the ones that carry a CVSS-style
# severity rating, and historically every RUSTSEC-* with a documented CVE
# in our dependency graph has been classified into one of those two buckets.
# Suppressing `unmaintained`/`yanked`/`notice` from the required gate
# captures the "high/critical only" policy issue #776 calls out.
#
# SINGLE SOURCE OF TRUTH: the `ignore` array in `[advisories]` below is
# the only list of advisories we knowingly accept. Both audit jobs derive
# their per-advisory exemptions from this array — `cargo deny check` reads
# it directly, and `scripts/extract-audit-ignores.py` translates it into
# `--ignore <RUSTSEC-ID>` flags for the `cargo audit` invocation in the
# soft job. Do NOT add a duplicate ignore list to the CI workflow — the
# split-gate design exists specifically to prevent that drift.
#
# When a new advisory needs temporary acceptance: add it here with a
# multi-line justification (issue link, why it does not apply, removal
# trigger). The required gate will keep failing until the entry is
# present, which is the point.
# =============================================================================

[graph]
targets = []
all-features = true

[advisories]
ignore = [
    # RUSTSEC-2024-0436 — paste 1.0.15 is archived/unmaintained.
    # Refs #714 (original observation), #1249 (re-investigation:
    # confirmed paste is purely transitive, no direct use site to swap),
    # #1315 and #1449 (github-actions auto-regenerated tracking issues).
    #
    # Dependency-graph entry points: paste enters via TWO independent
    # feature-gated chains — `cargo tree --workspace -e normal
    # --all-features -i paste` shows both, and neither alone accounts for
    # the dep:
    #   (1) jemalloc feature:
    #         rustgate-server -> tikv-jemalloc-ctl -> paste 1.0.15
    #   (2) dds-real feature:
    #         rustgate-server -> rustgate-dds -> rustdds -> cdr-encoding
    #           -> paste 1.0.15
    #         rustgate-server -> rustgate-dds -> rustdds -> paste 1.0.15
    #         (also reachable via ros2-client -> rustdds)
    # rustgate itself has no direct paste dependency, no `use paste::*`
    # import, and no `paste!` macro invocation in any workspace crate.
    # (An earlier revision of this note claimed jemalloc was the *only*
    # path; that was wrong — the dds-real / rustdds chain pulls paste
    # independently of jemalloc, which is why a jemalloc-only fix does not
    # clear the advisory. Corrected per #1449.)
    #
    # Risk surface: the advisory is "unmaintained" (informational), not a
    # vulnerability. paste is a proc-macro that runs at compile time and
    # produces no runtime code, so it carries no runtime-exploitable
    # security surface. A malicious upstream release would still need to
    # pass our `Cargo.lock` review and `cargo deny check sources` gate
    # before it could enter a build.
    #
    # Why we cannot fix this in our tree: paste is pulled by upstream
    # crates we do not own (tikv-jemalloc-ctl on one chain; rustdds /
    # cdr-encoding / ros2-client on the other). The community fork
    # `pastey` is a drop-in replacement for direct consumers, but the
    # consumers here are those upstreams, not us — adopting pastey would
    # require forking each. On the jemalloc side, upstream is aware:
    # https://github.com/tikv/jemallocator/pull/130 migrates jemallocator
    # off `paste` to `preinterpret`; a newer `tikv-jemalloc-ctl` (0.7.0)
    # is published, but bumping it alone would NOT clear this advisory
    # because chain (2) still pulls paste. The rustdds/cdr-encoding side
    # has no equivalent migration yet.
    #
    # Removal trigger: drop this ignore only when BOTH chains stop pulling
    # paste — i.e. when `cargo tree --all-features -i paste` returns no
    # entries after (a) tikv-jemalloc-ctl drops paste (tracking
    # tikv/jemallocator#130) AND (b) rustdds + cdr-encoding (+ ros2-client)
    # drop it — and we bump our pins past those releases. Bumping only one
    # chain is not sufficient and must not trigger removal.
    "RUSTSEC-2024-0436",
    # RUSTSEC-2020-0016 — `net2` 0.2.39 is unmaintained; the maintained
    # replacement is `socket2`.
    # Ref #1448 (github-actions auto-regenerated tracking issue;
    # re-verified accurate as of 2026-05 — see entry points below).
    #
    # Dependency-graph entry point: net2 enters the dep graph only when
    # the `rustgate-dds` `dds-real` feature is enabled, via the chain
    #   rustgate-server -> rustgate-dds -> rustdds 0.11 -> mio 0.6 -> net2
    # and the parallel chain
    #   rustgate-server -> rustgate-dds -> ros2-client 0.8 -> mio 0.6 -> net2
    # `cargo tree --features dds-real -i net2` confirms there is no other
    # use site; rustgate itself uses the workspace's `socket2` everywhere
    # (`net` socket-option helpers, plaintext listener, websocket).
    #
    # Risk surface: the advisory is "unmaintained" (informational), not a
    # vulnerability. The DDS transport in rustdds uses net2 only for its
    # legacy socket-options shim — the actual RTPS wire path runs on
    # std::net + mio I/O readiness. There is no known CVE, no
    # remote-exploitable surface, and the unmaintained crate is locked at
    # 0.2.39 (no upstream churn that could surprise us). The `audit-soft`
    # CI job surfaces this advisory as a warning so a future maintained
    # successor (or a vulnerability finding on the locked version) is
    # visible without blocking the merge gate today.
    #
    # Why we cannot fix this in our tree: rustdds 0.11.8 and ros2-client
    # 0.8.2 both pin `mio = "0.6"`; upgrading to mio 0.8+ would require
    # an upstream rustdds release. Forking rustdds to upgrade its mio
    # pin is out of scope; the project is actively maintained and a
    # future mio bump is the right fix.
    #
    # Removal trigger: drop this ignore the next release after rustdds
    # bumps its mio pin to `>= 0.8` (which removes the transitive net2
    # dep) and we update our `rustdds` workspace pin past it. At that
    # point `cargo tree --features dds-real -i net2` should return no
    # entries.
    "RUSTSEC-2020-0016",
    # RUSTSEC-2026-0173 — `proc-macro-error2` 2.0.1 is unmaintained. It is
    # itself a community fork of the older, also-unmaintained
    # `proc-macro-error`, so the successor is now flagged too.
    # First observed 2026-06-19 during a security-review sweep; it surfaces in
    # the CI `audit` job once the advisory-db pin refreshes past this advisory.
    #
    # Dependency-graph entry point: proc-macro-error2 enters ONLY on Linux
    # targets — `local-ip-address` uses its `neli` netlink backend there, so a
    # non-Linux host shows nothing under `-e normal` and you need
    # `cargo tree --workspace --all-features --target all -i proc-macro-error2`
    # to see it. It enters under the `rustgate-dds` feature via:
    #   rustgate-server -> rustgate-dds -> ros2-client 0.8 -> rustdds 0.11
    #     -> local-ip-address 0.6 -> neli 0.7 -> getset 0.1.6 (proc-macro)
    #     -> proc-macro-error2 2.0.1
    # (rustdds also pulls local-ip-address directly — same terminal chain.)
    # rustgate has no direct dependency on proc-macro-error2, getset, or neli,
    # and no use site in any workspace crate.
    #
    # Risk surface: the advisory is "unmaintained" (informational), not a
    # vulnerability. proc-macro-error2 is a proc-macro helper that `getset`
    # uses at compile time to emit getter/setter methods; it produces no
    # runtime code and carries no runtime-exploitable surface. There is no
    # known CVE. The `audit-soft` CI job continues to surface it as a warning.
    #
    # Why we cannot fix this in our tree: the crate is pulled by upstreams we
    # do not own — `getset` (via `neli`, via `local-ip-address`, via `rustdds`
    # / `ros2-client`). neli 0.7.4 pins getset 0.1, local-ip-address 0.6 pins
    # neli 0.7, and rustdds 0.11.8 pins local-ip-address 0.6, so clearing the
    # advisory needs an upstream release (getset migrating off proc-macro-error2,
    # or local-ip-address dropping its neli backend), not a change here.
    # Forking that chain is out of scope.
    #
    # Removal trigger: drop this ignore the next release after the upstream
    # chain stops pulling proc-macro-error2 (getset migrates off it, or
    # local-ip-address / neli / rustdds update) and we bump our `rustdds` /
    # `ros2-client` pins past it — i.e. when
    # `cargo tree --workspace --all-features --target all -i proc-macro-error2`
    # returns no entries.
    "RUSTSEC-2026-0173",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

# aws-lc-fips-sys (the `fips` feature) is licensed ISC + Apache-2.0 + OpenSSL.
# The FSF considers the OpenSSL / SSLeay licenses incompatible with the GPL
# family, so rustgate's NOTICE carries an AGPL-3.0 section 7 additional
# permission covering the combination with AWS-LC. aws-lc-sys, used by every
# other build, carries no OpenSSL terms and needs no exception.
[[licenses.exceptions]]
allow = ["OpenSSL"]
crate = "aws-lc-fips-sys"

# ocsp-stapler is MPL-2.0. The MPL-2.0 is a file-level (weak) copyleft: only
# modifications to MPL-licensed source files must be released under MPL.
# It is compatible with rustgate's AGPL-3.0-only license: MPL-2.0 names the
# GNU licenses as "Secondary Licenses" (section 3.3), and ocsp-stapler does
# not carry the Exhibit B "Incompatible With Secondary Licenses" notice.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "ocsp-stapler"

# ar_archive_writer is "Apache-2.0 WITH LLVM-exception". It is a transitive
# build-time dependency pulled in only via the `cedar` feature:
#   cedar-policy -> cedar-policy-core -> stacker -> psm -> ar_archive_writer
# (as a build dep). The LLVM exception is the standard LLVM linking
# exemption that waives GPL-style copyleft propagation when linked into
# a downstream binary; it is strictly more permissive than plain
# Apache-2.0 for our usage and is explicitly listed as acceptable by
# the FSF. Pinning the exception at the crate name keeps us from
# silently widening the LLVM-exception allowance to unrelated crates.
[[licenses.exceptions]]
allow = ["Apache-2.0 WITH LLVM-exception"]
crate = "ar_archive_writer"

# Workspace crates. rustgate is licensed AGPL-3.0-only (see LICENSE and
# NOTICE). AGPL-3.0 is deliberately NOT in the global `allow` list above:
# pulling in a third-party AGPL dependency should be a reviewed decision,
# so the allowance is pinned to our own crates by name.
[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "rustgate-core"
